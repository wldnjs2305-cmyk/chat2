:root{
  --bg:#FFFFFF; --panel:#FFFFFF; --ink:#191820; --soft:#8B8896; --line:#E7E5EC;
  --accent:#6F5FC4; --accent-ink:#fff; --narr:#736F80;--faint:#4C4857; --user-bg:#E3DFF6; --char-bg:#EFEEF2; --field:#F4F3F7;
  --danger:#b04545;
  --font-body:"GowoonDodum","Gowun Dodum","Noto Sans KR",system-ui,-apple-system,sans-serif;
  --font-serif:"GounBatang","Gowun Batang",serif;
  --font-size:15px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b1824; --field:#2a2536; --panel:#252131; --ink:#ece7f3; --soft:#a79fb6; --line:#3a3448;
    --accent:#d99bc6; --accent-ink:#21172a; --narr:#c0b5d2;--faint:#8b8399; --user-bg:#342b44; --char-bg:#252131; --danger:#e08a8a;
  }
}
:root[data-theme="night"],:root[data-theme="dark"]{
  --bg:#1b1824; --field:#2a2536; --panel:#252131; --ink:#ece7f3; --soft:#a79fb6; --line:#3a3448;
  --accent:#d99bc6; --accent-ink:#21172a; --narr:#c0b5d2;--faint:#8b8399; --user-bg:#342b44; --char-bg:#252131; --danger:#e08a8a;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;height:100dvh;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:var(--font-size);line-height:1.6;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{position:fixed;top:0;left:0;right:0;height:100%;height:100dvh;overflow:hidden;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.on{display:flex}

header.bar{display:flex;align-items:center;gap:6px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
header.bar h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.homebar{gap:6px;position:relative;padding:10px 14px}
.homebar>.icon{height:38px;min-width:38px;padding:0 10px;border-radius:12px;color:var(--soft);font-size:14px;font-weight:500}
.homebar>.icon:hover{background:var(--panel);color:var(--ink)}
.homebar>.icon svg{display:block}
.homebar .ttl{position:absolute;left:0;right:0;text-align:center;pointer-events:none}
.homebar .ttl h1{font-size:19px}
.homebar>.icon,.homebar>.plus{position:relative;z-index:1}
.homebar .spacer{flex:1}
.plus{width:38px;height:38px;flex:none;border:0;border-radius:12px;background:var(--user-bg);color:var(--accent);font-size:22px;line-height:1;display:grid;place-items:center}
.homebar .icon{display:grid;place-items:center}
header.bar h2{font-size:16px;margin:0;flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon{background:none;border:0;padding:6px 8px;border-radius:8px;color:var(--soft);font-size:15px}
.icon:hover{background:var(--line);color:var(--ink)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn:disabled{opacity:.5}

/* home */
.list{flex:1;overflow-y:auto;padding:8px 0}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;border:0;background:none;width:100%;text-align:left}
#charList .row{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#charList .row .pin{font-size:.78em;margin-left:5px;opacity:.55}
.row:hover{background:var(--panel)}
.optcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 22px}
.optcard label:first-child{margin-top:0}
.icon.back{font-size:26px;line-height:1;padding:0 4px 4px}
header.bar .icon.back+h2,header.bar .icon.back+h1{margin-left:-2px}
.cropwrap{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:60}
.cropsheet{background:var(--panel);border-radius:18px;padding:18px;width:min(320px,92vw);display:flex;flex-direction:column;align-items:center;gap:14px}
.croptitle{font-weight:700;align-self:flex-start}
.cropbox{position:relative;overflow:hidden;border-radius:12px;background:#111;touch-action:none;cursor:grab}
.cropbox img{position:absolute;left:0;top:0;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.cropmask{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 999px rgba(0,0,0,.5);pointer-events:none}
.cropzoom{width:100%;padding:0}
.cropbtns{display:flex;gap:8px;width:100%}
.cropbtns .btn{flex:1}
.swl{display:flex;gap:10px;align-items:center;color:var(--ink);font-size:15px;margin:0 0 8px}
.swl input{width:20px;height:20px}
#qMem{position:relative}
.mdot{position:absolute;top:3px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.msgmenu{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:50}
.msgmenu .sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;min-width:180px;overflow:hidden}
.msgmenu button{display:block;width:100%;border:0;background:none;padding:14px 18px;text-align:left;border-bottom:1px solid var(--line);color:var(--ink)}
.msgmenu button:last-child{border-bottom:0}
.avrow{display:flex;align-items:center;gap:14px;margin-top:6px}
.avbtns{display:flex;gap:8px;flex-wrap:wrap}
.av-lg{width:72px;height:72px;font-size:30px}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.hav{width:30px;height:30px;font-size:15px;flex:none}
.av{overflow:hidden;width:48px;height:48px;border-radius:50%;background:var(--user-bg);display:grid;place-items:center;font-size:22px;flex:none;font-family:var(--font-serif);font-weight:700;color:var(--accent)}
.row .meta{flex:1;min-width:0}
.row .nm{font-weight:700}
.row .pv{color:var(--soft);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:48px 24px;text-align:center;color:var(--soft)}
.empty p{font-family:var(--font-serif);font-size:18px;color:var(--ink);margin:0 0 6px}
.fab{margin:4px 16px 16px;align-self:stretch}
.ver-now{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:20px}
.ver-now .big{font-family:var(--font-serif);font-size:22px;font-weight:700}
.ver-now .st{color:var(--soft);font-size:14px;margin:4px 0 12px}
.ver-now .st.new{color:var(--accent);font-weight:700}
.ver-now .btns{display:flex;gap:8px}
.ver-now .btns .btn{flex:1}
.cl{margin:0 0 18px}
.cl h3{font-size:15px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.cl h3 .tag{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--user-bg);color:var(--accent)}
.cl ul{margin:0;padding-left:20px;color:var(--soft);font-size:14px}

@font-face{font-family:NeoDunggeunmo;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.3/NeoDunggeunmo.woff') format('woff');font-weight:400;font-display:swap}
.phone-status{display:none}
/* ---- 소설 배경 사진 ---- */
.nbgrow{display:flex;align-items:center;gap:14px;margin-top:6px}
.bgprev{position:relative;width:96px;height:170px;border-radius:14px;overflow:hidden;flex:0 0 auto;background:var(--panel) center/cover no-repeat;border:1px solid var(--line)}
.bgprev i{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.bgprev i::before{content:"";position:absolute;left:12px;right:12px;top:30px;height:34px;background:repeating-linear-gradient(180deg,rgba(235,235,240,.8) 0 2px,transparent 2px 9px)}
.bgprev i::after{content:"";position:absolute;left:12px;right:28px;top:78px;height:11px;background:repeating-linear-gradient(180deg,#F4F4F8 0 2px,transparent 2px 9px)}
.bgprev span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px}
/* 배경 사진 — 어두운 막을 덮고 밝은 글씨를 얹는다 (원본 방식) */
body[data-novelbg]{background:#0c0c10 !important;background-image:none !important}
body[data-novelbg]::after{content:"";position:fixed;inset:-30px;z-index:0;pointer-events:none;background-image:var(--novelbg);background-size:cover;background-position:center;background-repeat:no-repeat}
body[data-novelbg] .app{z-index:2;isolation:isolate;background:transparent !important;border:0 !important;box-shadow:none !important}
body[data-novelbg] .app::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:rgba(0,0,0,.45)}
body[data-novelbg] #chat,body[data-novelbg] .log{background:transparent !important;background-image:none !important;box-shadow:none !important}
body[data-novelbg] .log .msg.char .body{background:transparent !important;border:0 !important;box-shadow:none !important}
body[data-novelbg] .log :is(.body,.nline,.thinking,.ooc,.who){color:#F4F4F8;text-shadow:0 1px 2px rgba(0,0,0,.55),0 0 1px rgba(0,0,0,.45)}
body[data-novelbg] .log .narr{color:rgba(232,232,240,.80);font-style:italic}
body[data-novelbg] .log .say{color:var(--saycol,#F4F4F8);text-shadow:none}
body[data-novelbg] .log .spk{color:#F4F4F8}
body[data-novelbg] .log .gloss{color:rgba(232,232,240,.75)}
body[data-novelbg] .log .nline{color:rgba(230,230,238,.8)}
body[data-novelbg] .log .thinking{color:rgba(230,230,238,.75)}
body[data-novelbg] .log .typing{color:rgba(230,230,238,.75)}
body[data-novelbg] .log .ooc{color:rgba(230,230,238,.7);border-color:rgba(255,255,255,.3)}
body[data-novelbg] .log .msg.user .body{background:rgba(255,255,255,.12) !important;border:0 !important;box-shadow:none !important}
body[data-novelbg] .log .acts button{background:rgba(20,20,26,.55);border-color:rgba(255,255,255,.18);color:#F1F1F5}
body[data-novelbg] #chat header.bar{background:transparent !important;background-image:none !important;backdrop-filter:none !important;-webkit-backdrop-filter:none !important;border-bottom:0 !important;box-shadow:none !important}
body[data-novelbg] #chat header.bar :is(h2,.icon){color:#F4F4F8 !important;text-shadow:0 1px 3px rgba(0,0,0,.6)}
body[data-novelbg] #chat .phone-status{display:none !important}
body[data-novelbg] #chat .composer{background:#17171C !important;background-image:none !important;backdrop-filter:none !important;-webkit-backdrop-filter:none !important;border-color:rgba(255,255,255,.08) !important;box-shadow:none !important}
body[data-novelbg] #chat .composer .quick button{background:transparent;border-color:rgba(255,255,255,.14);color:rgba(230,230,238,.62) !important;font-family:inherit}
body[data-novelbg] #chat .composer textarea{background:#26262D !important;color:#F1F1F5 !important;border:1px solid rgba(255,255,255,.08) !important;box-shadow:none !important}
body[data-novelbg] #chat .composer textarea::placeholder{color:rgba(230,230,238,.45)}
body[data-novelbg] #send{background:#F1F1F5 !important;color:#17171C !important;border:0 !important;box-shadow:none !important}

.searchwrap{padding:0 16px 10px}
.searchwrap input{width:100%}
select{width:100%}
.backup{display:flex;justify-content:center;gap:8px;padding-top:8px}
.backup .icon{font-size:13px}

/* editor */
.form{flex:1;overflow-y:auto;padding:16px 16px 32px}
fieldset{border:0;margin:0 0 22px;padding:0}
legend{font-family:var(--font-serif);font-weight:700;font-size:17px;padding:0;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--soft);margin:12px 0 5px}
input[type=text],textarea,select{width:100%;font-size:16px;background:var(--field,var(--panel));border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
textarea{min-height:90px;line-height:1.55}
textarea.tall{min-height:180px}
.hint{font-size:12px;color:var(--soft);margin-top:4px}
.two{display:grid;grid-template-columns:80px 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--panel);padding:9px 4px;font-size:14px;color:var(--soft)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.actions{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.actions .btn{flex:1;white-space:nowrap}
.actions #delChar,.actions #draftChar{flex:0 0 auto;padding-left:14px;padding-right:14px}

/* chat */
.log{flex:1;overflow-y:auto;padding:18px 16px 8px}
button,.quick button,.icon{touch-action:manipulation}
.msg{margin:0 0 18px}
.mrow{display:flex;gap:10px;align-items:flex-start}
.mcol{flex:1;min-width:0}
.mav{width:38px;height:38px;font-size:17px}
.mrow .mcol>.who{margin:3px 0 7px 2px;line-height:1.3}
.msg.char .body{background:var(--char-bg);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:14px 16px}
.msg.user{display:flex;flex-direction:column;align-items:flex-end}
.msg.user .body{background:var(--user-bg);border-radius:17px 4px 17px 17px;padding:9px 13px;max-width:85%;width:fit-content;line-height:1.85;letter-spacing:-.004em}
.msg.user .body p{margin:0}
.msg.user .body p+p{margin-top:.35em}
.who{font-size:13px;color:var(--soft);margin:6px 0 6px 2px;font-weight:500}
.body p{margin:0 0 .7em}
.body p:last-child{margin-bottom:0}
.gloss{color:var(--faint);font-size:.92em}
.log:not(.pron-on) .pron,.log:not(.pron-on) .glc{display:none}
.log:not(.trans-on) .trans,.log:not(.trans-on) .glc{display:none}
.log:not(.pron-on):not(.trans-on) .gloss{display:none}
.tcard{background:#f3f4f6;border:1.5px solid #d9dbe0;border-radius:18px;overflow:hidden;margin:0 0 10px;color:#1f2329;font-family:-apple-system,"Noto Sans KR",sans-serif}
.thead{padding:18px 18px 14px;border-bottom:1px solid #d9dbe0}
.tpill{display:inline-block;background:#dfe3f7;color:#3949b5;font-size:13px;font-weight:600;padding:5px 11px;border-radius:9px}
.ttitle{font-size:18px;font-weight:700;margin:12px 0 6px}
.tmeta{font-size:13px;color:#7a7f89}
.tbody{padding:14px 18px 18px;font-size:var(--card-fs,15px);line-height:1.75}
.tsec{margin-top:4px}
.tent{margin-top:2px}
.trow{}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 10px;font-size:var(--card-fs,15px)}
.card .ctitle{font-size:12px;letter-spacing:.06em;color:var(--accent);font-weight:700;margin-bottom:8px}
.crow{margin:0 0 6px;line-height:1.65}
.crow:last-child{margin-bottom:0}
.clab{color:var(--soft);font-size:.88em;margin-right:8px}
.paper{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.07);margin:0 0 10px;color:var(--ink);font-size:calc(var(--card-fs,15px) * 1.1);padding:19px 20px 22px}
.paper .ruled{line-height:1.9em;background-image:repeating-linear-gradient(180deg,transparent 0,transparent calc(1.9em - 1px),var(--line) calc(1.9em - 1px),var(--line) 1.9em);background-position:0 0;background-repeat:repeat;white-space:pre-wrap}
.paper.letter .lto{line-height:1.9em;margin:0 0 1.9em}
.paper.letter .lsign{display:block;text-align:right;line-height:1.9em;margin:1.9em 0 0}
.paper.diary{padding:16px 20px 22px}
.paper.diary .dhead{display:flex;align-items:baseline;gap:10px;font-size:.92em;color:var(--soft);padding-bottom:9px;margin-bottom:11px;border-bottom:1.5px solid var(--line)}

.tkiss .tk-top{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 40px);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.tkiss .tk-av{width:44px;height:44px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-size:18px;background:#f5eef2;color:#8a7a86}
.tkiss .tk-av img{width:100%;height:100%;object-fit:cover}
.tkiss .tk-nm{font-size:14px;color:#6f6470}
.tkiss .tk-tm{font-size:12px;color:#b3a8b0;min-height:1.2em;font-variant-numeric:tabular-nums}
.tkiss .tk-hint{position:absolute;left:0;right:0;top:46%;text-align:center;font-size:14px;color:#b3a8b0;pointer-events:none;transition:opacity .4s}
.tkiss .tk-hint.gone{opacity:0}
.tkiss .tk-me,.tkiss .tk-you{position:absolute;left:-42px;top:-42px;width:84px;height:84px;opacity:0;pointer-events:none;transition:opacity .3s,color .3s}
.tkiss .tk-me svg,.tkiss .tk-you svg{width:100%;height:100%;display:block}
.tkiss .tk-me{color:#9a9398}
.tkiss .tk-you{color:#3a3438}
.tkiss .tk-me.on,.tkiss .tk-you.on{opacity:.9}
.tkiss.touch .tk-me{color:#ff6fae;opacity:1}
.tkiss{--heat:0}
.tkiss .tk-me,.tkiss .tk-you{filter:drop-shadow(0 0 calc(var(--heat) * 16px) rgba(255,95,165,.85))}
.tkiss.touch .tk-me{color:var(--fp,#2a2427)}
.tkiss.touch .tk-you{color:var(--fp,#2a2427);opacity:1;animation:tkbeat calc(1s - var(--heat) * .5s) ease-in-out infinite}
.tkiss .tk-bloom{position:absolute;left:-90px;top:-90px;width:180px;height:180px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,111,174,.55),rgba(255,160,205,.22) 45%,transparent 70%);opacity:var(--heat);scale:calc(.6 + var(--heat) * 2.2)}
@keyframes tkbeat{0%,100%{scale:1}15%{scale:1.025}30%{scale:1}}
.tkiss.pounce .tk-you{animation:tkpounce .55s ease-out,tkbeat calc(1s - var(--heat) * .5s) ease-in-out .55s infinite}
@keyframes tkpounce{0%{scale:1.6}45%{scale:.86}75%{scale:1.1}100%{scale:1}}
.tkiss .tk-fx{position:absolute;inset:0;pointer-events:none}
.tkiss .tk-fx i{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:2px solid rgba(255,111,174,.6);animation:tkring 1.1s ease-out forwards}
@keyframes tkring{to{transform:scale(4);opacity:0}}
.tkiss .tk-end{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);min-height:44px;padding:0 18px;border:0;background:none;color:#a39aa1;font-size:14px}
@media (prefers-reduced-motion:reduce){.tkiss .tk-fx i,.tkiss.touch .tk-you{animation:none}}
/* 손끝 뽀뽀 카드 */
.msg.kissu{display:flex;justify-content:center;margin:6px 0}
.kiss-card{width:min(260px,82%);padding:12px 16px 10px;border-radius:14px;background:#fff4f9;color:#2a1520;border:1.5px solid #ff9ecb;box-shadow:0 0 14px rgba(255,126,185,.28);font-size:13.5px}
.kiss-card .kc-fp{display:flex;justify-content:center;margin:2px 0 4px}
.kiss-card .kc-fp svg{width:34px;height:34px;color:#9a9398}
.kiss-card .kc-fp svg+svg{margin-left:-14px;color:#3a3438}
:root[data-theme="night"] .kiss-card .kc-fp svg{color:#a898a6}
:root[data-theme="night"] .kiss-card .kc-fp svg+svg{color:#f4f0f4}
.kiss-card .kc-hd{text-align:center;font-size:14px;letter-spacing:2px;color:#c2357e;margin-bottom:8px}
.kiss-card .kc-row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-top:1px dashed #f3c4da}
.kiss-card .kc-row span{color:#8a5a72}
.kiss-card .kc-row b{font-weight:400}
.kiss-card .kc-ft{text-align:right;font-size:11px;color:#a07a8d;margin-top:6px}
:root[data-theme="night"] .kiss-card{background:#1d1822;color:#f4f0f4;border-color:#ff7eb9}
:root[data-theme="night"] .kiss-card .kc-row{border-top-color:#3f343d}
:root[data-theme="night"] .kiss-card .kc-row span,:root[data-theme="night"] .kiss-card .kc-ft{color:#a898a6}
:root[data-theme="night"] .kiss-card .kc-hd{color:#ff7eb9;text-shadow:0 0 6px rgba(255,126,185,.5)}
:root[data-skin="tk"] .kiss-card{border-radius:0}
:root[data-skin="tk"] .kiss-card .kc-hd,:root[data-skin="tk"] .kiss-card .kc-ft{font-family:"NeoDunggeunmo","DotGothic16",monospace}

/* 같이 그림 그리기 */
.drw{position:fixed;inset:0;z-index:9999;background:#f7f3f5;color:#3a3238;display:flex;flex-direction:column;font-family:var(--font-body);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.drw .dw-top{display:flex;align-items:center;gap:10px;padding:8px 10px}
.drw .dw-x,.drw .dw-done{min-width:44px;min-height:44px;border:0;background:none;color:inherit;font-size:15px}
.drw .dw-done{color:#c2357e}
.drw .dw-cm{min-height:34px;padding:0 8px;flex:none;border:1px solid #e3d9df;border-radius:18px;background:#fff;color:#7a6a78;font-size:12.5px;white-space:nowrap}
.drw .dw-cm.off{background:#f1ebef;color:#a99aa6;text-decoration:line-through}
:root[data-skin="tk"] .drw .dw-cm{border-radius:0}
.drw .dw-av{width:36px;height:36px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#fff;flex:none;font-size:15px}
.drw .dw-av img{width:100%;height:100%;object-fit:cover}
.drw .dw-st{flex:1;font-size:13.5px;color:#7a6a78;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drw.wait .dw-st{color:#c2357e}
.drw .dw-paper{flex:1;min-height:0;min-width:0;display:grid;place-items:center;padding:6px 12px;overflow:hidden}
.drw canvas{background:#fff;border-radius:6px;box-shadow:0 2px 12px rgba(60,40,55,.12);touch-action:none;transform-origin:center center}
.drw .dw-paper{position:relative}
.drw .dw-ask{position:absolute;inset:0;z-index:5;background:rgba(40,30,38,.4);display:flex;align-items:center;justify-content:center;padding:24px}
.drw .dw-askbox{width:min(320px,100%);background:#fff;border-radius:14px;padding:18px 16px 12px;color:#3a3238;box-shadow:0 8px 30px rgba(40,30,38,.25)}
.drw .dw-askbox p{margin:0 0 14px;font-size:15px;line-height:1.5;text-align:left}
.drw .dw-askbox div{display:flex;gap:8px;justify-content:flex-end}
.drw .dw-askbox button{min-height:44px;padding:0 16px;border:0;border-radius:10px;background:#f1ebef;color:#3a3238;font-size:15px}
.drw .dw-askbox [data-y]{background:#ffd6ea;color:#2a1520}
.drw{touch-action:none;-webkit-user-select:none;user-select:none}
.drw .dw-paper{touch-action:none}
.drw .dw-pen{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:rgba(255,111,174,.35);box-shadow:0 0 0 2px rgba(255,111,174,.55);opacity:0;pointer-events:none;transition:opacity .2s}
.drw .dw-pen.on{opacity:1}
.drw .dw-pen.think{opacity:.55;transition:opacity .2s}
.drw .dw-pal{position:relative;background:conic-gradient(#ff6fae,#ffc94d,#5cc27a,#6fb6ff,#b48cff,#ff6fae) !important}
.drw .dw-pal::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--pc,#ff6fae);box-shadow:0 0 0 2px #fff;pointer-events:none}
.drw .dw-pal input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;cursor:pointer}
.drw .dw-palbox{margin:0 0 4px;padding:10px;border-radius:12px;background:#fff;box-shadow:0 2px 14px rgba(60,40,55,.16)}
.drw .dw-palbox[hidden]{display:none}
.drw .dw-pgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.drw .dw-pgrid button{aspect-ratio:1;border:0;border-radius:50%;box-shadow:0 0 0 1px #e3d9df;padding:0;min-width:0}
.drw .dw-pick{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:8px;font-size:13px;color:#7a6a78}
.drw .dw-pick input{width:44px;height:32px;border:0;padding:0;background:none}
.drw .dw-ar{font-size:22px !important;line-height:1;padding:0 !important;width:40px;min-width:40px !important}
:root[data-skin="tk"] .drw .dw-palbox{border-radius:0}
.drw .dw-zm{display:flex;justify-content:flex-end;gap:6px;padding:0 12px 2px;flex:none}
.drw .dw-zm button{min-width:36px;min-height:34px;padding:0 12px;border:1px solid #e3d9df;border-radius:17px;background:#fff;color:#7a6a78;font-size:13px}
.drw .dw-fit{font-size:13px !important}
.drw .dw-fit[hidden]{display:none}
.drw .dw-row button{padding:0 10px !important}
.drw.wait canvas{box-shadow:0 0 0 2px rgba(255,111,174,.5),0 2px 12px rgba(60,40,55,.12)}
.drw .dw-tools{display:flex;flex-direction:column;gap:8px;padding:8px 12px 14px}
.drw .dw-cols{display:flex;justify-content:center;align-items:center;gap:10px}
.drw .dw-pal{display:block;flex:none;margin:0}
.drw .dw-c{width:32px;height:32px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #d8cdd4;padding:0}
.drw .dw-c.on{box-shadow:0 0 0 3px #3a3238}
.drw .dw-er{width:auto;border-radius:16px;padding:0 10px;background:#fff;color:#7a6a78;font-size:12.5px}
.drw .dw-row{display:flex;gap:8px}
.drw .dw-row button{min-height:44px;border:0;border-radius:10px;background:#fff;color:#3a3238;font-size:14px;padding:0 12px}
.drw .dw-pass{flex:1;background:#ffd6ea !important;color:#2a1520 !important}
.drw.wait .dw-undo,.drw.wait .dw-clear,.drw.wait .dw-pass,.drw.wait .dw-done,.drw.wait .dw-ar{opacity:.45;pointer-events:none}
:root[data-skin="tk"] .drw .dw-row button,:root[data-skin="tk"] .drw canvas,:root[data-skin="tk"] .drw .dw-av{border-radius:0}
.draw-card img{display:block;width:100%;border-radius:6px;margin:2px 0 4px;background:#fff}
:root[data-skin="tk"] .draw-card img{border-radius:0}

.tts-b{align-self:flex-start;margin:4px 0 0 2px;min-width:32px;min-height:32px;padding:0 8px;border:1px solid var(--line);border-radius:16px;background:transparent;color:var(--soft);font-size:12px;line-height:1;cursor:pointer}
.tts-b.on{color:var(--accent);border-color:var(--accent)}
.tts-b.load{opacity:.6}
:root[data-skin="tk"] .tts-b{border-radius:0;border-color:var(--tk-dash);color:var(--tk-mauve);font-family:"NeoDunggeunmo","DotGothic16",monospace}
:root[data-skin="tk"] .tts-b.on{color:var(--tk-pink);border-color:var(--tk-pink);box-shadow:0 0 8px rgba(255,126,185,.45)}
</style>
</head>

 <span class="w">づ<span class="h">♡</span> ⊂</span></div><div class="s">✦ʚ<span>♡</span>ɞ✦</div></div><div class="phone-status" aria-hidden="true"><span class="phone-signal"><i></i><i></i><i></i><i></i></span><span class="phone-envelope"></span><span class="phone-battery"></span></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const KEY = "bamp_v1";
let store = { chars: [], chats: {}, theme: null };
try { const raw = localStorage.getItem(KEY); if (raw) store = Object.assign(store, JSON.parse(raw)); } catch(e) {}
let cur = null, busy = false, ctl = null;

// ---- 브라우저 DB (IndexedDB) — 깃허브 버전용 큰 저장소 ----
const IDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open("bampyeonji", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const run = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction("kv", mode), rq = fn(t.objectStore("kv"));
      t.oncomplete = () => res(rq && rq.result);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  };
  return {
    get: k => run("readonly", st => st.get(k)),
    set: (k, v) => run("readwrite", st => st.put(v, k)),
    del: k => run("readwrite", st => st.delete(k)),
    prefix: async pre => {
      const db = await open();
      return new Promise((res, rej) => {
        const out = {}, t = db.transaction("kv", "readonly"), rq = t.objectStore("kv").openCursor();
        rq.onsuccess = () => { const c = rq.result; if (c) { if (String(c.key).indexOf(pre) === 0) out[c.key] = c.value; c.continue(); } };
        t.oncomplete = () => res(out); t.onerror = () => rej(t.error);
      });
    }
  };
})();
const useIDB = !window.claude && !!window.indexedDB;
let idbOn = false, idbTimer = null;
function idbSaveSoon() {
  clearTimeout(idbTimer);
  idbTimer = setTimeout(() => { IDB.set("store", JSON.parse(JSON.stringify(store))).catch(() => {}); }, 400);
}
async function initIDB() {
  try {
    const saved = await IDB.get("store");
    const localHas = store.chars && store.chars.length;
    if (saved && saved.chars && (saved.chars.length || !localHas)) store = Object.assign({ chars: [], chats: {}, theme: null }, saved);
    else await IDB.set("store", JSON.parse(JSON.stringify(store)));
    idbOn = true;
    try { localStorage.removeItem(KEY); } catch (e) {}
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
    if ($("#home").classList.contains("on")) renderHome();
  } catch (e) { idbOn = false; }
}

// ---- 계정 저장소 (업데이트해도 유지) ----
let db = null, uid = null, dbReady = false;
const pages = {};
const dirtyChats = new Set();
const dirtyAvatars = new Set();
let metaDirty = false, flushTimer = null;
const col = () => db.collection("data/users/" + uid);
const PAGE = 180000;

function save(chatId) {
  if (idbOn) idbSaveSoon();
  else { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e) {} }
  metaDirty = true;
  if (chatId === undefined) chatId = cur;
  if (chatId) { dirtyChats.add(chatId); const lc = store.chars.find(x => x.id === chatId); if (lc) lc.lastAt = Date.now(); }
  if (!dbReady) return;
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, 700);
}

function splitPages(list) {
  const out = []; let curp = [], size = 0;
  list.forEach(m => {
    const s = JSON.stringify(m).length;
    if (curp.length && size + s > PAGE) { out.push(curp); curp = []; size = 0; }
    curp.push(m); size += s;
  });
  if (curp.length || !out.length) out.push(curp);
  return out;
}

async function flush() {
  if (!dbReady) return;
  const chats = [...dirtyChats]; dirtyChats.clear();
  const doMeta = metaDirty; metaDirty = false;
  try {
    for (const id of chats) {
      const exists = store.chars.some(c => c.id === id);
      const parts = exists ? splitPages(store.chats[id] || []) : [];
      for (let i = 0; i < parts.length; i++) await col().doc(`chat_${id}_${i}`).set({ msgs: parts[i] });
      const old = pages[id] || 0;
      for (let i = parts.length; i < old; i++) await col().doc(`chat_${id}_${i}`).delete();
      if (exists) pages[id] = parts.length; else delete pages[id];
    }
    for (const id of [...dirtyAvatars]) {
      const c = store.chars.find(x => x.id === id);
      if (c && c.avatar) await col().doc(`avatar_${id}`).set({ img: c.avatar });
      else await col().doc(`avatar_${id}`).delete().catch(() => {});
      if (c && c.nbg) await col().doc(`nbg_${id}`).set({ img: c.nbg });
      else await col().doc(`nbg_${id}`).delete().catch(() => {});
      const cimgs = {}; ((c && c.cast) || []).forEach(x => { if (x && x.id && x.avatar) cimgs[x.id] = x.avatar; });
      if (Object.keys(cimgs).length) await col().doc(`castav_${id}`).set({ imgs: cimgs });
      else await col().doc(`castav_${id}`).delete().catch(() => {});
      dirtyAvatars.delete(id);
    }
    if (doMeta || chats.length) await col().doc("meta").set({ chars: store.chars.map(c => { const o = Object.assign({}, c); delete o.avatar; delete o.nbg; if (Array.isArray(o.cast)) o.cast = o.cast.map(x => { const y = Object.assign({}, x); delete y.avatar; return y; }); return o; }), theme: store.theme || null, pages });
    setSync("");
  } catch (e) {
    chats.forEach(id => dirtyChats.add(id)); metaDirty = true;
    setSync("계정 저장에 실패했어요. 이 기기에는 저장돼 있어요.");
  }
}
function setSync(t) { const b = $("#syncBanner"); b.textContent = t; b.hidden = !t; }

async function initDb() {
  try {
    const [d, u] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!d || !u) return;
    const id = await u.id();
    if (!id) return;
    db = d; uid = id;
    const meta = await col().doc("meta").get();
    if (meta.exists) {
      const m = meta.data();
      Object.assign(pages, m.pages || {});
      const chats = {};
      await Promise.all((m.chars || []).map(async c => {
        const n = pages[c.id] || 0, list = [];
        const snaps = await Promise.all([...Array(n)].map((_, i) => col().doc(`chat_${c.id}_${i}`).get()));
        snaps.forEach(s => { if (s.exists) list.push(...(s.data().msgs || [])); });
        chats[c.id] = list;
        try { const a = await col().doc(`avatar_${c.id}`).get(); if (a.exists) c.avatar = a.data().img; } catch (e) {}
        try { const nb = await col().doc(`nbg_${c.id}`).get(); if (nb.exists) c.nbg = nb.data().img; } catch (e) {}
        if (Array.isArray(c.cast) && c.cast.length) { try { const ca = await col().doc(`castav_${c.id}`).get(); if (ca.exists) { const im = ca.data().imgs || {}; c.cast.forEach(x => { if (x && im[x.id]) x.avatar = im[x.id]; }); } } catch (e) {} }
      }));
      store = { chars: m.chars || [], chats, theme: m.theme || store.theme };
      try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e) {}
      try { applyLook(); } catch (e) {}
      dbReady = true;
    } else {
      dbReady = true;
      if (store.chars.length) { store.chars.forEach(c => dirtyChats.add(c.id)); metaDirty = true; await flush(); }
    }
    if ($("#home").classList.contains("on")) renderHome();
  } catch (e) {
    setSync("계정 저장소에 연결하지 못했어요. 지금은 이 기기에만 저장돼요.");
  }
}
if (window.claude) initDb();
else if (useIDB) initIDB();
document.addEventListener("visibilitychange", () => { if (document.hidden && idbOn) { clearTimeout(idbTimer); IDB.set("store", JSON.parse(JSON.stringify(store))).catch(() => {}); } });
document.addEventListener("visibilitychange", () => { if (document.hidden && dbReady) { clearTimeout(flushTimer); flush(); } });

// ---- 백업 ----
$("#exportBtn").onclick = async () => {
  const data = JSON.stringify({ app: "bampyeonji", v: 1, chars: store.chars, chats: store.chats });
  const name = "bampyeonji_backup_" + new Date().toISOString().slice(0, 10) + ".json";
  try {
    const dl = window.claude ? await claude.use("downloads") : null;
    if (dl) { await dl.save({ filename: name, data }); return; }
  } catch (e) { return; }
  if (!window.claude) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], { type: "application/json" }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
    return;
  }
  try { await navigator.clipboard.writeText(data); alert("백업 내용을 클립보드에 복사했어요. 메모장에 붙여넣어 보관하세요."); }
  catch (e) { alert("백업을 만들지 못했어요."); }
};
$("#importBtn").onclick = () => $("#importFile").click();
$("#importFile").onchange = async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (!Array.isArray(j.chars)) throw 0;
    const have = new Set(store.chars.map(c => c.id));
    let added = 0;
    j.chars.forEach(c => {
      if (have.has(c.id)) return;
      store.chars.push(c); store.chats[c.id] = (j.chats || {})[c.id] || []; dirtyChats.add(c.id); added++;
    });
    save(null); renderHome();
    alert(added ? `캐릭터 ${added}개를 불러왔어요.` : "이미 모두 있는 캐릭터예요.");
  } catch (err) { alert("백업 파일을 읽지 못했어요. 밤편지에서 내보낸 .json 파일인지 확인해주세요."); }
};

if (store.theme) document.documentElement.dataset.theme = store.theme;


let sample = null;
(async () => {
  try { sample = window.claude ? await claude.use("sample") : null; } catch(e) { sample = null; }
  updateBanner();
})();

// ---- AI 설정 (이 기기에만 저장) ----
const SKEY = "bamp_ai_v1";
let ai = { prov: "builtin", url: "", key: "", model: "gpt-4.1", temp: 0.9, max: 0, merge: true, font: "고운돋움", fs: 15, theme: "light", trans: true, pron: false, uav: true };
const FONTS = {
  "고운돋움": '"GowoonDodum","Gowun Dodum","Noto Sans KR",sans-serif',
  "고운바탕": '"GounBatang","Gowun Batang",serif',
  "둥근모 (도트)": '"NeoDunggeunmo","DotGothic16",monospace',
  "갈무리 (도트)": '"Galmuri11","NeoDunggeunmo","DotGothic16",monospace',
  "나눔고딕코딩": '"Nanum Gothic Coding","GowoonDodum",monospace'
};
const HANDS = {
  "단정": "'HandPol','Nanum Pen Script',cursive", "모범": "'HandMyo','Nanum Pen Script',cursive",
  "어른": "'HandOks','Nanum Pen Script',cursive", "야무": "'HandJel','Nanum Pen Script',cursive",
  "선생": "'HandKcc','Nanum Pen Script',cursive", "장난": "'HandTng','Nanum Pen Script',cursive",
  "또박": "'HandJng','Nanum Pen Script',cursive", "다정": "'HandSng','Nanum Pen Script',cursive",
  "무난": "'HandYun','Nanum Pen Script',cursive", "멋냄": "'HandNrm','Nanum Pen Script',cursive",
  "삐딱": "'HandSim','Nanum Pen Script',cursive", "차분": "'HandSnw','Nanum Pen Script',cursive",
  "깜찍": "'HandSeh','Nanum Pen Script',cursive", "서툰": "'HandRam','Nanum Pen Script',cursive",
  "수수": "'HandDng','Nanum Pen Script',cursive"
};
const THEMES = [["light", "밝게"], ["night", "밤"], ["tk", "月夜 (츠키요)"], ["tkw", "月白 (츠키요 화이트)"]];
function applyLook() {
  const r = document.documentElement.style;
  const fam = FONTS[ai.font] || FONTS["고운돋움"];
  r.setProperty("--font-body", fam);
  r.setProperty("--font-serif", fam);
  r.setProperty("--font-size", (ai.fs || 15) + "px");
  r.setProperty("--card-fs", (ai.cfs || 14) + "px");
  r.setProperty("--rlh", Math.ceil((ai.cfs || 14) * 2.2) + "px");
  let th = ai.theme || store.theme || "light";
  if (th === "ps") th = ai.theme = "tkw";
  if (th === "ps-night" || th === "pe") th = ai.theme = "tk";
  const de = document.documentElement;
  de.dataset.theme = th === "night" || th === "dark" || th === "tk" ? "night" : "light";
  if (th === "tk" || th === "tkw") de.dataset.skin = "tk"; else delete de.dataset.skin;
  if (th === "tkw") de.dataset.tone = "white"; else delete de.dataset.tone;
}
try { Object.assign(ai, JSON.parse(localStorage.getItem(SKEY) || "{}")); } catch(e) {}
applyLook();
if (ai.max === 1500) ai.max = 0;
const inClaude = !!window.claude;
if (!inClaude && ai.prov === "builtin" && !localStorage.getItem(SKEY)) ai.prov = "openai";
function updateBanner() { try { $("#aiBanner").hidden = !(ai.prov === "builtin" && !sample); } catch (e) {} }
function syncProvUI() {
  const v = segGet($("#sProv"));
  $("#sApi").hidden = v === "builtin";
  $("#sUrlWrap").hidden = v !== "custom";
  $("#sProvHint").textContent = v === "builtin"
    ? "claude.ai 안에서만 돼요. 본인 Claude 사용량으로 답하고, 캐릭터마다 빠름/기본/고급을 고를 수 있어요."
    : (inClaude ? "claude.ai 안에서는 외부 API 연결이 막혀 있어요. 이 파일을 깃허브 페이지 등에 올려서 열어야 작동해요." : "입력한 API로 직접 연결해요. 사용료는 해당 서비스에서 나가요.");

  "/편지": "이번 턴에는 완성된 편지 한 통만 출력한다. [편지]로 시작하고 [/편지]로 끝낸다. 태그 바깥에는 설명, 분석, 작성 계획을 붙이지 않는다.\n받는 사람, 본문, 맺음말과 보내는 사람 이름까지 편지 전체를 이번에 지정된 언어로 쓴다. 이름은 설정이나 기존 대화의 해당 언어 표기를 우선한다. 없으면 일관된 음역을 쓰며 다른 사람의 이름으로 바꾸지 않는다. 호칭 뒤에 한국어 조사를 기계적으로 붙이지 않는다.\n받는 사람을 부를 때는 이 인물이 평소에 상대를 부르는 호칭을 그대로 쓴다. 아래 관계·예의 및 언어별 호칭·맺음말 지침은 [수신]과 [서명] 칸에만 적용한다. 이 지침을 근거로 [본문]의 기존 캐릭터 말투나 존댓말 여부를 바꾸지 않는다.\n한국어: 예의를 갖추는 학생이 선생님에게 보내는 편지라면 '선생님께'와 '이름 올림' 또는 '이름 드림'이 자연스럽다. 가까운 친구에게는 평소 호칭과 자연스러운 서명을 쓴다. 모든 편지를 '에게'와 '이름이/가'로 고정하지 않는다.\n일본어: 그 관계에서 자연스러운 호칭과 맺음말을 쓴다. 예를 들어 〇〇先生へ, 이름より 등이 가능하지만 모든 관계에 같은 예시를 적용하지 않는다. 이름과 호칭에 한국어 '에게/께/올림/가'를 남기지 않는다.\n영어: 실제로 사용하는 호칭으로 Dear ... 등 자연스러운 인사를 정한다. 관계와 성격에 맞춰 Sincerely, 이름 또는 이름만 쓰는 등 적절한 서명을 고른다. 설정에 없는 성이나 직함을 만들어내지 않는다.\n서명 칸에는 보내는 사람의 이름과 관례적인 짧은 맺음말만 쓴다. 관계와 예의는 올림·드림·가, より, From·Sincerely 같은 맺음말을 고르는 데만 반영한다. 이름은 기존 설정과 해당 언어 표기를 유지한다. 이름 앞뒤에 인물 소개, 관계 설명, 소유·연애 호칭, 고백, 약속, 미래 관계의 예고, 문장형 수식어를 붙이지 않는다. 친밀한 관계여도 이 규칙은 같다. 예: 이치조 미나토 올림 / 미나토가 / 湊より / From, Minato. 부적절한 예: 당신의 학생이자 이제는 당신의 남자가 될 이치조 미나토 올림. 이 경우 서명은 이치조 미나토 올림으로만 쓴다. 과거 편지의 긴 서명을 따라 쓰지 않는다. 이 규칙은 [서명] 칸에만 적용하며 편지 본문의 말투·내용·분량을 바꾸거나 서명에서 뺀 수식어를 본문으로 옮기지 않는다.\n내용은 다음 세 칸으로 구분한다. [수신]받는 사람 호칭[/수신] 다음 빈 줄, [본문]편지 본문[/본문] 다음 빈 줄, [서명]맺음말과 보내는 사람[/서명]. 이 칸들은 모두 [편지]와 [/편지] 안에 둔다. 바깥의 [편지]와 [/편지]는 반드시 각각 독립된 줄에 쓴다. 구분자 라벨만 한국어로 유지하고 실제 내용은 지정 언어로 쓴다. 본문은 처음부터 끝까지 한 덩어리로 이어 쓰며 문단 구분·빈 줄·문장별 줄바꿈을 넣지 않는다. 받는 사람과 서명은 본문 밖의 별도 칸으로 유지한다. 받는 사람 호칭에 실제 관계에 없는 연애·배우자 호칭을 만들어 붙이지 않는다. 제목, 지문, 별도 대사, 번역 해설은 추가하지 않는다.",
  "/일기": "이번 턴에는 [일기]와 [/일기] 사이에 인물의 일기만 쓴다. 첫 줄은 날짜: 로 시작하고 값은 선택한 언어의 자연스러운 날짜 표기다. 날짜는 현재 장면의 시점에 맞춘다. 날짜 다음 줄에 1인칭 본문을 처음부터 끝까지 한 덩어리로 쓴다. 본문에 문단 구분이나 빈 줄, 문장별 줄바꿈을 넣지 않는다. 그날의 구체적인 일과 생각을 인물의 평소 말투로 쓴다. 번역, 설명, 일기 제목, 지문용 별표는 덧붙이지 않는다.",
  "/속마음": "이번 턴에는 인물의 지금 속마음만 보여준다. 첫 줄에는 [속마음]만, 마지막 줄에는 [/속마음]만 쓴다. 두 표식 사이의 본문만 한 덩어리로 이어 쓴다. 그 안은 이 인물의 성격과 말버릇 그대로 쓴다. 길이도 인물에 맞게 정한다. 처음부터 끝까지 한 덩어리로 이어 쓰고, 문단을 나누거나 빈 줄을 넣지 않는다. 지문이나 대사 등 다른 내용은 한 줄도 쓰지 않는다. 문장부호는 자연스럽게 쓴다. 의문에는 물음표를, 완결된 생각에는 마침표를 쓰고 의도적인 말줄임표와 끊김은 유지한다. 부호 없는 단어 나열로 쓰지 않는다.",
  "/플리": "이번 턴에는 노래 세 곡만 고른다. 첫 줄에 [플리] 를 쓰고, 아래 순서대로 한 줄에 하나씩 '제목 - 가수 :: 이유' 형식으로 쓴 뒤 [/플리] 로 닫는다. 첫 곡은 지금 상황에 어울려서 듣고 있는 곡, 둘째 곡은 상대를 생각하며 들었던 곡, 셋째 곡은 평소에 자주 듣던 곡이다. 이유는 한 문장으로 쓴다. 지문이나 대사 등 다른 내용은 한 줄도 쓰지 않는다.\n곡을 고르는 기준은 이렇다. 이 인물이 평소에 좋아할 만한 장르와 분위기로 고른다. 지금 장면이 슬프다고 슬픈 곡을 고르는 것이 아니라, 이 사람이라면 이런 걸 듣겠다 싶은 쪽으로 고른다. 성격, 자란 환경, 나이, 하는 일이 취향을 정한다.\n인물 설정에 음악 취향이 적혀 있으면 무엇보다 그것을 따른다.\n나이가 있거나 옛 시절 이야기를 자주 하는 인물이면 그 시절 곡이 섞여도 좋다. 세계관에 시대가 정해져 있으면 그 시대보다 나중에 나온 곡은 쓰지 않는다.\n세 곡을 전부 누구나 아는 대표곡으로 채우지 않는다. 한 곡 정도는 알려진 곡이어도 좋지만, 나머지는 덜 알려졌더라도 그 인물의 취향이 드러나는 곡으로 고른다.\n실제로 존재하는 곡만 쓴다. 제목이나 가수가 확실하지 않으면 지어내지 말고 확실히 아는 곡으로 바꾼다.",
  "/상태": "이번 턴에는 인물의 지금 상태만 [상태]와 [/상태] 사이에 쓴다. 한 줄에 하나씩 항목: 내용 형식으로 쓴다. 시간, 장소, 기분, 옷차림, 지금 하는 일, 속마음을 쓰고 필요하면 한두 항목을 더한다. 설정과 대화에서 확인된 사실을 우선하고, 카드 밖에는 지문이나 대사를 쓰지 않는다.",
  "/관계": "[관계]와 [/관계] 사이에 관계를 최대 네 묶음으로 쓴다. 각 묶음은 빈 줄로 구분한다. 사이: 인물 A ↔ 인물 B · 관계, A의 시선: 구체적 태도, B의 시선: 확인된 반응 또는 아직 모름, 최근 일: 구체적인 사건을 각각 한 줄씩 쓴다. 설정과 대화에서 확인된 사실을 우선한다. 단서가 없으면 없다고 짧게 쓴다. 빈칸을 채우려고 연애·배신·큰 사건을 만들지 않는다. 작은 새 설정을 보탤 때도 기존 서사를 뒤집지 않는다. 추측과 확인된 사실을 구분하고, 당사자가 알지 못하는 내용을 알고 행동하게 하지 않는다.",
  "/관계도": "[관계]와 [/관계] 사이에 관계를 최대 네 묶음으로 쓴다. 각 묶음은 빈 줄로 구분하고 아래 라벨을 한 줄씩 사용한다.\n사이: 인물 A ↔ 인물 B · 구체적인 관계\nA의 시선: A가 B를 어떻게 대하는지 실제 행동과 함께\nB의 시선: 확인된 반응, 미확인이라면 아직 모름\n최근 일: 둘 사이에서 실제로 있었던 구체적인 사건\n추상적인 특별한 관계, 복잡한 감정 같은 표현으로 대신하지 않는다. 설정과 대화에서 확인된 사실을 우선한다. 단서가 없으면 없다고 짧게 쓴다. 빈칸을 채우려고 연애·배신·큰 사건을 만들지 않는다. 작은 새 설정을 보탤 때도 기존 서사를 뒤집지 않는다. 추측과 확인된 사실을 구분하고, 당사자가 알지 못하는 내용을 알고 행동하게 하지 않는다.",
  "/소문": "[소문]과 [/소문] 사이에 세 가지를 빈 줄로 나누어 쓴다. 각 소문은 다음 라벨을 각각 한 줄씩 쓴다.\n도는 말: 사람들이 실제로 할 법한 구체적인 한마디\n출처: 어디서 시작되어 어떻게 퍼지는지\n사실: 사실 / 일부 사실 / 사실 아님 / 확인되지 않음 중 하나를 먼저 쓰고, 그 뒤에 실제 사정을 한 줄로 덧붙인다\n세 가지의 사실 여부를 서로 다르게 한다. 하나는 맞고, 하나는 일부만 맞고, 하나는 틀리거나 확인되지 않은 것으로 구성한다. 확인된 사실을 소문 모양으로 옮겨 적기만 하는 목록을 만들지 않는다.\n틀린 소문은 거짓말이 아니라 오해에서 나온다. 사람을 착각했거나, 시점이 어긋났거나, 이유를 잘못 짚었거나, 규모가 부풀려진 것이다. 실제로 있었던 일에 틀린 해석이 붙은 형태를 우선한다.\n인물의 비밀이 아무 근거 없이 공개된 소문이 되지 않게 한다. 빈칸을 채우려고 연애·배신·큰 사건을 만들지 않는다. 틀린 소문이라도 인물을 망가뜨리는 추문으로 만들지 않는다. 작은 새 설정을 보탤 때도 기존 서사를 뒤집지 않는다. 추측과 확인된 사실을 구분하고, 당사자가 알지 못하는 내용을 알고 행동하게 하지 않는다.",
  "/비밀": "이번 턴에는 인물이 겉으로 드러내지 않은 것만 [비밀]과 [/비밀] 사이에 쓴다. 최대 세 가지를 빈 줄로 나눈다. 각 비밀은 다음 라벨을 각각 한 줄씩 쓴다.\n숨긴 것: 추상적인 감정 이름이 아니라 구체적인 사실이나 행동\n숨기는 이유: 인물의 실제 동기\n숨기는 상대: 누구에게 숨기는지\n단서: 설정이나 대화에 이미 나타난 근거\n근거 없는 큰 사건, 숨은 연애, 배신, 앞으로 벌어질 일을 만들어내지 않는다. 드러난 것이 없으면 짧게 없다고 쓴다. 확인된 사실과 추측을 구분한다. 이 내용을 유저나 다른 인물이 알게 되었다고 취급하지 않는다. 지문이나 대사는 쓰지 않는다.",
  "/커뮤": "이번 턴에는 인터넷 커뮤니티 글 하나와 그 댓글만 보여준다. 첫 줄은 반드시 대괄호 안에 커뮤 라고만 적은 [커뮤] 이고, 마지막 줄은 [/커뮤] 다. 대괄호 안에 게시판 이름을 넣지 않는다. 게시판 이름은 사이트 칸에 적는다.\n아래처럼 쓴다.\n[커뮤]\n사이트: 606부대 익명 게시판\n말머리: 자유\n제목: 아까 연병장에서 그거 본 사람 있냐\n정보: 익명 · 12분 전 · 조회 3,842 · 댓글 6\n본문:\n수색팀 대위가 신병 갈구다가 갑자기 급소 맞고 무릎 꿇었음\n그 큰 사람이 소리도 못 내더라\n댓글:\n익명1 | 실화냐 ㅋㅋㅋ\n익명2 | 그 신병 오늘 밤 무사하냐\nㄴ 익명3 | @익명2 묵념해라\n[/커뮤]\n라벨 이름을 바꾸지 않고 한 줄에 한 항목씩만 쓴다. 본문과 댓글은 라벨 다음 줄부터 쓰고, 댓글은 한 줄에 하나씩 쓴다. 여러 댓글을 한 줄에 몰아쓰지 않는다. 댓글은 여섯 개 안팎을 반드시 넣는다.\n사이트는 이 세계관에 실제로 있을 법한 곳으로 정한다. 유저가 어디인지 말했으면 그곳으로 한다. 군대나 학교, 회사, 길드처럼 사람들이 모인 조직이 세계관에 있으면 그 이름을 붙인 내부 게시판으로 한다. 조직 이름은 대화와 설정에 이미 나온 것을 그대로 쓰고, 없으면 그 세계에 어울리게 짓는다.\n닉네임도 그곳에 맞춘다. 괄호나 꺾쇠로 태그 비슷한 것을 만들지 않는다.",
  "/인스타": "이번 턴에는 이야기 속 인물의 가상 인스타 계정만 [인스타]와 [/인스타] 사이에 JSON으로 쓴다. 형식: {\"handle\":\"계정 이름\",\"bio\":\"소개\",\"private\":false,\"posts\":[{\"photo\":\"게시된 사진의 구체적인 모습\",\"caption\":\"인물이 쓴 캡션\",\"date\":\"장면 속 게시 날짜\",\"likes\":12,\"comments\":[{\"who\":\"댓글 작성자\",\"text\":\"댓글\"}]}]}. 최근 게시물은 0~3개, 댓글은 게시물당 0~4개. 댓글은 한 사람에게 쏠리지 않게 여러 사람이 남긴다. 친구·지인·동료·팔로워 같은 주변 인물, 사용자, 계정 주인의 답글이 자연스럽게 섞인다. 사용자가 매번 댓글을 다는 것은 아니다. 인물의 성격·생활·현재 대화·시대에 맞춘다. 게시하지 않는 인물이면 posts는 빈 배열. 비공개 여부나 유명세를 억지로 만들지 않는다. 등장인물이 알지 못하는 비밀을 게시물로 공개하지 않는다. photo는 텍스트로 사진의 모습을 묘사하는 칸이며 이미지 URL이나 생성 지시를 넣지 않는다. 실제 Instagram 게시나 실제 사진 생성은 아니다. 캡션과 댓글은 각 인물이 쓸 법한 말투를 따른다.",
  "/쇼핑": "이번 턴에는 최근 주문 내역만 [주문]과 [/주문] 사이에 지정된 JSON으로 쓴다. 여기에는 이 인물이 자기 돈으로 직접 주문해서 물건을 받는 거래만 넣는다. 선물 받은 물건이나 다른 사람이 사준 물건은 넣지 않는다. 구독료, 정기결제, 공과금, 통신비, 교통비, 외식비, 병원비 같은 서비스 결제는 결제 내역의 몫이므로 여기에 넣지 않는다. 최근 구매가 위에 온다. 상품명·판매처·장면 속 날짜·배송상태를 기록한다. 온라인 거래가 없는 시대에는 그 시대의 거래 장부에 해당하는 기록을 쓴다. 항목은 정확히 6개다. 특정 상품 종류를 억지로 넣지 말고 일상 구매를 포함한다. \n\n목록은 캐릭터 설정과 현재까지의 대화, 생활환경, 예산, 취향, 실제 필요를 종합해 구성한다. '사용할 법함'과 '최근에 구매할 이유가 있음'을 구분한다. 직업·종족·성격 하나만으로 특정 구매를 단정하지 않는다. 같은 시점에 재조회하면 이미 나온 품목·날짜·금액을 유지하고, 시간이 흐르거나 새로운 필요가 생겼을 때 자연스럽게 갱신한다. 이미 보유한 물건은 소진·고장·선물 등의 이유 없이 다시 사지 않는다.\n성인 캐릭터의 사적인 구매(피임용품, 성인용품 등)가 있을 것 같으면 넣는다.",
  "/결제": "이번 턴에는 최근 결제 내역만 [결제]와 [/결제] 사이에 지정된 JSON으로 쓴다. 이것은 주문 목록이 아니라 카드·계좌에서 돈이 빠져나간 기록이다. 구독과 정기결제, 공과금, 통신·교통, 식비 같은 서비스 이용료를 중심으로 구성한다. 이 인물이 자기 돈으로 낸 것만 넣는다. 다른 사람이 대신 내주는 것, 공짜로 받는 것, 대화 속에서 상대가 부담하기로 한 것은 이 인물의 결제가 아니므로 넣지 않는다. 대화에 나온 활동이라는 이유만으로 그 비용을 이 인물의 결제로 만들지 않는다. 물건 값은 6개 중 최대 2개까지만 넣고, 나머지는 물건이 아닌 결제로 채운다. 다만 이 제한은 물건과 서비스의 비율을 맞추려는 것일 뿐, 어떤 종류의 물건을 넣을지 고르는 기준이 아니다. 주문 내역에 이미 나온 물건을 넣을 때만 그 품목의 날짜와 금액을 그대로 유지하고, 주문 목록 전체를 그대로 옮겨 적지 않는다. 상품명 또는 서비스명·금액·주기·장면 속 날짜·상태를 기록한다. 주기는 매월·매년·단건 중 알맞게 쓰며 일반 물건은 구독이라고 명시되지 않은 한 단건이다. 결제 수단은 그 시대에 맞춘다. \n\n목록은 캐릭터 설정과 현재까지의 대화, 생활환경, 예산, 취향, 실제 필요를 종합해 구성한다. '사용할 법함'과 '최근에 구매할 이유가 있음'을 구분한다. 직업·종족·성격 하나만으로 특정 구매를 단정하지 않는다. 같은 시점에 재조회하면 이미 나온 품목·날짜·금액을 유지하고, 시간이 흐르거나 새로운 필요가 생겼을 때 자연스럽게 갱신한다. 이미 보유한 물건은 소진·고장·선물 등의 이유 없이 다시 사지 않는다.\n성인 캐릭터의 사적인 구매(피임용품, 성인용품 등)가 있을 것 같으면 넣는다.",
  "/시청기록": "이번 턴에는 최근 시청 기록만 [시청]과 [/시청] 사이에 쓴다. 한 줄에 하나씩 '제목 | 채널 | 어디까지 봤는지 | 언제' 형식으로 쓰고 항목은 다섯 개다. 최근에 본 것이 위에 온다.\n제목과 채널은 이 인물이 볼 법한 것으로 자유롭게 짓는다. 실제로 존재하는 영상을 맞히려 하지 않는다. 채널명은 현실에 있는 곳을 써도 되고 그럴듯하게 지어내도 된다. 제목은 실제 유튜브 제목처럼 쓴다. 대문자 강조, 물음표 남발, ㅋㅋ나 ㄷㄷ 같은 표기도 그 채널 성격에 맞으면 쓴다.\n'어디까지 봤는지' 칸이 이 목록의 핵심이다. 끝까지 봤는지, 몇 분 보다 껐는지, 몇 번째 다시 보는지를 적는다.\n음악 영상으로 목록을 채우지 않는다. 노래는 따로 다룬다. 직업이나 성격 하나만으로 다섯 개를 같은 주제로 채우지 않는다. 찾아본 것과 아무 생각 없이 튼 것을 섞는다. 시간대가 드러나면 언제 칸에 적는다.\n같은 시점에 다시 조회하면 이미 나온 제목과 시점을 유지한다.\n현대 한국이 아니면 그 나라에서 실제로 쓰는 영상 플랫폼과 실존 채널로 맞춘다. 영상 플랫폼이 없는 세계관이면 그 시대에 이 인물이 구경하거나 즐겨 보던 것을 같은 형식으로 쓰고, 이때는 채널 칸에 실존 채널 대신 그 시대에 맞는 이름을 쓴다.",
  "/통화기록": "이번 턴에는 최근 통화 기록만 [통화]와 [/통화] 사이에 쓴다. 한 줄에 하나씩 '상대 | 통화 길이 | 발신 또는 수신 또는 부재중 | 날짜와 시각 | 비고' 형식으로 쓰고 항목은 여섯 개다. 최근이 위에 온다.\n상대는 설정과 대화에 이미 나온 사람을 우선하고, 없으면 이 인물의 생활에 있을 법한 사람이나 가게로 정한다. 이 인물이 저장해둔 이름 그대로 쓴다.\n부재중과 아주 짧은 통화를 반드시 섞는다. 누구의 전화를 받지 않았는지가 이 목록의 핵심이다. 비고에는 다시 걸었는지 정도만 짧게 쓰고 통화 내용을 지어내 옮기지 않는다.\n유저가 맡은 인물과의 통화는 대화에서 실제로 통화한 적이 있을 때만 넣는다.\n같은 시점에 다시 조회하면 이미 나온 기록을 유지한다.\n전화가 없는 세계관이면 최근에 주고받은 전갈이나 서신을 같은 형식으로 쓴다.",
  "/리뷰": "이번 턴에는 이 인물이 남긴 후기만 [리뷰]와 [/리뷰] 사이에 쓴다. 후기는 세 개이고 빈 줄로 나눈다. 각 후기는 다음 라벨을 각각 한 줄씩 쓴다.\n플랫폼: 후기를 남긴 곳. 쿠팡, 네이버 쇼핑, 배달의민족, 알라딘, 왓챠처럼 현실에 실제로 있는 이름을 쓴다. 한국이 아니면 그 나라에서 실제로 쓰는 곳으로 한다\n상품: 후기를 남긴 상품이나 작품의 이름\n옵션: 상품 아래에 붙는 짧은 선택 사항. '기초 1단계', '구이용 1kg', '블랙 / L', '2인분'처럼 쓴다. 붙일 것이 없으면 이 줄을 비워 둔다\n별점: 1에서 5 사이의 정수만 쓴다. 별표나 다른 기호를 쓰지 않는다\n날짜: 장면 속 날짜\n내용: 이 인물이 실제로 썼을 법한 후기 본문\n세 개의 플랫폼과 상품 종류를 서로 다르게 한다. 전부 음식이나 전부 책으로 채우지 않는다. 이 인물이 실제로 돈이나 시간을 쓴 것에서 고르고, 직업 하나만으로 단정하지 않는다.\n후기 본문은 대화할 때의 말투가 아니라 모르는 사람에게 쓰는 말투다. 이 차이가 이 카드의 핵심이다. 말을 짧게 하는 사람이면 한 줄로 끝낸다.\n별점을 전부 높게 주지 않는다. 별점이 낮으면 본문에도 그 이유가 드러나야 한다.\n후기 문화가 없는 세계관이면 그 시대에 남겼을 평이나 장부의 촌평을 같은 형식으로 쓰고, 플랫폼 칸에는 그 기록이 남은 곳을 쓴다.",
  "/멀리서": "이번 턴에는 유저가 없는 곳에서 이 인물이 보내는 실제 생활의 한 장면만 [멀리서]와 [/멀리서] 사이에 쓴다. 첫 줄에 장소: 장소 이름, 둘째 줄에 시각: 오후 11:40 같은 시각을 쓰고, 빈 줄 다음에 본문을 쓴다.\n본문은 멀찍이서 지켜보는 카메라처럼 3인칭으로, 짧은 문단 3~5개로 쓴다. 행동과 혼잣말, 그 자리에 있는 다른 사람과 나누는 말이 중심이다.\n유저는 이 자리에 없고 이 장면을 보지 못한다. 유저를 그리워하거나, 유저가 없어서 심심해하거나, 유저 생각만 하는 장면으로 만들지 않는다. 유저 이야기는 나오지 않거나 스치듯 한 번이면 충분하다.\n이 인물 자신의 삶을 보여준다. 하는 일, 습관, 취미, 혼자 있을 때의 버릇, 가족·친구·동료 같은 사람들과의 관계, 유저 앞에서는 보이지 않는 얼굴과 말투처럼 이 사람이 원래 어떻게 사는지가 드러나야 한다.\n설정과 대화에 이미 나온 사실과 어긋나지 않게 한다. 설정에 근거가 없는 큰 비밀이나 사건을 새로 만들지 않는다.\n유저가 때나 곳을 정했으면 그때 그곳을 보여준다. 정하지 않았으면 지금 대화 시점에서 유저와 떨어져 있을 법한 때와 곳을 고른다.\n유저의 대사와 행동은 쓰지 않는다.",

function paperCard(kind, body, hand) {
  const style = hand ? ` style="font-family:${hand}"` : "";
  const txt = String(body || "").replace(/\r/g, "").trim();
  if (kind === "편지") {
    const to = txt.match(/\[수신\]([\s\S]*?)\[\/수신\]/);
    const main = txt.match(/\[본문\]([\s\S]*?)\[\/본문\]/);
    const sg = txt.match(/\[서명\]([\s\S]*?)\[\/서명\]/);
    let tTo = to ? to[1].trim() : "", tBody = main ? main[1].trim() : "", tSign = sg ? sg[1].trim() : "";
    if (!main) {
      const ls = txt.split("\n").map(l => l.trim()).filter(Boolean);
      if (ls.length > 1 && /(에게|께|へ|様|先生)\s*[,.:]?$/.test(ls[0])) tTo = ls.shift();
      if (ls.length > 1 && /(올림|드림|씀|より|From|Sincerely)/i.test(ls[ls.length - 1]) && ls[ls.length - 1].length <= 60) tSign = ls.pop();
      tBody = ls.join(" ");
    }
    return `<div class="paper letter"${style}>${tTo ? `<div class="lto">${esc(tTo)}</div>` : ""}<div class="ruled">${esc(tBody.replace(/\n+/g, " "))}</div>${tSign ? `<div class="lsign">${esc(tSign)}</div>` : ""}</div>`;
  }
  const dl = txt.split("\n");
  let dtxt = "", di = -1;
  for (let q = 0; q < dl.length && q < 4; q++) {
    const L = dl[q].trim();
    if (!L) continue;
    if (/^날짜\s*[:：]/.test(L)) { dtxt = L.replace(/^날짜\s*[:：]\s*/, "").trim(); di = q; break; }
    if (/^\d{4}\s*[.\-년]/.test(L) || /^\d{1,2}\s*월\s*\d{1,2}\s*일/.test(L)) { dtxt = L; di = q; break; }
  }
  if (di >= 0) dl.splice(di, 1);
  let wd = "";
  const mw = dtxt.match(/([월화수목금토일])\s*요일/);
  if (mw) { wd = mw[0]; dtxt = dtxt.replace(/[,·\s(]*([월화수목금토일])\s*요일[)]*/, "").trim(); }
  const rest = dl.join(" ").replace(/^본문\s*[:：]\s*/, "").replace(/\s+/g, " ").trim();
  return `<div class="paper diary"${style}><div class="dhead"><span>${esc(dtxt)}</span>${wd ? `<span class="wd">${esc(wd)}</span>` : ""}</div><div class="ruled">${esc(rest)}</div></div>`;
}

function openCropper(img, done) {
  const V = 260, OUT = 256;
  const w = document.createElement("div");
  w.className = "cropwrap";
  w.innerHTML = `<div class="cropsheet"><div class="croptitle">사진 위치 조정</div><div class="cropbox" style="width:${V}px;height:${V}px"><img alt=""><div class="cropmask"></div></div><input type="range" class="cropzoom" min="1" max="4" step="0.01" value="1"><div class="cropbtns"><button type="button" class="btn ghost" data-x>취소</button><button type="button" class="btn" data-ok>확인</button></div></div>`;
  document.body.appendChild(w);
  const box = w.querySelector(".cropbox"), im = w.querySelector("img"), zoom = w.querySelector(".cropzoom");
  im.src = img.src;
  const base = V / Math.min(img.width, img.height);
  let z = 1, x = 0, y = 0;
  const clamp = () => {
    const sw = img.width * base * z, sh = img.height * base * z;
    x = Math.min(0, Math.max(V - sw, x)); y = Math.min(0, Math.max(V - sh, y));
  };
  const draw = () => { clamp(); im.style.width = img.width * base * z + "px"; im.style.height = img.height * base * z + "px"; im.style.transform = `translate(${x}px,${y}px)`; };
  x = (V - img.width * base) / 2; y = (V - img.height * base) / 2; draw();
  const setZoom = (nz, cx = V / 2, cy = V / 2) => {
    nz = Math.max(1, Math.min(4, nz));
    x = cx - (cx - x) * nz / z; y = cy - (cy - y) * nz / z; z = nz; zoom.value = z; draw();
  };
  zoom.oninput = () => setZoom(parseFloat(zoom.value));
  let drag = null, pinch = null;
  box.addEventListener("pointerdown", e => { if (pinch) return; drag = { px: e.clientX, py: e.clientY, x, y }; box.setPointerCapture(e.pointerId); });
  box.addEventListener("pointermove", e => { if (!drag || pinch) return; x = drag.x + e.clientX - drag.px; y = drag.y + e.clientY - drag.py; draw(); });
  box.addEventListener("pointerup", () => { drag = null; });
  box.addEventListener("pointercancel", () => { drag = null; });
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  box.addEventListener("touchstart", e => { if (e.touches.length === 2) { drag = null; const r = box.getBoundingClientRect(); pinch = { d: dist(e.touches), z, cx: (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left, cy: (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top }; } }, { passive: true });
  box.addEventListener("touchmove", e => { if (pinch && e.touches.length === 2) { e.preventDefault(); setZoom(pinch.z * dist(e.touches) / pinch.d, pinch.cx, pinch.cy); } }, { passive: false });
  box.addEventListener("touchend", e => { if (e.touches.length < 2) pinch = null; });
  box.addEventListener("wheel", e => { e.preventDefault(); const r = box.getBoundingClientRect(); setZoom(z * (e.deltaY < 0 ? 1.08 : 0.93), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
  w.querySelector("[data-x]").onclick = () => w.remove();
  w.querySelector("[data-ok]").onclick = () => {
    const cv = document.createElement("canvas"); cv.width = OUT; cv.height = OUT;
    const k = OUT / V, sc = base * z * k;
    cv.getContext("2d").drawImage(img, x * k, y * k, img.width * sc, img.height * sc);
    w.remove();
    done(cv.toDataURL("image/jpeg", 0.85));
  };
}

function parseLoreBulk(raw) {
  const blocks = String(raw || "").replace(/\r/g, "").split(/\n\s*\n/);
  const out = [];
  blocks.forEach(bl => {
    let t = "", k = "", body = [], mode = null;
    bl.split("\n").forEach(L => {
      let m;
      if ((m = L.match(/^\s*제목\s*[:：]\s*(.*)$/))) { t = m[1].trim(); mode = "t"; return; }
      if ((m = L.match(/^\s*키워드\s*[:：]\s*(.*)$/))) { k = m[1].trim(); mode = "k"; return; }
      if ((m = L.match(/^\s*내용\s*[:：]\s*(.*)$/))) { if (m[1].trim()) body.push(m[1]); mode = "c"; return; }
      if (!t && !k && (m = L.match(/^\s*([^|\n]{1,30})\|\s*(.*)$/))) { t = m[1].trim(); k = m[2].trim(); mode = "c"; return; }
      if (mode === "c" || mode === null) body.push(L);
      else if (mode === "k" && L.trim()) k += ", " + L.trim();
      else if (mode === "t" && L.trim()) body.push(L);
    });
    const text = body.join("\n").trim();
    if (!text && !k) return;
    out.push({ title: t, keys: k, text, always: false });
  });
  return out;
}
$("#lbgo").onclick = () => {

  if (!items.length) return alert("읽을 수 있는 항목이 없어요. 형식을 확인해주세요.");

};
function pickLore(c) {
  const items = allLore(c.books);
  if (!items.length) return [];
  const log = msgs().slice(-4).map(m => m.text).join(" ");
  const out = [], rest = [];
  items.forEach(it => {
    if (!it.text) return;
    if (it.always) { out.push(it); return; }
    const kk = (it.keys || "").replace(/\{\{\s*user\s*\}\}/gi, c.uname || "").replace(/\{\{\s*char\s*\}\}/gi, c.name || "");
    const keys = kk.split(/[,，]/).map(x => x.trim()).filter(Boolean);
    for (let i = 0; i < keys.length; i++) if (log.indexOf(keys[i]) >= 0) { rest.push(it); return; }
  });
  return out.concat(rest).slice(0, 5);
}

function buildTurns(c, extraUser, cmd) {
  let hist = msgs().map(m => ({ role: m.role, content: sub(m.text, c) }));
  if (extraUser) hist.push({ role: "user", content: extraUser });
  const rules = buildRules(c, cmd);
  const LIMIT = 55000;
  const size = () => rules.length + hist.reduce((a, t) => a + t.content.length, 0);
  while (hist.length > 2 && size() > LIMIT) hist.shift();
  const turns = [{ role: "user", content: rules }];
  hist.forEach(t => {
    const last = turns[turns.length - 1];
    if (last.role === t.role) last.content += "\n\n" + t.content;
    else turns.push({ role: t.role, content: t.content });
  });
  if (turns[turns.length - 1].role !== "user") turns.push({ role: "user", content: "(계속)" });
  return turns;
}

const vnum = v => v.split(".").map(Number);
const newer = (a, b) => { const x = vnum(a), y = vnum(b); for (let i = 0; i < Math.max(x.length, y.length); i++) { if ((x[i]||0) !== (y[i]||0)) return (x[i]||0) > (y[i]||0); } return false; };

function renderChangelog() {
  const list = latest && newer(latest[0].v, APP_VERSION) ? latest : CHANGELOG;
  $("#clList").innerHTML = list.map(e => {
    const tag = e.v === APP_VERSION ? '<span class="tag">지금 버전</span>' : (newer(e.v, APP_VERSION) ? '<span class="tag">새 버전</span>' : "");
    return `<div class="cl"><h3>v${esc(e.v)} ${tag}</h3><ul>${e.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>`;
  }).join("");
}
async function checkUpdate() {
  const st = $("#vStatus");
  st.className = "st"; st.textContent = "확인 중...";
  try {
    const res = await fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw 0;
    const html = await res.text();
    const m = html.match(/<script type="application\/json" id="changelog">([\s\S]*?)<\/script>/);
    if (!m) throw 0;
    latest = JSON.parse(m[1]);
    const lv = latest[0].v;
    if (newer(lv, APP_VERSION)) {
      st.className = "st new"; st.textContent = `새 버전 v${lv}이 있어요! 새로고침을 눌러주세요.`;

    } else {
      st.textContent = "최신 버전이에요.";

    }
  } catch (e) {
    st.textContent = "새 버전을 확인하지 못했어요. 새로고침하면 최신 버전을 불러와요.";
  }
  renderChangelog();
}
$("#sUpd").onclick = () => { renderChangelog(); show("updates"); checkUpdate(); };
$("#vCheck").onclick = checkUpdate;
$("#vReload").onclick = () => {
  if (busy) return;
  try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e) {}
  if (window.claude) { location.reload(); return; }
  location.replace(location.pathname + "?v=" + Date.now());
};


renderHome();
})();
