@font-face{font-family:"HandRam";font-display:swap;src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_five@.2.0/UhBeeRami.woff") format("woff")}
@font-face{font-family:"HandDng";font-display:swap;src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_five@.2.0/UhBeeDongKyung.woff") format("woff")}
@font-face{font-family:'GounBatang';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2108@1.1/GowunBatang-Regular.woff') format('woff');font-weight:400;font-display:swap}
@font-face{font-family:'GounBatang';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2108@1.1/GowunBatang-Bold.woff') format('woff');font-weight:700;font-display:swap}
@font-face{font-family:'GowoonDodum';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2108@1.1/GowunDodum-Regular.woff') format('woff');font-weight:400;font-display:swap}
:root{
  --bg:#f3eff6; --panel:#ffffff; --ink:#262033; --soft:#6f6780; --line:#ddd5e6;
  --accent:#8a4f7d; --accent-ink:#fff; --narr:#5c5370;--faint:#9d96a9; --user-bg:#ebe2f2; --char-bg:#ffffff;
  --danger:#b04545;
  --font-body:"GowoonDodum","Gowun Dodum","Noto Sans KR",system-ui,-apple-system,sans-serif;
  --font-serif:"GounBatang","Gowun Batang",serif;
  --font-size:15px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b1824; --panel:#252131; --ink:#ece7f3; --soft:#a79fb6; --line:#3a3448;
    --accent:#d99bc6; --accent-ink:#21172a; --narr:#c0b5d2;--faint:#8b8399; --user-bg:#342b44; --char-bg:#252131; --danger:#e08a8a;
  }
}
:root[data-theme="ocean"]{--bg:#eef6ff;--panel:#fff;--ink:#16324d;--soft:#5d7fa3;--line:#cfe0f2;--accent:#2f6fb5;--accent-ink:#fff;--narr:#42607d;--faint:#8aa6c2;--user-bg:#dbeafe;--char-bg:#fff;--danger:#b04545}
:root[data-theme="green"]{--bg:#ffffff;--panel:#f5faf5;--ink:#1e3324;--soft:#5f7d68;--line:#d4e6d7;--accent:#2f7d4f;--accent-ink:#fff;--narr:#44634f;--faint:#8fae99;--user-bg:#dff3e4;--char-bg:#f5faf5;--danger:#b04545}
:root[data-theme="flip"]{--bg:#d9e5f3;--panel:#eaf1fa;--ink:#17283d;--soft:#4f6a8c;--line:#b9cbe2;--accent:#2657a0;--accent-ink:#fff;--narr:#36506e;--faint:#7c92ae;--user-bg:#c9d9ee;--char-bg:#eaf1fa;--danger:#9c3b3b}
:root[data-theme="night"],:root[data-theme="dark"]{
  --bg:#1b1824; --panel:#252131; --ink:#ece7f3; --soft:#a79fb6; --line:#3a3448;
  --accent:#d99bc6; --accent-ink:#21172a; --narr:#c0b5d2;--faint:#8b8399; --user-bg:#342b44; --char-bg:#252131; --danger:#e08a8a;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;height:100dvh;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:var(--font-size);line-height:1.6;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{position:fixed;top:0;left:0;right:0;height:100%;height:100dvh;overflow:hidden;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.on{display:flex}

header.bar{display:flex;align-items:center;gap:6px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
header.bar h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.homebar{gap:6px;position:relative;padding:10px 14px}
.homebar>.icon{height:38px;min-width:38px;padding:0 10px;border-radius:12px;color:var(--soft);font-size:14px;font-weight:500}
.homebar>.icon:hover{background:var(--panel);color:var(--ink)}
.homebar>.icon svg{display:block}
.homebar .ttl{position:absolute;left:0;right:0;text-align:center;pointer-events:none}
.homebar .ttl h1{font-size:19px}
.homebar>.icon,.homebar>.plus{position:relative;z-index:1}
.homebar .spacer{flex:1}
.plus{width:38px;height:38px;flex:none;border:0;border-radius:12px;background:var(--user-bg);color:var(--accent);font-size:22px;line-height:1;display:grid;place-items:center}
.homebar .icon{display:grid;place-items:center}
header.bar h2{font-size:16px;margin:0;flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon{background:none;border:0;padding:6px 8px;border-radius:8px;color:var(--soft);font-size:15px}
.icon:hover{background:var(--line);color:var(--ink)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn:disabled{opacity:.5}

/* home */
.list{flex:1;overflow-y:auto;padding:8px 0}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;border:0;background:none;width:100%;text-align:left}
.row:hover{background:var(--panel)}
.optcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 22px}
.optcard label:first-child{margin-top:0}
.icon.back{font-size:26px;line-height:1;padding:0 4px 4px}
header.bar .icon.back+h2,header.bar .icon.back+h1{margin-left:-2px}
.msgmenu{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:50}
.msgmenu .sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;min-width:180px;overflow:hidden}
.msgmenu button{display:block;width:100%;border:0;background:none;padding:14px 18px;text-align:left;border-bottom:1px solid var(--line);color:var(--ink)}
.msgmenu button:last-child{border-bottom:0}
.avrow{display:flex;align-items:center;gap:14px;margin-top:6px}
.avbtns{display:flex;gap:8px;flex-wrap:wrap}
.av-lg{width:72px;height:72px;font-size:30px}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.hav{width:30px;height:30px;font-size:15px;flex:none}
.av{overflow:hidden;width:48px;height:48px;border-radius:50%;background:var(--user-bg);display:grid;place-items:center;font-size:22px;flex:none;font-family:var(--font-serif);font-weight:700;color:var(--accent)}
.row .meta{flex:1;min-width:0}
.row .nm{font-weight:700}
.row .pv{color:var(--soft);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:48px 24px;text-align:center;color:var(--soft)}
.empty p{font-family:var(--font-serif);font-size:18px;color:var(--ink);margin:0 0 6px}
.fab{margin:4px 16px 16px;align-self:stretch}
.ver-now{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:20px}
.ver-now .big{font-family:var(--font-serif);font-size:22px;font-weight:700}
.ver-now .st{color:var(--soft);font-size:14px;margin:4px 0 12px}
.ver-now .st.new{color:var(--accent);font-weight:700}
.ver-now .btns{display:flex;gap:8px}
.ver-now .btns .btn{flex:1}
.cl{margin:0 0 18px}
.cl h3{font-size:15px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.cl h3 .tag{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--user-bg);color:var(--accent)}
.cl ul{margin:0;padding-left:20px;color:var(--soft);font-size:14px}

@font-face{font-family:NeoDunggeunmo;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.3/NeoDunggeunmo.woff') format('woff');font-weight:400;font-display:swap}
/* ---- 핑크 (원본 딸기토끼) ---- */
:root[data-theme="berry"]{--bg:#fff8fa;--panel:#fffdfe;--ink:#5c3346;--soft:#c78aa2;--line:#ffcfe0;--accent:#ff5c7f;--accent-ink:#fff;--narr:#7E7986;--faint:#7a747f;--user-bg:#fdf0f6;--char-bg:#fffbfd;--danger:#d9486a}
:root[data-theme="berry"] body{background:linear-gradient(135deg,#fff8fa 0%,#ffeaf1 40%,#ffd6e4 75%,#ffb8d1 100%);background-attachment:fixed}
:root[data-theme="berry"] header.bar,:root[data-theme="berry"] .composer{background:rgba(255,244,248,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
:root[data-theme="berry"] .screen,:root[data-theme="berry"] .log{background:transparent}
:root[data-theme="berry"] .msg.char .body,:root[data-theme="berry"] .sbub{border:0;border-radius:17px;background:#fffbfd;box-shadow:0 4px 14px rgba(255,140,180,.13)}
:root[data-theme="berry"] .msg.user .body{background:#fdf0f6;color:#4a2836;box-shadow:0 4px 14px rgba(255,140,180,.10)}
:root[data-theme="berry"] .msg .who{color:#3a2b33;font-weight:700;font-size:13.5px}
:root[data-theme="berry"] .av{border:2px solid #fff;box-shadow:0 3px 9px rgba(255,120,160,.30)}
:root[data-theme="berry"] :is(.card,.paper,.optcard,.sumbox,.lore-entry,.ooc){border-radius:20px;border:1px solid var(--line);box-shadow:0 4px 16px rgba(255,140,180,.14)}
:root[data-theme="berry"] .btn,:root[data-theme="berry"] .seg{border-radius:14px}
:root[data-theme="berry"] .composer textarea{border-radius:22px;border:1px solid #ffd6e4}
:root[data-theme="berry"] #send{background:linear-gradient(135deg,#ff9ab8,#ff5c7f);color:#fff;box-shadow:0 4px 10px rgba(255,92,127,.38)}
:root[data-theme="berry"] legend,:root[data-theme="berry"] .sublabel{color:#ff5c7f}

/* ---- 새벽 액정 (원본) ---- */
.phone-status{display:none}
:root[data-theme="lcd"]{--bg:#B3C5D8;--panel:#C0CDDB;--ink:#233B59;--soft:#4D6480;--line:#778EA9;--accent:#243E63;--accent-ink:#E8EEF4;--narr:#465D79;--faint:#3D5775;--user-bg:#A0B8D0;--char-bg:#C5D3E0;--danger:#8f3a3a;
  --field:#CCDAE7;--phone-ui:"NeoDunggeunmo",monospace;--phone-frame:#6B809B;--phone-header:linear-gradient(180deg,#BDD0E3,#A1B8D1);--phone-title:#263D60;--phone-button:linear-gradient(180deg,#DCE4E9,#B3C4D5);--phone-button-text:#273F5D;--phone-grid:rgba(36,60,88,.065)}
:root[data-theme="lcd"] .app{box-shadow:inset 3px 0 0 #FFFFFF70,inset -3px 0 0 #35486228;border-inline:2px solid var(--phone-frame);background:var(--bg)}
:root[data-theme="lcd"] header.bar{position:relative;padding-top:30px;padding-bottom:10px;background:var(--phone-header);border-bottom:2px solid var(--phone-frame);box-shadow:inset 0 2px 0 #FFFFFF80,0 2px 0 #FFFFFF50;z-index:1;font-family:var(--phone-ui)}
:root[data-theme="lcd"] header.bar :is(h1,h2,.hsub,.icon,.plus){color:var(--phone-title);font-family:var(--phone-ui);font-weight:400}
:root[data-theme="lcd"] header.bar h1{letter-spacing:.04em;text-shadow:1px 1px #00000018}
:root[data-theme="lcd"] .phone-status{display:flex;align-items:center;gap:10px;position:absolute;left:16px;right:16px;top:9px;height:12px;color:var(--phone-title);pointer-events:none}
.phone-signal{height:11px;display:flex;align-items:flex-end;gap:2px;margin-right:auto}
.phone-signal i{width:3px;background:currentColor;height:3px}
.phone-signal i:nth-child(2){height:6px}.phone-signal i:nth-child(3){height:9px}.phone-signal i:nth-child(4){height:12px}
.phone-envelope{position:relative;width:15px;height:10px;border:1.5px solid currentColor}
.phone-envelope:after{content:"";position:absolute;width:8px;height:8px;border-right:1px solid currentColor;border-bottom:1px solid currentColor;transform:rotate(45deg);left:2px;top:-5px}
.phone-battery{position:relative;width:21px;height:10px;border:1.5px solid currentColor;padding:1px;background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 6px);background-clip:content-box}
.phone-battery:after{content:"";position:absolute;width:2px;height:4px;right:-4px;top:1.5px;background:currentColor}
:root[data-theme="lcd"] :is(.log,.form,.list){background-color:var(--bg);background-image:repeating-linear-gradient(0deg,var(--phone-grid) 0 1px,transparent 1px 3px);box-shadow:inset 0 2px 4px #263D5920}
:root[data-theme="lcd"] .log{padding-inline:16px}
:root[data-theme="lcd"] :is(.card,.optcard,.sumbox,.lore-entry,.ooc){border-radius:3px;border:1px solid var(--line);background:var(--panel);box-shadow:2px 2px 0 #40557418}
:root[data-theme="lcd"] .card{border-left:3px solid var(--accent)}
:root[data-theme="lcd"] :is(legend,label,.who,.sublabel,.mhead){font-family:var(--phone-ui);font-weight:400}
:root[data-theme="lcd"] .av{border-radius:3px;border:1px solid var(--phone-frame);box-shadow:inset 0 0 0 2px #FFFFFF60}
:root[data-theme="lcd"] .av img{border-radius:2px}
:root[data-theme="lcd"] :is(.msg .body,.sbub){border:1px solid var(--line);border-radius:3px;box-shadow:2px 2px 0 #4155741C;line-height:1.9;letter-spacing:0}
:root[data-theme="lcd"] .narr{font-style:normal;opacity:1}
:root[data-theme="lcd"] .msg .who{font-size:12px;color:var(--soft)}
:root[data-theme="lcd"] :is(input,textarea,select,.btn,.seg,.seg button){border-radius:3px}
:root[data-theme="lcd"] :is(input,textarea,select){border:1px solid var(--line);background:var(--field)}
:root[data-theme="lcd"] .btn,:root[data-theme="lcd"] .seg button.on{background:var(--phone-button);color:var(--phone-button-text);font-family:var(--phone-ui);box-shadow:inset 1px 1px 0 #FFFFFF60;border:1px solid var(--line)}
:root[data-theme="lcd"] .plus{border-radius:3px;border:1px solid #FFFFFF70;background:#FFFFFF20}
:root[data-theme="lcd"] .composer{background:var(--panel);border-top:2px solid var(--phone-frame);box-shadow:inset 0 2px 0 #FFFFFF70;padding-top:10px}
:root[data-theme="lcd"] .composer .quick{gap:8px;padding-bottom:3px}
:root[data-theme="lcd"] .composer .quick button{border:1px solid var(--line);border-radius:2px;background:var(--field);font:12px var(--phone-ui);color:var(--ink);padding:5px 8px}
:root[data-theme="lcd"] .composer textarea{background:var(--field);color:var(--ink);border:1px solid var(--phone-frame);border-radius:3px;box-shadow:inset 1px 2px 0 #31486514}
:root[data-theme="lcd"] #send{border-radius:4px;background:var(--phone-button);color:var(--phone-button-text);border:1px solid var(--phone-frame);box-shadow:inset 1px 1px 0 #FFFFFF70,1px 2px 0 #263C5525}
:root[data-theme="lcd"] .paper{box-shadow:2px 3px 0 #465C7820}

/* ---- 소설 배경 사진 ---- */
.nbgrow{display:flex;align-items:center;gap:14px;margin-top:6px}
.bgprev{position:relative;width:96px;height:170px;border-radius:14px;overflow:hidden;flex:0 0 auto;background:var(--panel) center/cover no-repeat;border:1px solid var(--line)}
.bgprev i{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.bgprev i::before{content:"";position:absolute;left:12px;right:12px;top:30px;height:34px;background:repeating-linear-gradient(180deg,rgba(235,235,240,.8) 0 2px,transparent 2px 9px)}
.bgprev i::after{content:"";position:absolute;left:12px;right:28px;top:78px;height:11px;background:repeating-linear-gradient(180deg,#F4F4F8 0 2px,transparent 2px 9px)}
.bgprev span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px}
/* 배경 사진 — 어두운 막을 덮고 밝은 글씨를 얹는다 (원본 방식) */
body[data-novelbg]{background:#0c0c10 !important;background-image:none !important}
body[data-novelbg]::after{content:"";position:fixed;inset:-30px;z-index:0;pointer-events:none;background-image:var(--novelbg);background-size:cover;background-position:center;background-repeat:no-repeat}
body[data-novelbg] .app{z-index:2;isolation:isolate;background:transparent !important;border:0 !important;box-shadow:none !important}
body[data-novelbg] .app::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:rgba(0,0,0,.45)}
body[data-novelbg] #chat,body[data-novelbg] .log{background:transparent !important;background-image:none !important;box-shadow:none !important}
body[data-novelbg] .log .msg.char .body{background:transparent !important;border:0 !important;box-shadow:none !important}
body[data-novelbg] .log :is(.body,.nline,.thinking,.ooc,.who){color:#F4F4F8;text-shadow:0 1px 2px rgba(0,0,0,.55),0 0 1px rgba(0,0,0,.45)}
body[data-novelbg] .log .narr{color:rgba(232,232,240,.80);font-style:italic}
body[data-novelbg] .log .say{color:var(--saycol,#F4F4F8);text-shadow:none}
body[data-novelbg] .log .spk{color:#F4F4F8}
body[data-novelbg] .log .gloss{color:rgba(232,232,240,.75)}
body[data-novelbg] .log .nline{color:rgba(230,230,238,.8)}
body[data-novelbg] .log .thinking{color:rgba(230,230,238,.75)}
body[data-novelbg] .log .ooc{color:rgba(230,230,238,.7);border-color:rgba(255,255,255,.3)}
body[data-novelbg] .log .msg.user .body{background:rgba(255,255,255,.12) !important;border:0 !important;box-shadow:none !important}
body[data-novelbg] .log .acts button{background:rgba(20,20,26,.55);border-color:rgba(255,255,255,.18);color:#F1F1F5}
body[data-novelbg] #chat header.bar{background:transparent !important;background-image:none !important;backdrop-filter:none !important;-webkit-backdrop-filter:none !important;border-bottom:0 !important;box-shadow:none !important}
body[data-novelbg] #chat header.bar :is(h2,.icon){color:#F4F4F8 !important;text-shadow:0 1px 3px rgba(0,0,0,.6)}
body[data-novelbg] #chat .phone-status{display:none !important}
body[data-novelbg] #chat .composer{background:#17171C !important;background-image:none !important;backdrop-filter:none !important;-webkit-backdrop-filter:none !important;border-color:rgba(255,255,255,.08) !important;box-shadow:none !important}
body[data-novelbg] #chat .composer .quick button{background:transparent;border-color:rgba(255,255,255,.14);color:rgba(230,230,238,.62) !important;font-family:inherit}
body[data-novelbg] #chat .composer textarea{background:#26262D !important;color:#F1F1F5 !important;border:1px solid rgba(255,255,255,.08) !important;box-shadow:none !important}
body[data-novelbg] #chat .composer textarea::placeholder{color:rgba(230,230,238,.45)}
body[data-novelbg] #send{background:#F1F1F5 !important;color:#17171C !important;border:0 !important;box-shadow:none !important}

.searchwrap{padding:0 16px 10px}
.searchwrap input{width:100%}
select{width:100%}
.backup{display:flex;justify-content:center;gap:8px;padding-top:8px}
.backup .icon{font-size:13px}

/* editor */
.form{flex:1;overflow-y:auto;padding:16px 16px 32px}
fieldset{border:0;margin:0 0 22px;padding:0}
legend{font-family:var(--font-serif);font-weight:700;font-size:17px;padding:0;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--soft);margin:12px 0 5px}
input[type=text],textarea,select{width:100%;font-size:16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
textarea{min-height:90px;line-height:1.55}
textarea.tall{min-height:180px}
.hint{font-size:12px;color:var(--soft);margin-top:4px}
.two{display:grid;grid-template-columns:80px 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--panel);padding:9px 4px;font-size:14px;color:var(--soft)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.actions{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.actions .btn{flex:1}

/* chat */
.log{flex:1;overflow-y:auto;padding:18px 16px 8px}
.msg{margin:0 0 18px}
.mrow{display:flex;gap:10px;align-items:flex-start}
.mcol{flex:1;min-width:0}
.mav{width:38px;height:38px;font-size:17px}
.msg.char .body{background:var(--char-bg);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:14px 16px}
.msg.user{display:flex;flex-direction:column;align-items:flex-end}
.msg.user .body{background:var(--user-bg);border-radius:17px 4px 17px 17px;padding:9px 13px;max-width:85%;width:fit-content;line-height:1.85;letter-spacing:-.004em}
.msg.user .body p{margin:0}
.msg.user .body p+p{margin-top:.35em}
.who{font-size:13px;color:var(--soft);margin:6px 0 6px 2px;font-weight:500}
.body p{margin:0 0 .7em}
.body p:last-child{margin-bottom:0}
.gloss{color:var(--faint);font-size:.92em}
.log:not(.pron-on) .pron,.log:not(.pron-on) .glc{display:none}
.log:not(.trans-on) .trans,.log:not(.trans-on) .glc{display:none}
.log:not(.pron-on):not(.trans-on) .gloss{display:none}
.tcard{background:#f3f4f6;border:1.5px solid #d9dbe0;border-radius:18px;overflow:hidden;margin:0 0 10px;color:#1f2329;font-family:-apple-system,"Noto Sans KR",sans-serif}
.thead{padding:18px 18px 14px;border-bottom:1px solid #d9dbe0}
.tpill{display:inline-block;background:#dfe3f7;color:#3949b5;font-size:13px;font-weight:600;padding:5px 11px;border-radius:9px}
.ttitle{font-size:18px;font-weight:700;margin:12px 0 6px}
.tmeta{font-size:13px;color:#7a7f89}
.tbody{padding:14px 18px 18px;font-size:15px;line-height:1.75}
.tsec{margin-top:4px}
.tent{margin-top:2px}
.trow{}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 10px}
.card .ctitle{font-size:12px;letter-spacing:.06em;color:var(--accent);font-weight:700;margin-bottom:8px}
.crow{margin:0 0 6px;line-height:1.65}
.crow:last-child{margin-bottom:0}
.clab{color:var(--soft);font-size:.88em;margin-right:8px}
.paper{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.07);margin:0 0 10px;color:var(--ink);font-size:1.25em;padding:19px 20px 22px}
.paper .ruled{line-height:30px;background-image:repeating-linear-gradient(180deg,transparent 0,transparent 29px,var(--line) 29px,var(--line) 30px);background-position:0 0;background-repeat:repeat;white-space:pre-wrap}
.paper.letter .lto{line-height:30px;margin:0 0 30px}
.paper.letter .lsign{display:block;text-align:right;line-height:30px;margin:30px 0 0}
.paper.diary{padding:16px 20px 22px}
.paper.diary .dhead{display:flex;align-items:baseline;gap:10px;font-size:.92em;color:var(--soft);padding-bottom:9px;margin-bottom:11px;border-bottom:1.5px solid var(--line)}
.paper.diary .dhead .wd{font-size:.8em}
.card.hand{font-family:"Nanum Pen Script",var(--font-serif);font-size:1.3em;line-height:32px;padding:14px 16px 18px;background-image:repeating-linear-gradient(transparent,transparent 31px,var(--line) 31px,var(--line) 32px);background-position:0 40px;background-repeat:repeat}
.card.hand .crow{margin-bottom:0}
.card.hand .clab{font-size:.7em}
.body.inner{font-style:italic;color:var(--narr);white-space:pre-wrap;line-height:1.75}
.ooc{border:1px dashed var(--line);border-radius:12px;padding:10px 13px;color:var(--soft);font-size:.96em;white-space:pre-wrap;margin:0 0 10px}
.nline{color:var(--soft);font-style:italic;font-family:var(--font-serif);margin:4px 2px 12px;line-height:1.75;font-size:.96em}
.msg.user.unov{display:block;margin:30px 0;padding:26px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.unov .np{margin:0 0 .6em;line-height:1.75}
.unov .np:last-child{margin:0}
.unov .nn{color:var(--narr)}
.unov .ns{color:var(--ink)}
.unov .ncmd{color:var(--soft)}
.unov .acts{justify-content:flex-start}
body[data-novelbg] .msg.user.unov{border-color:rgba(255,255,255,.2)}
body[data-novelbg] .unov .ns,body[data-novelbg] .unov .ncmd{color:#F4F4F8;text-shadow:0 1px 2px rgba(0,0,0,.55)}
body[data-novelbg] .unov .nn{color:rgba(232,232,240,.80);font-style:italic;text-shadow:0 1px 2px rgba(0,0,0,.55)}
.spk{font-weight:700;color:var(--accent)}
.bar{color:var(--soft);margin:0 8px}
.fmt-novel .msg.char .body,.fmt-script .msg.char .body{background:none;border:0;padding:0 2px}
.fmt-novel .msg.char .body{line-height:1.85}
.fmt-novel .body p,.fmt-script .body p{margin:0 0 .9em}
.fmt-novel .narr,.fmt-script .narr{color:var(--soft)}
.narr{font-family:var(--font-serif);color:var(--narr);line-height:1.8}
.say{color:var(--ink)}
.tools{display:none}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0}
.msg.user .acts{justify-content:flex-end}
.acts button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px;padding:8px 16px;font-size:14px}
.acts button.red{color:var(--danger)}
.msg{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.multi{margin:0 0 12px}
.hcol{flex:1;min-width:0}
.hcol h2{margin:0;font-size:16px}
.hsub{font-size:12px;color:var(--soft)}
.lore-tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.lore-tabs::-webkit-scrollbar{display:none}
.lore-tabs button{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:8px 13px;white-space:nowrap}
.lore-tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lore-tabs button span{opacity:.6;margin-left:3px}
.lore-entry{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:10px}
.lore-entry>summary{display:flex;align-items:center;gap:12px;padding:15px 16px;cursor:pointer;list-style:none;min-height:58px}
.lore-entry>summary::-webkit-details-marker{display:none}
.lore-entry>summary:before{content:"›";font-size:24px;line-height:1;color:var(--soft);flex:0 0 auto;transition:transform .15s}
.lore-entry[open]>summary:before{transform:rotate(90deg)}
.lore-entry[open]>summary{border-bottom:1px solid var(--line)}
.lore-peek{display:flex;align-items:baseline;gap:9px;min-width:0;flex:1;font-size:13px}
.lore-peek b{flex:0 1 auto;max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lore-peek>span{color:var(--soft);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.lore-fields{padding:5px 16px 16px}
.lore-fields .btn{width:100%;margin-top:12px}
.sumbox{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:0 0 8px}
.sumbox b{display:block;font-weight:600}
.sumbox span{display:block;font-size:13px;color:var(--soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addbtn{width:100%}
.sublabel{font-size:13px;color:var(--soft);margin:18px 0 8px;font-weight:600}
.sublog{display:flex;flex-direction:column;gap:6px}
.subline{display:flex;flex-direction:column;align-items:flex-start}
.subline.mine{align-items:flex-end}
.subline .nline{margin:4px 2px 8px}
.sbub{background:var(--char-bg);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:9px 13px;max-width:88%;width:fit-content;line-height:1.6}
.sbub p{margin:0 0 .5em}
.sbub p:last-child{margin:0}
.subline.mine .sbub{background:var(--user-bg);border:0;border-radius:14px 4px 14px 14px}
.acts.r{justify-content:flex-end}
.whochips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px}
.whochips button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:7px 14px;white-space:nowrap;color:var(--ink)}
.whochips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--soft);margin-bottom:4px}
.msg.user .mrow{align-self:stretch;width:100%}
.urow .mcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-end}
.msg.user .body{word-break:keep-all;overflow-wrap:anywhere}
.msg.user .tools{justify-content:flex-end}
.tools .icon{font-size:12px;padding:3px 7px}
.thinking{color:var(--soft);font-size:14px}
.thinking::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@media (prefers-reduced-motion:reduce){.thinking::after{animation:none;content:"..."}}
.err{color:var(--danger);font-size:13px;margin:-8px 0 16px}
.edit-area{width:100%;min-height:120px;font-size:16px}
.composer{border-top:1px solid var(--line);padding:10px 12px calc(env(safe-area-inset-bottom,0px) * var(--sab,1) + 10px);background:var(--bg)}
body[data-kb="1"] .composer{padding-top:6px;padding-bottom:6px}
.composer .quick{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.composer .quick::-webkit-scrollbar{display:none}
.composer .quick button{flex:none}
.composer .quick button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--soft);white-space:nowrap}
.composer .in{display:flex;gap:8px;align-items:flex-end}
.composer textarea{font-size:max(var(--font-size),16px);min-height:44px;max-height:160px;resize:none;border-radius:14px}
.composer .btn{padding:10px 14px;border-radius:14px;flex:none}
.banner{margin:12px 16px 0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--soft);background:var(--panel)}
</style>
</head>
<body>
<div class="app">

  <!-- 홈 -->
  <section class="screen on" id="home">
    <header class="bar homebar"><div class="phone-status" aria-hidden="true"><span class="phone-signal"><i></i><i></i><i></i><i></i></span><span class="phone-envelope"></span><span class="phone-battery"></span></div>
      <button class="plus" id="newChar" aria-label="새 캐릭터">+</button>
      <div class="ttl"><h1>밤편지</h1></div>
      <div class="spacer"></div>
      <button class="icon" id="searchBtn" aria-label="검색"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg></button>
      <button class="icon" id="setBtn">설정</button>
    </header>
    <div class="searchwrap" id="searchWrap" hidden><input type="text" id="searchIn" placeholder="캐릭터 검색"></div>
    <div class="banner" id="aiBanner" hidden>내장 Claude를 쓸 수 없는 곳이에요.</div>
    <div class="banner" id="syncBanner" hidden></div>
    <div class="list" id="charList"></div>
    <div class="backup"><button class="icon" id="exportBtn">백업 내보내기</button><button class="icon" id="importBtn">백업 불러오기</button><input type="file" id="importFile" accept=".json,application/json" hidden></div>
  </section>

  <!-- 업데이트 내역 -->
  <section class="screen" id="updates">
    <header class="bar"><div class="phone-status" aria-hidden="true"><span class="phone-signal"><i></i><i></i><i></i><i></i></span><span class="phone-envelope"></span><span class="phone-battery"></span></div><button class="icon back" data-back aria-label="뒤로">‹</button><h2>업데이트 내역</h2></header>
    <div class="form">
      <div class="ver-now">
        <div class="big">지금 버전 v<span id="vNow"></span></div>
        <div class="st" id="vStatus">확인 중...</div>
        <div class="btns"><button class="btn ghost" id="vCheck">다시 확인</button><button class="btn" id="vReload">새로고침</button></div>
      </div>
      <div id="clList"></div>
    </div>
  </section>

  <!-- 문체 예시 / 인트로 편집 -->
  <section class="screen" id="subedit">
    <header class="bar"><div class="phone-status" aria-hidden="true"><span class="phone-signal"><i></i><i></i><i></i><i></i></span><span class="phone-envelope"></span><span class="phone-battery"></span></div><button class="icon back" id="subBack" aria-label="뒤로">‹</button><h2 id="subTitle"></h2></header>
    <div class="form" id="subBody"></div>
  </section>

  <!-- 로어북 -->
  <section class="screen" id="lore">
    <header class="bar"><div class="phone-status" aria-hidden="true"><span class="phone-signal"><i></i><i></i><i></i><i></i></span><span class="phone-envelope"></span><span class="phone-battery"></span></div><button class="icon back" id="loreBack" aria-label="뒤로">‹</button><div class="hcol"><h2>로어북</h2><div class="hsub" id="loreSub"></div></div></header>
    <div class="form" id="loreBody"></div>
  </section>
  <section class="screen" id="lorebulk">
    <header class="bar"><div class="phone-status" aria-hidden="true"><span class="phone-signal"><i></i><i></i><i></i><i></i></span><span class="phone-envelope"></span><span class="phone-battery"></span></div><button class="icon back" id="lbBack" aria-label="뒤로">‹</button><h2>한꺼번에 넣기</h2></header>
    <div class="form"><textarea id="lb" style="min-height:320px"></textarea><button class="btn" id="lbgo" type="button" style="width:100%;margin-top:10px">넣기</button></div>
  </section>

  <!-- AI 설정 -->
  <section class="screen" id="settings">
    <header class="bar"><div class="phone-status" aria-hidden="true"><span class="phone-signal"><i></i><i></i><i></i><i></i></span><span class="phone-envelope"></span><span class="phone-battery"></span></div><button class="icon back" data-back aria-label="뒤로">‹</button><h2>설정</h2></header>
    <div class="form">
      <fieldset hidden>
        <legend>AI 제공자</legend>
        <div class="seg" id="sProv"><button data-v="builtin">내장 Claude</button><button data-v="openai">OpenAI</button><button data-v="custom">직접 입력</button></div>
        <div class="hint" id="sProvHint"></div>
      </fieldset>
      <fieldset>
        <legend>화면</legend>
        <label for="sTheme">테마</label>
        <select id="sTheme"></select>
        <label for="sFontSel">글꼴</label>
        <select id="sFontSel"></select>
        <label for="sFs" id="sFsLabel">글자 크기</label>
        <input type="range" id="sFs" min="12" max="22" step="0.5" style="width:100%;padding:0">
        <label>프로필 사진</label>
        <label style="display:flex;gap:10px;align-items:center;color:var(--ink);font-size:15px;margin:6px 0"><input type="checkbox" id="sUav" style="width:20px;height:20px"> 내 프로필 사진 보기</label>
        <label>대사 번역·발음</label>
        <label style="display:flex;gap:10px;align-items:center;color:var(--ink);font-size:15px;margin:6px 0"><input type="checkbox" id="sTrans" style="width:20px;height:20px"> 번역 보기</label>
        <label style="display:flex;gap:10px;align-items:center;color:var(--ink);font-size:15px;margin:0 0 6px"><input type="checkbox" id="sPron" style="width:20px;height:20px"> 발음 보기</label>
      </fieldset>
      <fieldset>
        <legend>문단 정리</legend>
        <label style="display:flex;gap:10px;align-items:center;color:var(--ink);font-size:15px;margin:0"><input type="checkbox" id="sMerge" style="width:20px;height:20px"> 대사만 있는 줄을 지문 문단에 붙이기</label>
      </fieldset>
      <fieldset id="sApi" hidden>
        <legend>연결 정보</legend>
        <div id="sUrlWrap">
          <label for="sUrl">API 주소 (OpenAI 호환)</label>
          <input type="text" id="sUrl" placeholder="https://openrouter.ai/api/v1" autocomplete="off" spellcheck="false">
        </div>
        <label for="sKey">API 키</label>
        <input type="text" id="sKey" placeholder="sk-..." autocomplete="off" spellcheck="false" style="-webkit-text-security:disc">
        <label for="sModel">모델 이름</label>
        <input type="text" id="sModel" list="modelList" placeholder="gpt-4.1" autocomplete="off" spellcheck="false">
        <datalist id="modelList"><option value="gpt-4.1"><option value="gpt-4.1-mini"><option value="gpt-4o"><option value="gpt-4o-mini"></datalist>
        <label for="sTemp">창의성 (temperature): <span id="sTempV"></span></label>
        <input type="range" id="sTemp" min="0" max="1.5" step="0.05" style="width:100%">
        <label for="sMax">최대 출력 토큰</label>
        <input type="text" id="sMax" inputmode="numeric" placeholder="비워두기 (추천)">
        <div style="margin-top:14px"><button class="btn ghost" id="sTest">연결 테스트</button> <span class="hint" id="sTestOut"></span></div>
      </fieldset>
      <fieldset>
        <legend>앱</legend>
        <div class="hint" id="sVer"></div>
        <button class="btn ghost" id="sUpd" type="button">업데이트 확인</button>
        <div class="hint" id="sUpdOut"></div>
      </fieldset>
    </div>
    <div class="actions"><button class="btn" id="sSave">저장</button></div>
  </section>

  <!-- 편집 -->
  <section class="screen" id="editor">
    <header class="bar"><div class="phone-status" aria-hidden="true"><span class="phone-signal"><i></i><i></i><i></i><i></i></span><span class="phone-envelope"></span><span class="phone-battery"></span></div><button class="icon back" data-back aria-label="뒤로">‹</button><h2 id="edTitle">새 캐릭터</h2></header>
    <div class="form">
      <div class="optcard">
        <label>대화 형식</label>
        <div class="seg" id="fFormat"><button data-v="bubble">말풍선</button><button data-v="novel">소설</button><button data-v="script">대본</button></div>
        <label>길이</label>
        <div class="seg" id="fLen"><button data-v="auto">자동</button><button data-v="short">짧게</button><button data-v="mid">보통</button><button data-v="long">길게</button></div>
        <label>대사 언어</label>
        <div class="seg" id="fLang"><button data-v="ko">한국어</button><button data-v="ja">일본어</button><button data-v="en">영어</button><button data-v="zh">중국어</button></div>
        <label>시제</label>
        <div class="seg" id="fTense"><button data-v="past">과거</button><button data-v="present">현재</button></div>
        <label>나레이션</label>
        <div class="seg" id="fNarr"><button data-v="off">끔</button><button data-v="some">가끔</button><button data-v="many">자주</button></div>
        <label for="fHand">편지·일기 필체</label>
        <select id="fHand"></select>
        <label>소설 배경 사진</label>
        <div class="nbgrow">
          <div class="bgprev" id="nbgPrev"><span>🖼</span></div>
          <div class="avbtns"><button class="btn ghost" id="nbgPick" type="button">사진 고르기</button><button class="btn ghost" id="nbgClear" type="button">지우기</button><input type="file" id="nbgFile" accept="image/*" hidden></div>
        </div>
        <label for="saycol">배경 있을 때 대사 색</label>
        <div style="display:flex;gap:8px;align-items:center"><input id="saycol" type="color" value="#F4F4F8" style="width:56px;padding:2px;height:40px"><button class="btn ghost" id="saycolx" type="button">기본색으로</button></div>
      </div>

      <fieldset>
        <legend>세계관 및 상황</legend>
        <label for="fWorld">상황 및 세계관</label>
        <textarea id="fWorld" class="tall"></textarea>
        <label>프로필 사진</label>
        <div class="avrow">
          <div class="av av-lg" id="avPreview"></div>
          <div class="avbtns">
            <button class="btn ghost" id="avPick" type="button">사진 고르기</button>
            <button class="btn ghost" id="avClear" type="button">삭제</button>
            <input type="file" id="avFile" accept="image/*" hidden>
          </div>
        </div>
        <label for="fName">이름</label>
        <input type="text" id="fName">
        <label for="fChar">캐릭터 프롬프트</label>
        <textarea id="fChar" class="tall"></textarea>
        <label>문체 예시</label>
        <div id="styleList"></div>
        <button class="btn ghost addbtn" id="styleAdd" type="button">+ 문체 예시 추가</button>
      </fieldset>

      <fieldset>
        <legend>유저</legend>
        <label>프로필 사진</label>
        <div class="avrow">
          <div class="av av-lg" id="uavPreview"></div>
          <div class="avbtns">
            <button class="btn ghost" id="uavPick" type="button">사진 고르기</button>
            <button class="btn ghost" id="uavClear" type="button">삭제</button>
            <input type="file" id="uavFile" accept="image/*" hidden>
          </div>
        </div>
        <label for="fUName">이름</label>
        <input type="text" id="fUName">
        <label for="fUser">프롬프트</label>
        <textarea id="fUser" class="tall"></textarea>
      </fieldset>

      <fieldset>
        <legend>인트로</legend>
        <div id="introList"></div>
        <button class="btn ghost addbtn" id="introAdd" type="button">+ 인트로 추가</button>
      </fieldset>

<script>
(() => {
const $ = s => document.querySelector(s);

// ---- 계정 저장소 (업데이트해도 유지) ----
let db = null, uid = null, dbReady = false;
const pages = {};
const dirtyChats = new Set();
const dirtyAvatars = new Set();
let metaDirty = false, flushTimer = null;
const col = () => db.collection("data/users/" + uid);
const PAGE = 180000;

function save(chatId) {
  try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e) {}
  metaDirty = true;
  if (chatId === undefined) chatId = cur;
  if (chatId) dirtyChats.add(chatId);
  if (!dbReady) return;
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, 700);
}

function splitPages(list) {
  const out = []; let curp = [], size = 0;
  list.forEach(m => {
    const s = JSON.stringify(m).length;
    if (curp.length && size + s > PAGE) { out.push(curp); curp = []; size = 0; }
    curp.push(m); size += s;
  });
  if (curp.length || !out.length) out.push(curp);
  return out;
}

async function flush() {
  if (!dbReady) return;
  const chats = [...dirtyChats]; dirtyChats.clear();
  const doMeta = metaDirty; metaDirty = false;
  try {
    for (const id of chats) {
      const exists = store.chars.some(c => c.id === id);
      const parts = exists ? splitPages(store.chats[id] || []) : [];
      for (let i = 0; i < parts.length; i++) await col().doc(`chat_${id}_${i}`).set({ msgs: parts[i] });
      const old = pages[id] || 0;
      for (let i = parts.length; i < old; i++) await col().doc(`chat_${id}_${i}`).delete();
      if (exists) pages[id] = parts.length; else delete pages[id];
    }
    for (const id of [...dirtyAvatars]) {
      const c = store.chars.find(x => x.id === id);
      if (c && c.avatar) await col().doc(`avatar_${id}`).set({ img: c.avatar });
      else await col().doc(`avatar_${id}`).delete().catch(() => {});
      if (c && c.nbg) await col().doc(`nbg_${id}`).set({ img: c.nbg });
      else await col().doc(`nbg_${id}`).delete().catch(() => {});
      dirtyAvatars.delete(id);
    }
    if (doMeta || chats.length) await col().doc("meta").set({ chars: store.chars.map(c => { const o = Object.assign({}, c); delete o.avatar; delete o.nbg; return o; }), theme: store.theme || null, pages });
    setSync("");
  } catch (e) {
    chats.forEach(id => dirtyChats.add(id)); metaDirty = true;
    setSync("계정 저장에 실패했어요. 이 기기에는 저장돼 있어요.");
  }
}
function setSync(t) { const b = $("#syncBanner"); b.textContent = t; b.hidden = !t; }

async function initDb() {
  try {
    const [d, u] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!d || !u) return;
    const id = await u.id();
    if (!id) return;
    db = d; uid = id;
    const meta = await col().doc("meta").get();
    if (meta.exists) {
      const m = meta.data();
      Object.assign(pages, m.pages || {});
      const chats = {};
      await Promise.all((m.chars || []).map(async c => {
        const n = pages[c.id] || 0, list = [];
        const snaps = await Promise.all([...Array(n)].map((_, i) => col().doc(`chat_${c.id}_${i}`).get()));
        snaps.forEach(s => { if (s.exists) list.push(...(s.data().msgs || [])); });
        chats[c.id] = list;
        try { const a = await col().doc(`avatar_${c.id}`).get(); if (a.exists) c.avatar = a.data().img; } catch (e) {}
        try { const nb = await col().doc(`nbg_${c.id}`).get(); if (nb.exists) c.nbg = nb.data().img; } catch (e) {}
      }));
      store = { chars: m.chars || [], chats, theme: m.theme || store.theme };
      try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e) {}
      if (store.theme) document.documentElement.dataset.theme = store.theme;
      dbReady = true;
    } else {
      dbReady = true;
      if (store.chars.length) { store.chars.forEach(c => dirtyChats.add(c.id)); metaDirty = true; await flush(); }
    }
    if ($("#home").classList.contains("on")) renderHome();
  } catch (e) {
    setSync("계정 저장소에 연결하지 못했어요. 지금은 이 기기에만 저장돼요.");
  }
}

// ---- AI 설정 (이 기기에만 저장) ----
const SKEY = "bamp_ai_v1";

$("#sTest").onclick = async () => {

function apiBase(cfg) { return cfg.prov === "openai" ? "https://api.openai.com/v1" : cfg.url; }
async function callApi(cfg, messages, onText, signal, maxOverride) {
  if (!cfg.key && cfg.prov === "openai") throw new Error("API 키를 입력해주세요.");
  if (cfg.prov === "custom" && !cfg.url) throw new Error("API 주소를 입력해주세요.");
  if (!cfg.model) throw new Error("모델 이름을 입력해주세요.");
  const body = { model: cfg.model, messages, stream: true, temperature: cfg.temp };
  const mt = cfg.max || 0;
  if (cfg.prov === "openai" && /^(o\d|gpt-5)/.test(cfg.model)) { delete body.temperature; if (mt) body.max_completion_tokens = mt; }
  else if (mt) body.max_tokens = mt;
  let res;
  try {
    res = await fetch(apiBase(cfg) + "/chat/completions", {
      method: "POST", signal,
      headers: Object.assign({ "Content-Type": "application/json" }, cfg.key ? { Authorization: "Bearer " + cfg.key } : {}),
      body: JSON.stringify(body)
    });
  } catch (e) {
    if (e.name === "AbortError") throw e;
    throw new Error(inClaude ? "claude.ai 안에서는 외부 API에 연결할 수 없어요. 파일을 따로 올려서 열어주세요." : "서버에 연결하지 못했어요. 주소와 인터넷 연결을 확인해주세요.");
  }
  if (!res.ok) {
    let msg = "";
    try { const j = await res.json(); msg = j.error?.message || j.message || ""; } catch(e) {}
    const m = { 401: "API 키가 올바르지 않아요.", 403: "이 키로는 접근 권한이 없어요.", 404: "모델 이름이나 주소를 찾을 수 없어요.", 429: "요청이 너무 많거나 크레딧이 부족해요." }[res.status];
    throw new Error((m || "오류 " + res.status) + (msg ? " (" + msg.slice(0, 120) + ")" : ""));
  }
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", text = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split("\n"); buf = lines.pop();
    for (const line of lines) {
      const l = line.trim();
      if (!l.startsWith("data:")) continue;
      const data = l.slice(5).trim();
      if (data === "[DONE]") continue;
      try {
        const j = JSON.parse(data);
        const delta = j.choices?.[0]?.delta?.content || "";
        if (delta) { text += delta; onText && onText(text); }
      } catch(e) {}
    }
  }
  return text;
}
function apiMessages(c, extraUser, cmd) {
  const t = buildTurns(c, extraUser, cmd).filter(m => m.content && m.content.trim());
  // 직접 입력(프록시 등)은 system 역할을 못 받는 경우가 많아서 첫 user 메시지에 설정을 합쳐 보냄
  if (ai.prov === "custom") return t;

}

const newId = () => Math.random().toString(36).slice(2, 10);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const sub = (t, c) => (t || "").replace(/\{\{\s*user\s*\}\}/gi, c.uname || "유저").replace(/\{\{\s*char\s*\}\}/gi, c.name || "캐릭터");

// *지문* / 대사 렌더링
function iga(name) {
  const n = String(name || "").trim();
  const ch = n.charCodeAt(n.length - 1);
  if (ch >= 0xAC00 && ch <= 0xD7A3) return n + ((ch - 0xAC00) % 28 ? "이" : "가");
  return n + "이(가)";
}
/* 소설·대본 — 내 글 (원본 방식). 별표가 있으면 별표 기준, 없으면 따옴표 안을 대사로 본다. 줄마다 문단 */
function quoteSay(t) { t = String(t || "").trim(); if (!t) return t; if (/^["“'‘「『]/.test(t)) return t; return "\u201c" + t + "\u201d"; }
function starSegs(line) {
  const segs = [], re = /\*{1,3}([\s\S]+?)\*{1,3}/g; let last = 0, m;
  while ((m = re.exec(line))) {
    if (m.index > last) { const pre = line.slice(last, m.index).trim(); if (pre) segs.push({ nar: false, t: pre }); }
    const inner = m[1].trim(); if (inner) segs.push({ nar: true, t: inner });
    last = re.lastIndex;
  }
  const tail = line.slice(last).trim(); if (tail) segs.push({ nar: false, t: tail });
  if (!segs.length && line) segs.push({ nar: false, t: line });
  return segs;
}
function userNovelHTML(raw) {
  const src = String(raw || "").replace(/\r/g, "");
  if (/^\s*[\/#]/.test(src)) return `<p class="np"><span class="ncmd">${esc(src.trim())}</span></p>`;
  const starMode = /\*/.test(src), quoteMode = !starMode && /["“「『]/.test(src);
  let out = "";
  src.split(/\n+/).forEach(line => {
    line = line.trim(); if (!line) return;
    let segs = [];
    if (starMode) segs = starSegs(line);
    else if (!quoteMode) segs = [{ nar: false, t: line }];
    else {
      const re = /("[^"\n]*"|“[^”\n]*”|「[^」\n]*」|『[^』\n]*』)/g; let last = 0, m;
      while ((m = re.exec(line))) {
        const pre = line.slice(last, m.index).trim(); if (pre) segs.push({ nar: true, t: pre });
        segs.push({ nar: false, t: m[1] }); last = re.lastIndex;
      }
      const tail = line.slice(last).trim(); if (tail) segs.push({ nar: true, t: tail });
    }
    let inner = "";
    const flush = () => { if (inner) out += `<p class="np">${inner}</p>`; inner = ""; };
    segs.forEach(sg => {
      const tx = esc(sg.nar ? sg.t : quoteSay(sg.t));
      if (sg.nar) inner += (inner ? " " : "") + `<span class="nn">${tx}</span>`;
      else { flush(); inner = `<span class="ns">${tx}</span>`; flush(); }
    });
    flush();
  });
  return out;
}
function fmtOf(c) { return c && (c.format === "novel" || c.format === "script") ? c.format : "bubble"; }

const CMD_ALIAS = { "/휴지통": "/삭제내역", "/복구": "/삭제내역", "#속마음": "/속마음", "/속마음보기": "/속마음", "/관계도": "/관계", "/상태창": "/상태", "/커뮤니티": "/커뮤", "/커뮤반응": "/커뮤", "/주문": "/쇼핑", "/주문내역": "/쇼핑", "/결제내역": "/결제", "/장면전환": "/전환" };
const CARD_CMDS = { "/삭제내역": 1, "/편지": 1, "/일기": 1, "/플리": 1, "/관계": 1, "/상태": 1, "/소문": 1, "/커뮤": 1, "/인스타": 1, "/쇼핑": 1, "/결제": 1 };
function parseCmd(text) {
  const m = String(text || "").match(/^\s*([\/#][^\s]+)\s*([\s\S]*)$/);
  if (!m) return null;
  const key = CMD_ALIAS[m[1]] || m[1];
  if (!CMDS[key]) return null;
  return { key, rest: m[2].trim() };
}

function paperCard(kind, body, hand) {
  const style = hand ? ` style="font-family:${hand}"` : "";
  const txt = String(body || "").replace(/\r/g, "").trim();
  if (kind === "편지") {
    const to = txt.match(/\[수신\]([\s\S]*?)\[\/수신\]/);
    const main = txt.match(/\[본문\]([\s\S]*?)\[\/본문\]/);
    const sg = txt.match(/\[서명\]([\s\S]*?)\[\/서명\]/);
    let tTo = to ? to[1].trim() : "", tBody = main ? main[1].trim() : "", tSign = sg ? sg[1].trim() : "";
    if (!main) {
      const ls = txt.split("\n").map(l => l.trim()).filter(Boolean);
      if (ls.length > 1 && /(에게|께|へ|様|先生)\s*[,.:]?$/.test(ls[0])) tTo = ls.shift();
      if (ls.length > 1 && /(올림|드림|씀|より|From|Sincerely)/i.test(ls[ls.length - 1]) && ls[ls.length - 1].length <= 60) tSign = ls.pop();
      tBody = ls.join(" ");
    }
    return `<div class="paper letter"${style}>${tTo ? `<div class="lto">${esc(tTo)}</div>` : ""}<div class="ruled">${esc(tBody.replace(/\n+/g, " "))}</div>${tSign ? `<div class="lsign">${esc(tSign)}</div>` : ""}</div>`;
  }
  const dl = txt.split("\n");
  let dtxt = "", di = -1;
  for (let q = 0; q < dl.length && q < 4; q++) {
    const L = dl[q].trim();
    if (!L) continue;
    if (/^날짜\s*[:：]/.test(L)) { dtxt = L.replace(/^날짜\s*[:：]\s*/, "").trim(); di = q; break; }
    if (/^\d{4}\s*[.\-년]/.test(L) || /^\d{1,2}\s*월\s*\d{1,2}\s*일/.test(L)) { dtxt = L; di = q; break; }
  }
  if (di >= 0) dl.splice(di, 1);
  let wd = "";
  const mw = dtxt.match(/([월화수목금토일])\s*요일/);
  if (mw) { wd = mw[0]; dtxt = dtxt.replace(/[,·\s(]*([월화수목금토일])\s*요일[)]*/, "").trim(); }
  const rest = dl.join(" ").replace(/^본문\s*[:：]\s*/, "").replace(/\s+/g, " ").trim();
  return `<div class="paper diary"${style}><div class="dhead"><span>${esc(dtxt)}</span>${wd ? `<span class="wd">${esc(wd)}</span>` : ""}</div><div class="ruled">${esc(rest)}</div></div>`;
}
function trashCard(body) {
  const lines = String(body || "").replace(/\r/g, "").split("\n").map(l => l.trim()).filter(Boolean);
  const html = lines.map(l => {
    if (/^\[[^\]]+\]$/.test(l)) return `<div class="tsec">${esc(l)}</div>`;
    if (/^-\s/.test(l)) return `<div class="tent">${esc(l)}</div>`;
    return `<div class="trow">${esc(l)}</div>`;
  }).join("");
  return `<div class="tcard"><div class="thead"><span class="tpill">휴지통 복구 기록 (통화·메시지)</span><div class="ttitle">최근 삭제된 송수신 내역</div><div class="tmeta">시스템 복구 로그 · 복구됨 · 조회 0</div></div><div class="tbody">${html}</div></div>`;
}
function renderCards(text, hand) {
  const re = /\[(삭제내역|편지|일기|플리|관계|상태|소문|커뮤|인스타|주문|결제)\]([\s\S]*?)\[\/\1\]/g;
  let out = "", last = 0, m;
  while ((m = re.exec(text))) {
    out += renderPlainChunk(text.slice(last, m.index));
    const kind = m[1], isHand = kind === "편지" || kind === "일기";
    if (kind === "편지" || kind === "일기") { out += paperCard(kind, m[2], hand); last = re.lastIndex; continue; }
    if (kind === "삭제내역") { out += trashCard(m[2]); last = re.lastIndex; continue; }
    const rows = m[2].split(/\n/).map(l => l.trim()).filter(Boolean).map(l => {
      const lb = l.match(/^([^:|]{1,8}):\s*([\s\S]*)$/);
      if (lb) return `<div class="crow"><span class="clab">${esc(lb[1])}</span><span>${esc(lb[2])}</span></div>`;
      return `<div class="crow"><span>${esc(l)}</span></div>`;
    }).join("");
    out += `<div class="card${isHand ? " hand" : ""}"${isHand && hand ? ` style="font-family:${hand}"` : ""}><div class="ctitle">${esc(CARD_TITLES[kind] || kind)}</div>${rows}</div>`;
    last = re.lastIndex;
  }
  if (!out) return null;
  out += renderPlainChunk(text.slice(last));
  return out;
}
function renderPlainChunk(t) { return t && t.trim() ? renderBlocks(t, "bubble") : ""; }
function renderBlocks(text, fmt) {
  const lines = text.replace(/\r/g, "").split(/\n/).map(l => l.trim()).filter(Boolean);
  let html = "", buf = [];
  const flush = () => { if (buf.length) { html += `<div class="body">${renderText(buf.join("\n"), fmt)}</div>`; buf = []; } };
  lines.forEach(l => {
    const m = l.match(/^(?:>>|》)\s*(.*)$/);
    if (m) { flush(); html += `<div class="nline">${esc(m[1].replace(/\*/g, ""))}</div>`; }
    else buf.push(l);
  });
  flush();
  return html || `<div class="body"></div>`;
}
function renderText(text, fmt) {
  fmt = fmt || "bubble";
  const narrDefault = fmt !== "bubble";
  const lines = text.replace(/\r/g, "").split(/\n/).map(l => l.trim()).filter(Boolean);
  return lines.map(l => {
    const name = l.match(/^([^\s:|*"“(]{1,14})\s*[:|]\s*(.*)$/);
    let prefix = "";
    if (fmt === "script" && name) { prefix = `<span class="spk">${esc(name[1])}</span><span class="bar">|</span>`; l = name[2]; }
    const parts = l.split(/(\[\[[^\]]*\]\]|\*[^*]+\*|\([^)]*\)|"[^"]*"|“[^”]*”)/g).filter(x => x && x.length);
    const html = parts.map(x => {
      const gl = x.match(/^\[\[([^\]]*)\]\]$/);
      if (gl) {
        const seg = gl[1].split("|");
        const pron = seg.length > 1 ? seg[0].trim() : "";
        const tr = (seg.length > 1 ? seg.slice(1).join("|") : seg[0]).trim();
        return `<span class="gloss">(${pron ? `<span class="pron">${esc(pron)}</span>` : ""}${pron && tr ? `<span class="glc">, </span>` : ""}${tr ? `<span class="trans">${esc(tr)}</span>` : ""})</span>`;
      }
      if (/^\*[^*]+\*$/.test(x)) return `<span class="narr">${esc(x.slice(1, -1))}</span>`;
      if (/^\(.*\)$/.test(x)) return `<span class="narr">${esc(x)}</span>`;
      if (/^["“].*["”]$/.test(x)) return `<span class="say">${esc(x)}</span>`;
      const clean = x.replace(/\*/g, "");
      if (!clean.trim()) return esc(clean);
      return `<span class="${narrDefault ? "narr" : "say"}">${esc(clean)}</span>`;
    }).join("");
    return `<p>${prefix}${html}</p>`;
  }).join("");
}

// 대사만 있는 문단을 앞 지문 문단에 붙이기
function mergeDialogue(text) {
  const paras = text.replace(/\r/g, "").split(/\n+/).map(p => p.trim()).filter(Boolean);
  const isNarr = p => /\*[^*]+\*/.test(p);
  if (!paras.some(isNarr) || !paras.some(p => !isNarr(p))) return text;
  const out = [];
  let pending = "";
  paras.forEach(p => {
    if (!isNarr(p)) {
      if (out.length && out[out.length - 1].length + p.length < 600) out[out.length - 1] += " " + p;
      else if (out.length) out.push(p);
      else pending += (pending ? " " : "") + p;
    } else {
      out.push(pending ? pending + " " + p : p);
      pending = "";
    }
  });
  if (pending) out.push(pending);
  return out.join("\n\n");
}

function pickImage(f, done) {
  if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const S = 256, cv = document.createElement("canvas");
      cv.width = S; cv.height = S;
      const side = Math.min(img.width, img.height);
      cv.getContext("2d").drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, S, S);
      done(cv.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = () => alert("이미지를 읽지 못했어요.");
    img.src = fr.result;
  };
  fr.readAsDataURL(f);
}

function parseLoreBulk(raw) {
  const blocks = String(raw || "").replace(/\r/g, "").split(/\n\s*\n/);
  const out = [];
  blocks.forEach(bl => {
    let t = "", k = "", body = [], mode = null;
    bl.split("\n").forEach(L => {
      let m;
      if ((m = L.match(/^\s*제목\s*[:：]\s*(.*)$/))) { t = m[1].trim(); mode = "t"; return; }
      if ((m = L.match(/^\s*키워드\s*[:：]\s*(.*)$/))) { k = m[1].trim(); mode = "k"; return; }
      if ((m = L.match(/^\s*내용\s*[:：]\s*(.*)$/))) { if (m[1].trim()) body.push(m[1]); mode = "c"; return; }
      if (!t && !k && (m = L.match(/^\s*([^|\n]{1,30})\|\s*(.*)$/))) { t = m[1].trim(); k = m[2].trim(); mode = "c"; return; }
      if (mode === "c" || mode === null) body.push(L);
      else if (mode === "k" && L.trim()) k += ", " + L.trim();
      else if (mode === "t" && L.trim()) body.push(L);
    });
    const text = body.join("\n").trim();
    if (!text && !k) return;
    out.push({ title: t, keys: k, text, always: false });
  });
  return out;
}

function pickLore(c) {

  const log = msgs().slice(-4).map(m => m.text).join(" ");
  const out = [], rest = [];

  h += `<div class="sublabel">${se.kind === "sample" ? "대화" : "첫 상황"}</div><div class="sublog">`;
  let prev = null;
  lines.forEach((l, i) => {
    const acts = se.sel === i ? `<div class="acts${l.who === "@user" ? " r" : ""}"><button data-cp="${i}">복사</button><button data-ed="${i}">수정</button><button class="red" data-dl="${i}">삭제</button></div>` : "";
    if (se.edit === i) {
      h += `<div class="subline"><textarea class="edit-area" id="subEb">${esc(l.t)}</textarea><div class="acts"><button data-sv="${i}">저장</button><button data-cn="1">취소</button></div></div>`;
      prev = null; return;
    }
    if (!l.who) { h += `<div class="subline"><div class="nline" data-ln="${i}">${esc(l.t)}</div>${acts}</div>`; prev = null; return; }
    const mine = l.who === "@user", same = prev === l.who;
    h += `<div class="subline${mine ? " mine" : ""}">${!mine && !same ? `<div class="who">${esc(whoLabel(l.who, n))}</div>` : ""}<div class="sbub" data-ln="${i}">${renderText(l.t, "bubble")}</div>${acts}</div>`;
    prev = l.who;
  });
  h += `</div><div class="sublabel">한 줄 더</div><div class="whochips">`;
  [["", "내레이터"], ["@user", n.user], ["@char", n.char]].forEach(w => {
    h += `<button type="button" class="${se.who === w[0] ? "on" : ""}" data-w="${esc(w[0])}">${esc(w[1])}</button>`;

  if (se.kind === "sample" || editGreets.length > 1) h += `<button class="btn danger" id="subDel" type="button" style="width:100%;margin-top:10px">이 ${se.kind === "sample" ? "문체 예시" : "인트로"} 삭제</button>`;
  const B = $("#subBody");

  B.querySelectorAll("[data-w]").forEach(b => b.onclick = () => { se.who = b.dataset.w; renderSub(); });
  B.querySelectorAll("[data-ln]").forEach(el => {
    const i = +el.dataset.ln; let t = null;
    const tog = () => { se.sel = se.sel === i ? -1 : i; se.edit = -1; renderSub(); };
    el.addEventListener("contextmenu", e => { e.preventDefault(); tog(); });
    el.addEventListener("touchstart", () => { t = setTimeout(() => { t = null; tog(); }, 450); }, { passive: true });
    ["touchend", "touchmove", "touchcancel"].forEach(ev => el.addEventListener(ev, () => { if (t) { clearTimeout(t); t = null; } }, { passive: true }));
  });
  B.querySelectorAll("[data-cp]").forEach(b => b.onclick = () => { try { navigator.clipboard.writeText(lines[+b.dataset.cp].t); } catch (e) {} se.sel = -1; renderSub(); });
  B.querySelectorAll("[data-ed]").forEach(b => b.onclick = () => { se.edit = +b.dataset.ed; se.sel = -1; renderSub(); });
  B.querySelectorAll("[data-dl]").forEach(b => b.onclick = () => { lines.splice(+b.dataset.dl, 1); subSave(lines); se.sel = -1; renderSub(); });
  B.querySelectorAll("[data-sv]").forEach(b => b.onclick = () => { lines[+b.dataset.sv].t = $("#subEb").value; subSave(lines); se.edit = -1; renderSub(); });
  B.querySelectorAll("[data-cn]").forEach(b => b.onclick = () => { se.edit = -1; renderSub(); });
  $("#subGo").onclick = () => {
    const v = ($("#subTx").value || "").trim();

    setTimeout(() => { const f = $("#subTx"); if (f) f.focus(); }, 0);

    if (se.kind === "sample") editSamples.splice(se.idx, 1); else editGreets.splice(se.idx, 1);
    renderStyleList(); renderIntroList(); show("editor");

}

// 채팅
const char = () => store.chars.find(c => c.id === cur);
const msgs = () => store.chats[cur] || (store.chats[cur] = []);

function openChat(id) {
  cur = id; const c = char();
  const gl = (c.greetings && c.greetings.length ? c.greetings
    : (c.intros && c.intros.length ? c.intros : (c.greet ? [c.greet] : [])).map(t => "@" + (c.name || "캐릭터") + ": " + t)).filter(t => t && t.trim());
  if (!msgs().length && gl.length) {
    const pick = gl[Math.floor(Math.random() * gl.length)];
    let buf = null;
    const flushA = () => { if (buf) { msgs().push({ id: newId(), role: "assistant", text: sub(buf.join("\n"), c) }); buf = null; } };
    introLines(pick).forEach(l => {
      if (l.who === "@user") { flushA(); msgs().push({ id: newId(), role: "user", text: sub(l.t, c) }); return; }
      if (!buf) buf = [];
      buf.push(l.who ? l.t : l.t.split("\n").map(x => ">> " + x).join("\n"));
    });
    flushA();
    save();
  }
  $("#chName").textContent = c.name;
  updLenBtn();
  renderLog(); show("chat");
  setTimeout(() => { $("#log").scrollTop = $("#log").scrollHeight; }, 0);
}

function renderLog(errText) {
  const c = char(), L = $("#log"), fmt = fmtOf(c);
  L.className = "log fmt-" + fmt + (ai.pron ? " pron-on" : "") + (ai.trans !== false ? " trans-on" : "");
  applyNovelBg(c);
  L.innerHTML = "";
  const list = msgs();
  list.forEach((m, i) => {
    const d = document.createElement("div");
    d.className = "msg " + (m.role === "user" ? "user" : "char");
    let content, bare = false;
    const unov = m.role === "user" && fmt !== "bubble";
    if (unov) content = `<div class="unovb">${userNovelHTML(m.text)}</div>`;
    else if (m.role === "user") content = `<div class="body">${renderText(m.text, fmt)}</div>`;
    else if (m.ooc) { content = `<div class="ooc">${esc(m.text)}</div>`; bare = true; }
    else if (m.inner) { content = `<div class="body inner">${esc(m.text)}</div>`; }
    else {
      const cards = renderCards(m.text, HANDS[c.hand] || HANDS["단정"]);
      if (cards) { content = cards; bare = true; }
      else { content = renderBlocks(m.text, fmt); bare = fmt !== "bubble"; }
    }
    const inner = `${bare ? "" : `<div class="who"></div>`}${content}<div class="tools"></div>`;
    if (unov) { d.className = "msg user unov"; d.innerHTML = content; }
    else if (m.role === "user") d.innerHTML = ai.uav === false
      ? `<div class="mrow urow"><div class="mcol">${inner}</div></div>`
      : `<div class="mrow urow"><div class="mcol">${inner}</div>${avHTML({ avatar: c.uavatar, name: c.uname || "나" }, "mav")}</div>`;
    else d.innerHTML = bare ? inner : `<div class="mrow">${avHTML(c, "mav")}<div class="mcol">${inner}</div></div>`;
    if (m.role !== "user" && !bare) d.querySelector(".who").textContent = c.name;
    const whoEl = d.querySelector(".who");
    if (whoEl && m.role === "user") { if (ai.uav === false) whoEl.remove(); else whoEl.textContent = c.uname || "나"; }
    const acts = [];
    if (i === list.length - 1 && m.role === "assistant" && i > 0) acts.push(["다시 생성", regen]);
    acts.push(["복사", () => { try { navigator.clipboard.writeText(m.text); } catch (e) {} }]);
    acts.push(["수정", () => editMsg(d, m)]);
    acts.push(["삭제", () => { if (busy) return; list.splice(i, 1); save(); renderLog(); }, "red"]);
    acts.push(["여기부터 지우기", () => { if (busy) return; if (!confirm("이 메시지부터 아래 대화를 모두 지울까요?")) return; list.splice(i); save(); renderLog(); }, "red"]);
    let timer = null;
    const toggle = () => toggleActs(d, acts);
    d.addEventListener("contextmenu", e => { e.preventDefault(); toggle(); });
    d.addEventListener("touchstart", e => { if (e.target.closest(".acts")) return; timer = setTimeout(() => { timer = null; toggle(); }, 450); }, { passive: true });
    ["touchend", "touchmove", "touchcancel"].forEach(ev => d.addEventListener(ev, () => { if (timer) { clearTimeout(timer); timer = null; } }, { passive: true }));
    L.appendChild(d);
  });
  if (errText) { const e = document.createElement("div"); e.className = "err"; e.textContent = errText; L.appendChild(e); }
}

function toggleActs(d, acts) {
  const had = d.querySelector(".acts");
  document.querySelectorAll(".msg .acts").forEach(x => x.remove());
  if (had) return;
  const row = document.createElement("div");
  row.className = "acts";
  acts.forEach(a => {
    const b = document.createElement("button");
    b.textContent = a[0];
    if (a[2]) b.className = a[2];
    b.onclick = e => { e.stopPropagation(); row.remove(); a[1](); };
    row.appendChild(b);
  });
  d.appendChild(row);
  if (navigator.vibrate) try { navigator.vibrate(10); } catch (e) {}
}
function showMsgMenu(acts) {
  const w = document.createElement("div");

  w.innerHTML = `<div class="sheet">${acts.map((a, i) => `<button data-i="${i}">${esc(a[0])}</button>`).join("")}<button data-i="close">닫기</button></div>`;
  w.onclick = e => {
    const b = e.target.closest("button");

  };
  document.body.appendChild(w);
}
function editMsg(node, m) {

function buildRules(c, cmd) {
  const u = c.uname || "유저";
  const lenMap = {
    short: "1~2문단 정도로 짧게. 장면에 따라 조금 더 길거나 짧아도 된다.",
    mid: "2~3문단 정도. 장면에 따라 조금 더 길거나 짧아도 된다.",

  const narrRule = c.narr === "some" || c.narr === "many" ? `
- 나레이션을 쓸 수 있다. 나레이션은 ${c.name}의 말이나 행동이 아니라, 장면 밖에서 상황을 서술하는 목소리다. 시간·장소가 바뀌거나, 전화·인기척·날씨 같은 새 상황이 생기거나, 분위기를 짚어줄 때 쓴다.

- 빈도: ${c.narr === "many" ? "응답마다 한 번 정도" : "서너 번에 한 번 정도, 필요할 때만"}.` : "";
  const LANGS = { ja: "일본어", en: "영어", zh: "중국어(간체)" };
  const wantP = !!ai.pron, wantT = ai.trans !== false;
  const glossRule = !wantP && !wantT

  return `너는 지금부터 캐릭터 롤플레이 채팅의 '${c.name}' 역할을 맡는다. 이후 대화에서 너는 오직 ${c.name}으로서 응답한다.

function buildTurns(c, extraUser, cmd) {
  let hist = msgs().map(m => ({ role: m.role, content: sub(m.text, c) }));
  if (extraUser) hist.push({ role: "user", content: extraUser });
  const rules = buildRules(c, cmd);
  const LIMIT = 55000;
  const size = () => rules.length + hist.reduce((a, t) => a + t.content.length, 0);
  while (hist.length > 2 && size() > LIMIT) hist.shift();
  const turns = [{ role: "user", content: rules }];
  hist.forEach(t => {
    const last = turns[turns.length - 1];
    if (last.role === t.role) last.content += "\n\n" + t.content;
    else turns.push({ role: t.role, content: t.content });
  });
  if (turns[turns.length - 1].role !== "user") turns.push({ role: "user", content: "(계속)" });
  return turns;
}

const errCopy = code => ({
  not_granted: "AI 사용을 허용해야 답장이 와요. 페이지를 새로고침한 뒤 허용을 눌러주세요.",
  rate_limited: "요청이 너무 많아요. 잠시 뒤에 다시 보내주세요.",
  prompt_too_large: "대화가 너무 길어요. 오래된 메시지 몇 개를 삭제해주세요.",
  refused: "이 장면은 응답이 거절됐어요. 메시지를 수정해서 다시 시도해보세요.",
  session_expired: "로그인이 만료됐어요. 새로고침해주세요."
}[code] || "응답을 받지 못했어요. 다시 생성을 눌러보세요.");

async function generate(extraUser) {
  if (busy) return;
  const c = char();
  const lastU = [...msgs()].reverse().find(m => m.role === "user");
  const cmd = lastU && lastU.cmd && CMDS[lastU.cmd] ? lastU.cmd : null;
  const useApi = ai.prov !== "builtin";
  if (!useApi && !sample) { renderLog("내장 Claude를 쓸 수 없어요. 홈의 AI 설정에서 API를 연결해주세요."); return; }
  busy = true; setBusy(true);
  renderLog();
  const d = document.createElement("div");
  d.className = "msg char";
  d.innerHTML = fmtOf(c) === "bubble" && !cmd
    ? `<div class="mrow">${avHTML(c, "mav")}<div class="mcol"><div class="who"></div><div class="body"><span class="thinking">${esc(iga(c.name))} 생각 중</span></div></div></div>`
    : `<div class="body"><span class="thinking">${esc(iga(c.name))} 생각 중</span></div>`;
  const wq = d.querySelector(".who");
  if (wq) wq.textContent = c.name;
  $("#log").appendChild(d); $("#log").scrollTop = $("#log").scrollHeight;
  const body = d.querySelector(".body");
  ctl = new AbortController();
  let finalText = "", errMsg = null;
  try {
    const paint = text => {
      finalText = text;
      const nearBottom = $("#log").scrollHeight - $("#log").scrollTop - $("#log").clientHeight < 80;
      body.innerHTML = renderText(text, fmtOf(c));
      if (nearBottom) $("#log").scrollTop = $("#log").scrollHeight;
    };
    if (useApi) {
      finalText = await callApi(ai, apiMessages(c, extraUser, cmd), paint, ctl.signal);
    } else {
      const r = await sample(buildTurns(c, extraUser, cmd), {
        cache: false, signal: ctl.signal, modelTier: c.tier || "default",
        onText: ({ text }) => paint(text)
      });
      finalText = r.text;
    }
  } catch (e) {
    if (useApi) { if (e.name !== "AbortError") errMsg = e.message || "응답을 받지 못했어요."; }
    else { finalText = e.text || ""; if (e.code !== "cancelled") errMsg = errCopy(e.code); }
  }
  finalText = finalText.trim();
  if (finalText && ai.merge !== false && fmtOf(c) === "bubble" && !cmd) finalText = mergeDialogue(finalText);
  if (finalText) {
    if (extraUser === CONT && msgs().length && msgs()[msgs().length - 1].role === "assistant") {
      msgs()[msgs().length - 1].text += "\n\n" + finalText;
    } else msgs().push({ id: newId(), role: "assistant", text: cmd === "/속마음" ? finalText.replace(/^['‘"“]+|['’"”]+$/g, "").replace(/\*/g, "") : finalText, inner: cmd === "/속마음" || undefined });
    save();
  }
  busy = false; ctl = null; setBusy(false);
  renderLog(errMsg);
  $("#log").scrollTop = $("#log").scrollHeight;
}

const CONT = "(방금 장면을 자연스럽게 이어서 계속 써줘. 유저의 행동은 쓰지 말 것.)";
function setBusy(on) {

  if (busy) { ctl?.abort(); return; }
  const v = $("#input").value.trim();

  const pc = parseCmd(v);

  if (pc) um.cmd = pc.key;
  msgs().push(um); save();
  $("#input").value = ""; autoGrow();
  generate();
}

  if (busy) return;

}

// 모바일 키보드: 보이는 영역과 읽던 위치를 함께 맞춤 (원본 방식)
(function installViewportLayout() {
  const vv = window.visualViewport, app = document.querySelector(".app"), view = $("#log");
  let frame = 0, restoreFrame = 0, settling = false, settleTimer = 0, checks = [], lastHeight = -1, lastTop = -1, lastKeyboard = null;
  let anchor = { bottom: true, top: 0 };
  const chatScreen = () => $("#chat").classList.contains("on");
  function remember() { anchor = { bottom: chatScreen() && view.scrollHeight - view.clientHeight - view.scrollTop < 48, top: view.scrollTop }; }
  function restore() { restoreFrame = 0; view.scrollTop = anchor.bottom && chatScreen() ? Math.max(0, view.scrollHeight - view.clientHeight) : anchor.top; }
  function sync() {
    frame = 0;
    if (vv && Math.abs(vv.scale - 1) > .02) return;
    const height = Math.round(vv ? vv.height : window.innerHeight), offset = Math.round(vv ? vv.offsetTop : 0);
    const focused = document.activeElement, editing = focused && /^(INPUT|TEXTAREA)$/.test(focused.tagName);
    const full = Math.max(window.innerHeight || 0, document.documentElement.clientHeight || 0);
    const keyboard = !!editing && full - height > 90;
    if (!keyboard && (window.scrollY || window.scrollX)) window.scrollTo(0, 0);
    const top = keyboard ? Math.max(0, offset) : 0;
    if (height === lastHeight && top === lastTop && keyboard === lastKeyboard) { if (settling) restore(); return; }
    settling = true;
    lastHeight = height; lastTop = top; lastKeyboard = keyboard;
    app.style.height = height + "px";
    app.style.top = top + "px";
    document.body.style.setProperty("--sab", keyboard ? "0" : "1");
    if (keyboard) document.body.setAttribute("data-kb", "1"); else document.body.removeAttribute("data-kb");
    restore();
    if (restoreFrame) cancelAnimationFrame(restoreFrame);
    restoreFrame = requestAnimationFrame(restore);
    clearTimeout(settleTimer);
    settleTimer = setTimeout(() => { restore(); settling = false; remember(); }, 180);
  }
  function schedule() { if (!frame) frame = requestAnimationFrame(sync); }
  function transition() {
    if (!settling) remember();
    settling = true;
    checks.forEach(clearTimeout); checks = [];
    schedule();
    [80, 220, 450, 700].forEach(ms => checks.push(setTimeout(schedule, ms)));
    clearTimeout(settleTimer);
    settleTimer = setTimeout(() => { restore(); settling = false; remember(); }, 850);
  }
  view.addEventListener("scroll", () => { if (!settling) remember(); }, { passive: true });
  const userScroll = () => { settling = false; clearTimeout(settleTimer); checks.forEach(clearTimeout); checks = []; remember(); };
  view.addEventListener("touchstart", userScroll, { passive: true });
  view.addEventListener("wheel", userScroll, { passive: true });
  if (vv) { vv.addEventListener("resize", schedule, { passive: true }); vv.addEventListener("scroll", schedule, { passive: true }); vv.addEventListener("scrollend", schedule, { passive: true }); }
  window.addEventListener("resize", schedule, { passive: true });
  window.addEventListener("pageshow", transition);
  window.addEventListener("orientationchange", transition);
  document.addEventListener("focusin", transition);
  document.addEventListener("focusout", transition);
  schedule();
})();

const autoGrow = () => { const t = $("#input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 160) + "px"; };

const CHANGELOG = JSON.parse(document.getElementById("changelog").textContent);
const APP_VERSION = CHANGELOG[0].v;
let latest = null;
$("#vNow").textContent = APP_VERSION;
const vnum = v => v.split(".").map(Number);
const newer = (a, b) => { const x = vnum(a), y = vnum(b); for (let i = 0; i < Math.max(x.length, y.length); i++) { if ((x[i]||0) !== (y[i]||0)) return (x[i]||0) > (y[i]||0); } return false; };

function renderChangelog() {
  const list = latest && newer(latest[0].v, APP_VERSION) ? latest : CHANGELOG;
  $("#clList").innerHTML = list.map(e => {
    const tag = e.v === APP_VERSION ? '<span class="tag">지금 버전</span>' : (newer(e.v, APP_VERSION) ? '<span class="tag">새 버전</span>' : "");
    return `<div class="cl"><h3>v${esc(e.v)} ${tag}</h3><ul>${e.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>`;
  }).join("");
}
async function checkUpdate() {
  const st = $("#vStatus");
  st.className = "st"; st.textContent = "확인 중...";
  try {
    const res = await fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw 0;
    const html = await res.text();
    const m = html.match(/<script type="application\/json" id="changelog">([\s\S]*?)<\/script>/);
    if (!m) throw 0;
    latest = JSON.parse(m[1]);
    const lv = latest[0].v;
    if (newer(lv, APP_VERSION)) {
      st.className = "st new"; st.textContent = `새 버전 v${lv}이 있어요! 새로고침을 눌러주세요.`;

    } else {
      st.textContent = "최신 버전이에요.";

    }
  } catch (e) {
    st.textContent = "새 버전을 확인하지 못했어요. 새로고침하면 최신 버전을 불러와요.";
  }
  renderChangelog();
}
$("#sUpd").onclick = () => { renderChangelog(); show("updates"); checkUpdate(); };
