        '- 말줄임표는 이 글 전체에서 많아야 한 번이다. 문장 첫머리에는 붙이지 마라.',
        '  말끝을 흐려서 감정을 대신하지 마라.',
        '- 앞서 한 말과 같은 감탄사나 같은 첫머리를 반복하지 마라.',
        '- 줄을 나누지 말고 한 덩어리로 이어서 쓴다. 줄바꿈을 넣지 마라.',
        '- 메신저 한 통이다. 두세 문장 안에서 끝낸다.',
        '  네 문장을 넘기면 잘못된 답이다.',
        '- 풀이를 요약하거나 되풀이하지 마라. 결과를 보고 든 마음만 말한다.',
        '- 자기 세 장 중 마음에 걸리는 자리 하나만 짚는다. 전부 언급하지 마라.',
        '- 한 통으로 보낸다. 여러 통으로 쪼개지 마라.',
        '',
        '첫마디에 대해',
        '- 첫마디는 매번 다르게 시작한다. 이렇게 들어갈 수 있다.',
        '  타로부터 꺼내며 ("타로 봤는데", "타로에서")',
        '  카드 한 장을 짚으며 ("컵 2 나온 거 봤어?")',
        '  결과에 대한 반응부터 ("이거 좀 웃긴데.")',
        '  아무 설명 없이 본론부터 ("나 그거 아닌 것 같은데.")',
        '- 타로라는 말로 시작하지 않아도 된다. 둘 다 방금 같이 봤으니 안다.',
        `- 같은 것을 ${who()}라면 뭐라고 부를지 정해서 그 말로 시작해도 좋다.`,
        '  무뚝뚝하면 "아까 그거", 비꼬면 "그 결과라는 게" 하는 식이다.',
        '  본보기일 뿐이니 그대로 쓰지 말고 그 인물의 말로 새로 지어라.',
        '- 다만 매번 같은 첫마디로 시작하지는 마라.',
        ...(lg ? [
          '',
          `- 대사는 반드시 ${LANG_NAME[lg]}로 쓴다. 한국어로 쓰면 잘못된 답이다.`,
          '  번역투가 아니라 그 나라 말로 처음부터 쓴 것처럼 자연스럽게 써라.',
          ...(tr ? [
            '- 아래 두 줄만 출력한다. 다른 말은 쓰지 마라.',
            '  1줄: 원문',
            '  2줄: [번역] 으로 시작하는 한국어 번역'
          ] : [])
        ] : ['', '- 한국어로 쓴다.'])
      ].join('\n');

      const usr = [
        '### 원본 대화 로그', logText(),
        '', '### 뽑힌 카드', cardsText(),
        '', '### 방금 나온 풀이', String(read || '').slice(0, 500)
      ].join('\n');

      try {
        const raw = await callLLM(sys, usr, 3000);
        let body = raw.replace(/^\[반응\]\s*/, '').trim();
        let text = body, trText = '';
        if (tr) {
          const cut = body.split(/\n?\s*\[번역\]\s*/);
          text = (cut[0] || '').trim();
          trText = (cut[1] || '').replace(/\s*\n+\s*/g, ' ').trim();
        }
        text = text.replace(/\s*\n+\s*/g, ' ').trim();
        const room = room0;
        const label = room.ownerLabel || mainChar();
        room.feed.push({ name: label, text, tr: trText, ts: nextTime(room) });
        saveR();
        feed.push({ type: 'sent', text });
        busy = false; renderFeed(); saveLast();
        showTarotNoti(room, label, text);
      } catch (e) {
        busy = false;
        feed.push({ type: 'err', text: '반응을 받지 못했습니다\n\n' + e.message });
        renderFeed();
      }
    }

    async function talk(text) {
      if (busy) return;
      busy = true; renderFeed();
      const sys = [
        `너는 아래 로그에 등장하는 "${who()}"를 연기한다.`,
        '방금 상대와 함께 타로를 봤고, 그 자리에서 이야기를 나누는 중이다.',
        '',
        `이번에 본 질문: "${question}"`,
        '',
        '호칭 규칙',
        ...callRule().map(x => x.startsWith('-') ? x : '- ' + x),
        '',
        '',
        '- 대사만 쓴다. 동작, 표정, 지문, 별표, 따옴표 모두 금지한다.',
        '- 로그에서 벌어지던 상황이나 소재는 가져오지 마라. 지금은 타로를 보는 자리다.',
        '',
        '무엇에 답할 것인가 — 이것이 가장 중요하다',
        '- 상대가 방금 한 말에 먼저 답한다. 그 답이 대사의 중심이다.',
        '- 카드 이름과 풀이 내용은 상대가 그것을 물었을 때만 꺼낸다.',
        '  묻지 않았는데 카드로 화제를 되돌리지 마라.',
        '  카드 이야기는 이미 했다. 같은 카드를 계속 되뇌지 마라.',
        '- 카드는 우연히 뽑힌 것이다. 카드 내용을 두고 상대를 탓하지 마라.',
        '',
        '- 말줄임표, 물음표나 느낌표를 겹쳐 쓰는 것, 감탄사는',
        '  로그에 나온 만큼만 쓴다. 로그에 없으면 새로 만들지 마라.',
        '- 말줄임표는 이 글 전체에서 많아야 한 번이다. 문장 첫머리에는 붙이지 마라.',
        '  말끝을 흐려서 감정을 대신하지 마라.',
        '- 앞서 한 말과 같은 감탄사나 같은 첫머리를 반복하지 마라.',
        '- 2~4문장으로 짧게. 주고받기 좋게 쓴다.',
        '- 줄을 나누지 말고 한 덩어리로 이어서 쓴다. 줄바꿈을 넣지 마라.',
        '', '- 한국어로 쓴다.'
      ].join('\n');

      // 말이 오갈수록 카드 목록을 짧게 넣는다. 자꾸 카드로 돌아가는 것을 막는다
      const turnsSoFar = feed.filter(f => f.type === 'say').length;
      const cardBlock = turnsSoFar <= 2
        ? cardsText()
        : [mine, chars].map(a => a.map(i => cardLabel(deck[i])).join(' / ')).join('\n');

      const usr = [
        '### 원본 대화 로그', logText(),
        '', '### 뽑힌 카드 (묻지 않으면 먼저 꺼내지 마라)', cardBlock,
        '', '### 지금까지 이 자리에서 오간 말',
        feed.filter(f => f.type !== 'err').map(f =>
          (f.type === 'read' ? '[풀이] ' : (f.me ? '질문자: ' : who() + ': ')) + f.text).join('\n'),
        '', '### 방금 질문자가 한 말', text
      ].join('\n');

      try {
        const said = (await callLLM(sys, usr)).trim().replace(/\s*\n+\s*/g, ' ');
        feed.push({ type: 'say', text: said });
      } catch (e) {
        feed.push({ type: 'err', text: e.message });
      } finally {
        busy = false; renderFeed(); saveLast();
      }
    }

    /* ── 이벤트 ────────────────────────────────────────────────────────── */
    root.addEventListener('input', ev => {
      if (ev.target.id === 't-q') $('#t-qn').textContent = String(ev.target.value.trim().length);
    });
    root.addEventListener('click', ev => {
      // 추천 질문이 먼저다. 카드 고르기와 겹치지 않게 따로 받는다
      const tip = ev.target.closest('[data-qi]');
      if (tip) {
        const q = Q_TIPS[Number(tip.dataset.qi) || 0];
        if (!q) return;
        $('#t-q').value = q[1];
        root.querySelectorAll('#t-chips button').forEach(b => b.classList.remove('on'));
        tip.classList.add('on');
        $('#t-qn').textContent = String(q[1].length);
        return;
      }
      const cd = ev.target.closest('[data-i]');
      if (cd) return pickCard(Number(cd.dataset.i));

      const a = ev.target.closest('[data-a]')?.dataset.a;
      if (!a) return;

      if (a === 'quit') { api.destroy(); return backToPhone(); }
      if (a === 'reset') {
        question = ''; deck = []; mine = []; chars = []; feed = [];
        $('#t-q').value = '';
        clearLast(); stopShuffle();
        return go('ask');
      }
      if (a === 'toAsk') { stopShuffle(); return go('ask'); }
      if (a === 'toSet') { stopShuffle(); return go('set'); }
      if (a === 'scan') return scanProfiles();
      if (a === 'toShuffle') {
        const v = $('#t-q').value.trim();
        if (!v) return toast('질문을 적어 주세요');
        question = v;
        deck = shuffled().slice(0, 24);
        mine = []; chars = [];
        return go('pick');
      }
      if (a === 'reshuffle') return reshuffle();
      if (a === 'clearPick') {
        if (busy) return;
        mine = []; chars = [];
        return renderDeck();
      }
      if (a === 'charPick') { return charPicks(); }
      if (a === 'toRead') {
        if (mine.length !== NEED) return toast(`카드를 ${NEED}장 골라 주세요`);
        // 상대가 아직 안 골랐으면 여기서 채운다
        if (chars.length < NEED) {
          const pool = deck.map((_, i) => i).filter(i => !mine.includes(i) && !chars.includes(i))
            .sort(() => Math.random() - 0.5);
          while (chars.length < NEED && pool.length) chars.push(pool.pop());
        }
        feed = [];
        return go('read');
      }
      if (a === 'react') return sendReaction();
      if (a === 'knoti') return openTarotNoti();
    });

    function scanProfiles() {
      const found = [];
      const looksKey = v => typeof v === 'string' && v.length > 15 && /^[\w.\-]+$/.test(v);
      const looksUrl = v => typeof v === 'string' && /^https?:\/\//.test(v);
      const walk = (o, from, depth) => {
        if (!o || typeof o !== 'object' || depth > 4) return;
        if (Array.isArray(o)) return o.forEach(x => walk(x, from, depth + 1));
        let url = '', key = '', model = '';
        for (const [k, v] of Object.entries(o)) {
          const lk = k.toLowerCase();
          if (!url && looksUrl(v) && /url|base|endpoint|host/.test(lk)) url = v;
          if (!key && looksKey(v) && /key|token|secret|auth/.test(lk)) key = v;
          if (!model && typeof v === 'string' && v && /model/.test(lk)) model = v;
        }
        if (key || (url && model)) found.push({ from, url, key, model, name: o.name || o.label || o.title || '' });
        Object.values(o).forEach(v => walk(v, from, depth + 1));
      };
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        try { walk(JSON.parse(localStorage.getItem(k)), k, 0); } catch (e) {}
      }
      const out = $('#s-msg');
      if (!found.length) { out.textContent = '저장된 설정을 찾지 못했습니다.'; return; }
      out.innerHTML = found.slice(0, 8).map((f, i) =>
        `<button data-pick="${i}">${esc((f.name || f.from) + ' · ' +
          (f.model || '모델 미상') + (f.url ? ' · ' + f.url.slice(0, 34) : ''))}</button>`).join('');
      out.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
        const f = found[Number(b.dataset.pick)];
        if (f.url) { S.provider = 'custom'; S.apiUrl = f.url; }
        if (f.key) S.apiKey = f.key;
        if (f.model) S.model = f.model;
        saveS(); renderSet();
        $('#s-msg').textContent = '가져왔습니다.';
      });
    }

    const bindS = (sel, key, num) => {
      const el = $(sel);
      const apply = () => {
        S[key] = num ? Number(el.value) : el.value;
        if (key === 'turns') $('#s-tn').textContent = S.turns + '턴';
        saveS();
      };
      el.addEventListener('input', apply);
      el.addEventListener('change', () => {
        apply();
        if (key === 'provider') { S.model = ''; saveS(); renderSet(); }
      });
    };
    bindS('#s-prov', 'provider');
    bindS('#s-url', 'apiUrl');
    bindS('#s-key', 'apiKey');
    bindS('#s-model', 'model');
    bindS('#s-max', 'maxTokens', true);
    bindS('#s-turns', 'turns', true);
    bindS('#s-persona', 'persona');

    /* ── 키보드 ────────────────────────────────────────────────────────── */
    function trackKeyboard() {
      const vv = window.visualViewport;
      if (!vv) return;
      let raf = 0;
      const apply = () => {
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(() => {
          root.style.height = vv.height + 'px';
          root.style.top = vv.offsetTop + 'px';
          root.style.setProperty('--sab', window.innerHeight - vv.height > 80 ? '0' : '1');
          const b = $('#t-body');
          if (step === 'read' && b) b.scrollTop = b.scrollHeight;
        });
      };
      vv.addEventListener('resize', apply);
      vv.addEventListener('scroll', apply);
      apply();
    }

    /* ── 시작 ──────────────────────────────────────────────────────────── */
    let lock = '';
    const api = {
      open() {
        root.style.display = 'flex';
        back.style.display = 'block';
        lock = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        // 핸드폰이 이미 페이지를 잠가 두었으므로 여기서는 더 건드리지 않는다
        loadChatDOM();
        trackKeyboard();
        setTimeout(() => { $('#t-sub').textContent = who(); }, 400);
        const last = loadLast();
        if (last && clean(S.apiKey)) {
          question = last.question; deck = last.deck;
          mine = last.mine; chars = last.chars; feed = last.feed;
          return go('read');
        }
        go(clean(S.apiKey) ? 'ask' : 'set');
      },
      close() {
        root.style.display = 'none'; back.style.display = 'none';
        document.body.style.overflow = lock;
      },
      destroy() {
        stopShuffle();
        document.body.style.overflow = lock;
        root.remove(); back.remove(); style.remove();
        try { delete window[NS]; } catch (e) { window[NS] = undefined; }
      }
    };
    window[NS] = api;
    api.open();
    return api;
  }

  /* ── 시작 ──────────────────────────────────────────────────────────── */
  let lock = null;
  function unlock() {
    if (!lock) return;
    document.body.style.overflow = lock.bo;
    lock = null;
  }
  const api = {
    open() {
      root.style.display = 'flex';
      back.style.display = 'block';
      lock = { bo: document.body.style.overflow };
      document.body.style.overflow = 'hidden';
      loadChatDOM();
      trackKeyboard();
      go('home');
    },
    close() {
      root.style.display = 'none'; back.style.display = 'none';
      unlock();
    },
    destroy() {
      learnStop && learnStop();
      unlock();
      root.remove(); back.remove(); style.remove();
      try { delete window[NS]; } catch (e) { window[NS] = undefined; }
    },
    debug: extract
  };
  window[NS] = api;
  api.open();
})();

</script>
<script>
(() => {
const $ = s => document.querySelector(s);
const KEY = "bamp_v1";
let store = { chars: [], chats: {}, theme: null };
try { const raw = localStorage.getItem(KEY); if (raw) store = Object.assign(store, JSON.parse(raw)); } catch(e) {}
let cur = null, busy = false, ctl = null;

// ---- 브라우저 DB (IndexedDB) — 깃허브 버전용 큰 저장소 ----
const IDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open("bampyeonji", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const run = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction("kv", mode), rq = fn(t.objectStore("kv"));
      t.oncomplete = () => res(rq && rq.result);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  };
  return {
    get: k => run("readonly", st => st.get(k)),
    set: (k, v) => run("readwrite", st => st.put(v, k)),
    del: k => run("readwrite", st => st.delete(k)),
    prefix: async pre => {
      const db = await open();
      return new Promise((res, rej) => {
        const out = {}, t = db.transaction("kv", "readonly"), rq = t.objectStore("kv").openCursor();
        rq.onsuccess = () => { const c = rq.result; if (c) { if (String(c.key).indexOf(pre) === 0) out[c.key] = c.value; c.continue(); } };
        t.oncomplete = () => res(out); t.onerror = () => rej(t.error);
      });
    }
  };
})();
const useIDB = !window.claude && !!window.indexedDB;
let idbOn = false, idbTimer = null;
function idbSaveSoon() {
  clearTimeout(idbTimer);
  idbTimer = setTimeout(() => { IDB.set("store", JSON.parse(JSON.stringify(store))).catch(() => {}); }, 400);
}
async function initIDB() {
  try {
    const saved = await IDB.get("store");
    const localHas = store.chars && store.chars.length;
    if (saved && saved.chars && (saved.chars.length || !localHas)) store = Object.assign({ chars: [], chats: {}, theme: null }, saved);
    else await IDB.set("store", JSON.parse(JSON.stringify(store)));
    idbOn = true;
    try { localStorage.removeItem(KEY); } catch (e) {}
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
    if ($("#home").classList.contains("on")) renderHome();
  } catch (e) { idbOn = false; }
}

// ---- 계정 저장소 (업데이트해도 유지) ----
let db = null, uid = null, dbReady = false;
const pages = {};
const dirtyChats = new Set();
const dirtyAvatars = new Set();
let metaDirty = false, flushTimer = null;
const col = () => db.collection("data/users/" + uid);
const PAGE = 180000;

function save(chatId) {
  if (idbOn) idbSaveSoon();
  else { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e) {} }
  metaDirty = true;
  if (chatId === undefined) chatId = cur;
  if (chatId) dirtyChats.add(chatId);
  if (!dbReady) return;
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, 700);
}

function splitPages(list) {
  const out = []; let curp = [], size = 0;
  list.forEach(m => {
    const s = JSON.stringify(m).length;
    if (curp.length && size + s > PAGE) { out.push(curp); curp = []; size = 0; }
    curp.push(m); size += s;
  });
  if (curp.length || !out.length) out.push(curp);
  return out;
}

async function flush() {
  if (!dbReady) return;
  const chats = [...dirtyChats]; dirtyChats.clear();
  const doMeta = metaDirty; metaDirty = false;
  try {
    for (const id of chats) {
      const exists = store.chars.some(c => c.id === id);
      const parts = exists ? splitPages(store.chats[id] || []) : [];
      for (let i = 0; i < parts.length; i++) await col().doc(`chat_${id}_${i}`).set({ msgs: parts[i] });
      const old = pages[id] || 0;
      for (let i = parts.length; i < old; i++) await col().doc(`chat_${id}_${i}`).delete();
      if (exists) pages[id] = parts.length; else delete pages[id];
    }
    for (const id of [...dirtyAvatars]) {
      const c = store.chars.find(x => x.id === id);
      if (c && c.avatar) await col().doc(`avatar_${id}`).set({ img: c.avatar });
      else await col().doc(`avatar_${id}`).delete().catch(() => {});
      if (c && c.nbg) await col().doc(`nbg_${id}`).set({ img: c.nbg });
      else await col().doc(`nbg_${id}`).delete().catch(() => {});
      dirtyAvatars.delete(id);
    }
    if (doMeta || chats.length) await col().doc("meta").set({ chars: store.chars.map(c => { const o = Object.assign({}, c); delete o.avatar; delete o.nbg; return o; }), theme: store.theme || null, pages });
    setSync("");
  } catch (e) {
    chats.forEach(id => dirtyChats.add(id)); metaDirty = true;
    setSync("계정 저장에 실패했어요. 이 기기에는 저장돼 있어요.");
  }
}
function setSync(t) { const b = $("#syncBanner"); b.textContent = t; b.hidden = !t; }

async function initDb() {
  try {
    const [d, u] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!d || !u) return;
    const id = await u.id();
    if (!id) return;
    db = d; uid = id;
    const meta = await col().doc("meta").get();

async function callApi(cfg, messages, onText, signal, maxOverride) {
  if (!cfg.key && cfg.prov === "openai") throw new Error("API 키를 입력해주세요.");
  if (cfg.prov === "custom" && !cfg.url) throw new Error("API 주소를 입력해주세요.");
  if (!cfg.model) throw new Error("모델 이름을 입력해주세요.");

      method: "POST", signal,

      body: JSON.stringify(body)

    if (e.name === "AbortError") throw e;
    throw new Error(inClaude ? "claude.ai 안에서는 외부 API에 연결할 수 없어요. 파일을 따로 올려서 열어주세요." : "서버에 연결하지 못했어요. 주소와 인터넷 연결을 확인해주세요.");
  }
  if (!res.ok) {

    const m = { 401: "API 키가 올바르지 않아요.", 403: "이 키로는 접근 권한이 없어요.", 404: "모델 이름이나 주소를 찾을 수 없어요.", 429: "요청이 너무 많거나 크레딧이 부족해요." }[res.status];

    const inner = m[1].trim(); if (inner) segs.push({ nar: true, t: inner });
    last = re.lastIndex;
  }
  const tail = line.slice(last).trim(); if (tail) segs.push({ nar: false, t: tail });

function userNovelHTML(raw) {

  let out = "";
  src.split(/\n+/).forEach(line => {
    line = line.trim(); if (!line) return;
    let segs = [];
    if (starMode) segs = starSegs(line);

      const re = /("[^"\n]*"|“[^”\n]*”|「[^」\n]*」|『[^』\n]*』)/g; let last = 0, m;
      while ((m = re.exec(line))) {

        segs.push({ nar: false, t: m[1] }); last = re.lastIndex;
      }
      const tail = line.slice(last).trim(); if (tail) segs.push({ nar: true, t: tail });
    }
    let inner = "";
    const flush = () => { if (inner) out += `<p class="np">${inner}</p>`; inner = ""; };
    segs.forEach(sg => {
      const tx = esc(sg.nar ? sg.t : quoteSay(sg.t));

  "/ooc": "유저가 롤플레이 밖에서(OOC) 요청을 남겼다. 알겠다는 대답이나 설명 없이, 요청을 그대로 반영해 곧바로 이번 턴의 답변을 쓴다. 요청에 분량·형식·시점이 정해져 있으면 이번 턴에 그대로 따른다. 특정 장면과 분량 지시는 이번 턴에만 적용하고, 다음 턴부터는 이 장면에서 자연스럽게 이어가며 원래 분량 설정을 따른다. 말투·문체·설정처럼 계속 지켜야 하는 지시는 이후에도 유지한다. 요청이 작가에게 묻는 질문일 때만 롤플레이를 멈추고 짧게 답한다.",
  "/전환": "장면을 전환한다. 첫 줄에 >> 로 시작하는 나레이션 한두 줄로 시간과 장소가 어떻게 바뀌었는지 서술하고, 그 아래에 인물의 장면을 이어 쓴다.",
  "/편지": "이번 턴에는 완성된 편지 한 통만 출력한다. [편지]로 시작하고 [/편지]로 끝낸다. 태그 바깥에는 설명, 분석, 작성 계획을 붙이지 않는다.\n받는 사람, 본문, 맺음말과 보내는 사람 이름까지 편지 전체를 이번에 지정된 언어로 쓴다. 이름은 설정이나 기존 대화의 해당 언어 표기를 우선한다. 없으면 일관된 음역을 쓰며 다른 사람의 이름으로 바꾸지 않는다. 호칭 뒤에 한국어 조사를 기계적으로 붙이지 않는다.\n받는 사람을 부를 때는 이 인물이 평소에 상대를 부르는 호칭을 그대로 쓴다. 아래 관계·예의 및 언어별 호칭·맺음말 지침은 [수신]과 [서명] 칸에만 적용한다. 이 지침을 근거로 [본문]의 기존 캐릭터 말투나 존댓말 여부를 바꾸지 않는다.\n한국어: 예의를 갖추는 학생이 선생님에게 보내는 편지라면 '선생님께'와 '이름 올림' 또는 '이름 드림'이 자연스럽다. 가까운 친구에게는 평소 호칭과 자연스러운 서명을 쓴다. 모든 편지를 '에게'와 '이름이/가'로 고정하지 않는다.\n일본어: 그 관계에서 자연스러운 호칭과 맺음말을 쓴다. 예를 들어 〇〇先生へ, 이름より 등이 가능하지만 모든 관계에 같은 예시를 적용하지 않는다. 이름과 호칭에 한국어 '에게/께/올림/가'를 남기지 않는다.\n영어: 실제로 사용하는 호칭으로 Dear ... 등 자연스러운 인사를 정한다. 관계와 성격에 맞춰 Sincerely, 이름 또는 이름만 쓰는 등 적절한 서명을 고른다. 설정에 없는 성이나 직함을 만들어내지 않는다.\n서명 칸에는 보내는 사람의 이름과 관례적인 짧은 맺음말만 쓴다. 관계와 예의는 올림·드림·가, より, From·Sincerely 같은 맺음말을 고르는 데만 반영한다. 이름은 기존 설정과 해당 언어 표기를 유지한다. 이름 앞뒤에 인물 소개, 관계 설명, 소유·연애 호칭, 고백, 약속, 미래 관계의 예고, 문장형 수식어를 붙이지 않는다. 친밀한 관계여도 이 규칙은 같다. 예: 이치조 미나토 올림 / 미나토가 / 湊より / From, Minato. 부적절한 예: 당신의 학생이자 이제는 당신의 남자가 될 이치조 미나토 올림. 이 경우 서명은 이치조 미나토 올림으로만 쓴다. 과거 편지의 긴 서명을 따라 쓰지 않는다. 이 규칙은 [서명] 칸에만 적용하며 편지 본문의 말투·내용·분량을 바꾸거나 서명에서 뺀 수식어를 본문으로 옮기지 않는다.\n내용은 다음 세 칸으로 구분한다. [수신]받는 사람 호칭[/수신] 다음 빈 줄, [본문]편지 본문[/본문] 다음 빈 줄, [서명]맺음말과 보내는 사람[/서명]. 이 칸들은 모두 [편지]와 [/편지] 안에 둔다. 바깥의 [편지]와 [/편지]는 반드시 각각 독립된 줄에 쓴다. 구분자 라벨만 한국어로 유지하고 실제 내용은 지정 언어로 쓴다. 본문은 처음부터 끝까지 한 덩어리로 이어 쓰며 문단 구분·빈 줄·문장별 줄바꿈을 넣지 않는다. 받는 사람과 서명은 본문 밖의 별도 칸으로 유지한다. 받는 사람 호칭에 실제 관계에 없는 연애·배우자 호칭을 만들어 붙이지 않는다. 제목, 지문, 별도 대사, 번역 해설은 추가하지 않는다.",
  "/일기": "이번 턴에는 [일기]와 [/일기] 사이에 인물의 일기만 쓴다. 첫 줄은 날짜: 로 시작하고 값은 선택한 언어의 자연스러운 날짜 표기다. 날짜는 현재 장면의 시점에 맞춘다. 날짜 다음 줄에 1인칭 본문을 처음부터 끝까지 한 덩어리로 쓴다. 본문에 문단 구분이나 빈 줄, 문장별 줄바꿈을 넣지 않는다. 그날의 구체적인 일과 생각을 인물의 평소 말투로 쓴다. 번역, 설명, 일기 제목, 지문용 별표는 덧붙이지 않는다.",
  "/속마음": "이번 턴에는 인물의 지금 속마음만 보여준다. 첫 줄에는 [속마음]만, 마지막 줄에는 [/속마음]만 쓴다. 두 표식 사이의 본문만 한 덩어리로 이어 쓴다. 그 안은 이 인물의 성격과 말버릇 그대로 쓴다. 길이도 인물에 맞게 정한다. 처음부터 끝까지 한 덩어리로 이어 쓰고, 문단을 나누거나 빈 줄을 넣지 않는다. 지문이나 대사 등 다른 내용은 한 줄도 쓰지 않는다. 문장부호는 자연스럽게 쓴다. 의문에는 물음표를, 완결된 생각에는 마침표를 쓰고 의도적인 말줄임표와 끊김은 유지한다. 부호 없는 단어 나열로 쓰지 않는다.",
  "/플리": "이번 턴에는 노래 세 곡만 고른다. 첫 줄에 [플리] 를 쓰고, 아래 순서대로 한 줄에 하나씩 '제목 - 가수 :: 이유' 형식으로 쓴 뒤 [/플리] 로 닫는다. 첫 곡은 지금 상황에 어울려서 듣고 있는 곡, 둘째 곡은 상대를 생각하며 들었던 곡, 셋째 곡은 평소에 자주 듣던 곡이다. 이유는 한 문장으로 쓴다. 지문이나 대사 등 다른 내용은 한 줄도 쓰지 않는다.\n곡을 고르는 기준은 이렇다. 이 인물이 평소에 좋아할 만한 장르와 분위기로 고른다. 지금 장면이 슬프다고 슬픈 곡을 고르는 것이 아니라, 이 사람이라면 이런 걸 듣겠다 싶은 쪽으로 고른다. 성격, 자란 환경, 나이, 하는 일이 취향을 정한다.\n인물 설정에 음악 취향이 적혀 있으면 무엇보다 그것을 따른다.\n나이가 있거나 옛 시절 이야기를 자주 하는 인물이면 그 시절 곡이 섞여도 좋다. 세계관에 시대가 정해져 있으면 그 시대보다 나중에 나온 곡은 쓰지 않는다.\n세 곡을 전부 누구나 아는 대표곡으로 채우지 않는다. 한 곡 정도는 알려진 곡이어도 좋지만, 나머지는 덜 알려졌더라도 그 인물의 취향이 드러나는 곡으로 고른다.\n실제로 존재하는 곡만 쓴다. 제목이나 가수가 확실하지 않으면 지어내지 말고 확실히 아는 곡으로 바꾼다.",
  "/관계": "[관계]와 [/관계] 사이에 관계를 최대 네 묶음으로 쓴다. 각 묶음은 빈 줄로 구분한다. 사이: 인물 A ↔ 인물 B · 관계, A의 시선: 구체적 태도, B의 시선: 확인된 반응 또는 아직 모름, 최근 일: 구체적인 사건을 각각 한 줄씩 쓴다. 설정과 대화에서 확인된 사실을 우선한다. 단서가 없으면 없다고 짧게 쓴다. 빈칸을 채우려고 연애·배신·큰 사건을 만들지 않는다. 작은 새 설정을 보탤 때도 기존 서사를 뒤집지 않는다. 추측과 확인된 사실을 구분하고, 당사자가 알지 못하는 내용을 알고 행동하게 하지 않는다.",
  "/관계도": "[관계]와 [/관계] 사이에 관계를 최대 네 묶음으로 쓴다. 각 묶음은 빈 줄로 구분하고 아래 라벨을 한 줄씩 사용한다.\n사이: 인물 A ↔ 인물 B · 구체적인 관계\nA의 시선: A가 B를 어떻게 대하는지 실제 행동과 함께\nB의 시선: 확인된 반응, 미확인이라면 아직 모름\n최근 일: 둘 사이에서 실제로 있었던 구체적인 사건\n추상적인 특별한 관계, 복잡한 감정 같은 표현으로 대신하지 않는다. 설정과 대화에서 확인된 사실을 우선한다. 단서가 없으면 없다고 짧게 쓴다. 빈칸을 채우려고 연애·배신·큰 사건을 만들지 않는다. 작은 새 설정을 보탤 때도 기존 서사를 뒤집지 않는다. 추측과 확인된 사실을 구분하고, 당사자가 알지 못하는 내용을 알고 행동하게 하지 않는다.",
  "/소문": "[소문]과 [/소문] 사이에 세 가지를 빈 줄로 나누어 쓴다. 각 소문은 다음 라벨을 각각 한 줄씩 쓴다.\n도는 말: 사람들이 실제로 할 법한 구체적인 한마디\n출처: 어디서 시작되어 어떻게 퍼지는지\n사실: 사실 / 일부 사실 / 사실 아님 / 확인되지 않음 중 하나를 먼저 쓰고, 그 뒤에 실제 사정을 한 줄로 덧붙인다\n세 가지의 사실 여부를 서로 다르게 한다. 하나는 맞고, 하나는 일부만 맞고, 하나는 틀리거나 확인되지 않은 것으로 구성한다. 확인된 사실을 소문 모양으로 옮겨 적기만 하는 목록을 만들지 않는다.\n틀린 소문은 거짓말이 아니라 오해에서 나온다. 사람을 착각했거나, 시점이 어긋났거나, 이유를 잘못 짚었거나, 규모가 부풀려진 것이다. 실제로 있었던 일에 틀린 해석이 붙은 형태를 우선한다.\n인물의 비밀이 아무 근거 없이 공개된 소문이 되지 않게 한다. 빈칸을 채우려고 연애·배신·큰 사건을 만들지 않는다. 틀린 소문이라도 인물을 망가뜨리는 추문으로 만들지 않는다. 작은 새 설정을 보탤 때도 기존 서사를 뒤집지 않는다. 추측과 확인된 사실을 구분하고, 당사자가 알지 못하는 내용을 알고 행동하게 하지 않는다.",
  "/비밀": "이번 턴에는 인물이 겉으로 드러내지 않은 것만 [비밀]과 [/비밀] 사이에 쓴다. 최대 세 가지를 빈 줄로 나눈다. 각 비밀은 다음 라벨을 각각 한 줄씩 쓴다.\n숨긴 것: 추상적인 감정 이름이 아니라 구체적인 사실이나 행동\n숨기는 이유: 인물의 실제 동기\n숨기는 상대: 누구에게 숨기는지\n단서: 설정이나 대화에 이미 나타난 근거\n근거 없는 큰 사건, 숨은 연애, 배신, 앞으로 벌어질 일을 만들어내지 않는다. 드러난 것이 없으면 짧게 없다고 쓴다. 확인된 사실과 추측을 구분한다. 이 내용을 유저나 다른 인물이 알게 되었다고 취급하지 않는다. 지문이나 대사는 쓰지 않는다.",
  "/커뮤": "이번 턴에는 인터넷 커뮤니티 글 하나와 그 댓글만 보여준다. 첫 줄은 반드시 대괄호 안에 커뮤 라고만 적은 [커뮤] 이고, 마지막 줄은 [/커뮤] 다. 대괄호 안에 게시판 이름을 넣지 않는다. 게시판 이름은 사이트 칸에 적는다.\n아래처럼 쓴다.\n[커뮤]\n사이트: 606부대 익명 게시판\n말머리: 자유\n제목: 아까 연병장에서 그거 본 사람 있냐\n정보: 익명 · 12분 전 · 조회 3,842 · 댓글 6\n본문:\n수색팀 대위가 신병 갈구다가 갑자기 급소 맞고 무릎 꿇었음\n그 큰 사람이 소리도 못 내더라\n댓글:\n익명1 | 실화냐 ㅋㅋㅋ\n익명2 | 그 신병 오늘 밤 무사하냐\nㄴ 익명3 | @익명2 묵념해라\n[/커뮤]\n라벨 이름을 바꾸지 않고 한 줄에 한 항목씩만 쓴다. 본문과 댓글은 라벨 다음 줄부터 쓰고, 댓글은 한 줄에 하나씩 쓴다. 여러 댓글을 한 줄에 몰아쓰지 않는다. 댓글은 여섯 개 안팎을 반드시 넣는다.\n사이트는 이 세계관에 실제로 있을 법한 곳으로 정한다. 유저가 어디인지 말했으면 그곳으로 한다. 군대나 학교, 회사, 길드처럼 사람들이 모인 조직이 세계관에 있으면 그 이름을 붙인 내부 게시판으로 한다. 조직 이름은 대화와 설정에 이미 나온 것을 그대로 쓰고, 없으면 그 세계에 어울리게 짓는다.\n닉네임도 그곳에 맞춘다. 괄호나 꺾쇠로 태그 비슷한 것을 만들지 않는다.",
  "/인스타": "이번 턴에는 이야기 속 인물의 가상 인스타 계정만 [인스타]와 [/인스타] 사이에 JSON으로 쓴다. 형식: {\"handle\":\"계정 이름\",\"bio\":\"소개\",\"private\":false,\"posts\":[{\"photo\":\"게시된 사진의 구체적인 모습\",\"caption\":\"인물이 쓴 캡션\",\"date\":\"장면 속 게시 날짜\",\"likes\":12,\"comments\":[{\"who\":\"댓글 작성자\",\"text\":\"댓글\"}]}]}. 최근 게시물은 0~3개, 댓글은 게시물당 0~4개. 댓글은 한 사람에게 쏠리지 않게 여러 사람이 남긴다. 친구·지인·동료·팔로워 같은 주변 인물, 사용자, 계정 주인의 답글이 자연스럽게 섞인다. 사용자가 매번 댓글을 다는 것은 아니다. 인물의 성격·생활·현재 대화·시대에 맞춘다. 게시하지 않는 인물이면 posts는 빈 배열. 비공개 여부나 유명세를 억지로 만들지 않는다. 등장인물이 알지 못하는 비밀을 게시물로 공개하지 않는다. photo는 텍스트로 사진의 모습을 묘사하는 칸이며 이미지 URL이나 생성 지시를 넣지 않는다. 실제 Instagram 게시나 실제 사진 생성은 아니다. 캡션과 댓글은 각 인물이 쓸 법한 말투를 따른다.",
  "/쇼핑": "이번 턴에는 최근 주문 내역만 [주문]과 [/주문] 사이에 지정된 JSON으로 쓴다. 여기에는 이 인물이 자기 돈으로 직접 주문해서 물건을 받는 거래만 넣는다. 선물 받은 물건이나 다른 사람이 사준 물건은 넣지 않는다. 구독료, 정기결제, 공과금, 통신비, 교통비, 외식비, 병원비 같은 서비스 결제는 결제 내역의 몫이므로 여기에 넣지 않는다. 최근 구매가 위에 온다. 상품명·판매처·장면 속 날짜·배송상태를 기록한다. 온라인 거래가 없는 시대에는 그 시대의 거래 장부에 해당하는 기록을 쓴다. 항목은 정확히 6개다. 특정 상품 종류를 억지로 넣지 말고 일상 구매를 포함한다. \n\n목록은 캐릭터 설정과 현재까지의 대화, 생활환경, 예산, 취향, 실제 필요를 종합해 구성한다. '사용할 법함'과 '최근에 구매할 이유가 있음'을 구분한다. 직업·종족·성격 하나만으로 특정 구매를 단정하지 않는다. 같은 시점에 재조회하면 이미 나온 품목·날짜·금액을 유지하고, 시간이 흐르거나 새로운 필요가 생겼을 때 자연스럽게 갱신한다. 이미 보유한 물건은 소진·고장·선물 등의 이유 없이 다시 사지 않는다.\n성인 캐릭터의 사적인 구매(피임용품, 성인용품 등)가 있을 것 같으면 넣는다.",
  "/결제": "이번 턴에는 최근 결제 내역만 [결제]와 [/결제] 사이에 지정된 JSON으로 쓴다. 이것은 주문 목록이 아니라 카드·계좌에서 돈이 빠져나간 기록이다. 구독과 정기결제, 공과금, 통신·교통, 식비 같은 서비스 이용료를 중심으로 구성한다. 이 인물이 자기 돈으로 낸 것만 넣는다. 다른 사람이 대신 내주는 것, 공짜로 받는 것, 대화 속에서 상대가 부담하기로 한 것은 이 인물의 결제가 아니므로 넣지 않는다. 대화에 나온 활동이라는 이유만으로 그 비용을 이 인물의 결제로 만들지 않는다. 물건 값은 6개 중 최대 2개까지만 넣고, 나머지는 물건이 아닌 결제로 채운다. 다만 이 제한은 물건과 서비스의 비율을 맞추려는 것일 뿐, 어떤 종류의 물건을 넣을지 고르는 기준이 아니다. 주문 내역에 이미 나온 물건을 넣을 때만 그 품목의 날짜와 금액을 그대로 유지하고, 주문 목록 전체를 그대로 옮겨 적지 않는다. 상품명 또는 서비스명·금액·주기·장면 속 날짜·상태를 기록한다. 주기는 매월·매년·단건 중 알맞게 쓰며 일반 물건은 구독이라고 명시되지 않은 한 단건이다. 결제 수단은 그 시대에 맞춘다. \n\n목록은 캐릭터 설정과 현재까지의 대화, 생활환경, 예산, 취향, 실제 필요를 종합해 구성한다. '사용할 법함'과 '최근에 구매할 이유가 있음'을 구분한다. 직업·종족·성격 하나만으로 특정 구매를 단정하지 않는다. 같은 시점에 재조회하면 이미 나온 품목·날짜·금액을 유지하고, 시간이 흐르거나 새로운 필요가 생겼을 때 자연스럽게 갱신한다. 이미 보유한 물건은 소진·고장·선물 등의 이유 없이 다시 사지 않는다.\n성인 캐릭터의 사적인 구매(피임용품, 성인용품 등)가 있을 것 같으면 넣는다.",
  "/시청기록": "이번 턴에는 최근 시청 기록만 [시청]과 [/시청] 사이에 쓴다. 한 줄에 하나씩 '제목 | 채널 | 어디까지 봤는지 | 언제' 형식으로 쓰고 항목은 다섯 개다. 최근에 본 것이 위에 온다.\n제목과 채널은 이 인물이 볼 법한 것으로 자유롭게 짓는다. 실제로 존재하는 영상을 맞히려 하지 않는다. 채널명은 현실에 있는 곳을 써도 되고 그럴듯하게 지어내도 된다. 제목은 실제 유튜브 제목처럼 쓴다. 대문자 강조, 물음표 남발, ㅋㅋ나 ㄷㄷ 같은 표기도 그 채널 성격에 맞으면 쓴다.\n'어디까지 봤는지' 칸이 이 목록의 핵심이다. 끝까지 봤는지, 몇 분 보다 껐는지, 몇 번째 다시 보는지를 적는다.\n음악 영상으로 목록을 채우지 않는다. 노래는 따로 다룬다. 직업이나 성격 하나만으로 다섯 개를 같은 주제로 채우지 않는다. 찾아본 것과 아무 생각 없이 튼 것을 섞는다. 시간대가 드러나면 언제 칸에 적는다.\n같은 시점에 다시 조회하면 이미 나온 제목과 시점을 유지한다.\n현대 한국이 아니면 그 나라에서 실제로 쓰는 영상 플랫폼과 실존 채널로 맞춘다. 영상 플랫폼이 없는 세계관이면 그 시대에 이 인물이 구경하거나 즐겨 보던 것을 같은 형식으로 쓰고, 이때는 채널 칸에 실존 채널 대신 그 시대에 맞는 이름을 쓴다.",
  "/통화기록": "이번 턴에는 최근 통화 기록만 [통화]와 [/통화] 사이에 쓴다. 한 줄에 하나씩 '상대 | 통화 길이 | 발신 또는 수신 또는 부재중 | 날짜와 시각 | 비고' 형식으로 쓰고 항목은 여섯 개다. 최근이 위에 온다.\n상대는 설정과 대화에 이미 나온 사람을 우선하고, 없으면 이 인물의 생활에 있을 법한 사람이나 가게로 정한다. 이 인물이 저장해둔 이름 그대로 쓴다.\n부재중과 아주 짧은 통화를 반드시 섞는다. 누구의 전화를 받지 않았는지가 이 목록의 핵심이다. 비고에는 다시 걸었는지 정도만 짧게 쓰고 통화 내용을 지어내 옮기지 않는다.\n유저가 맡은 인물과의 통화는 대화에서 실제로 통화한 적이 있을 때만 넣는다.\n같은 시점에 다시 조회하면 이미 나온 기록을 유지한다.\n전화가 없는 세계관이면 최근에 주고받은 전갈이나 서신을 같은 형식으로 쓴다.",
  "/리뷰": "이번 턴에는 이 인물이 남긴 후기만 [리뷰]와 [/리뷰] 사이에 쓴다. 후기는 세 개이고 빈 줄로 나눈다. 각 후기는 다음 라벨을 각각 한 줄씩 쓴다.\n플랫폼: 후기를 남긴 곳. 쿠팡, 네이버 쇼핑, 배달의민족, 알라딘, 왓챠처럼 현실에 실제로 있는 이름을 쓴다. 한국이 아니면 그 나라에서 실제로 쓰는 곳으로 한다\n상품: 후기를 남긴 상품이나 작품의 이름\n옵션: 상품 아래에 붙는 짧은 선택 사항. '기초 1단계', '구이용 1kg', '블랙 / L', '2인분'처럼 쓴다. 붙일 것이 없으면 이 줄을 비워 둔다\n별점: 1에서 5 사이의 정수만 쓴다. 별표나 다른 기호를 쓰지 않는다\n날짜: 장면 속 날짜\n내용: 이 인물이 실제로 썼을 법한 후기 본문\n세 개의 플랫폼과 상품 종류를 서로 다르게 한다. 전부 음식이나 전부 책으로 채우지 않는다. 이 인물이 실제로 돈이나 시간을 쓴 것에서 고르고, 직업 하나만으로 단정하지 않는다.\n후기 본문은 대화할 때의 말투가 아니라 모르는 사람에게 쓰는 말투다. 이 차이가 이 카드의 핵심이다. 말을 짧게 하는 사람이면 한 줄로 끝낸다.\n별점을 전부 높게 주지 않는다. 별점이 낮으면 본문에도 그 이유가 드러나야 한다.\n후기 문화가 없는 세계관이면 그 시대에 남겼을 평이나 장부의 촌평을 같은 형식으로 쓰고, 플랫폼 칸에는 그 기록이 남은 곳을 쓴다.",
  "/메모": "이번 턴에는 인물이 유저에게 남긴 짧은 메모만 [메모]와 [/메모] 사이에 쓴다. 다음 세 줄을 먼저 쓰고 그 아래에 본문을 쓴다.\n쓴사람: 메모를 쓴 인물의 이름\n받는사람: 메모를 받을 사람의 이름\n남긴곳: 식탁 위, 현관문, 책상 서랍처럼 메모를 둔 자리\n본문은 짧게 쓴다. 두세 줄이면 충분하고 길어야 다섯 줄이다. 편지가 아니라 쪽지이므로 인사말과 맺음말을 갖추지 않는다. 이 인물이 급하게 적었을 법한 말투로 쓴다.\n메모를 남길 상황부터 만든다. 자리를 비우거나, 먼저 나가거나, 상대가 잠들었거나, 직접 말하기 어려운 것이 있을 때 쓴다. 지금 두 사람이 마주 보고 있는 상황이면 메모 대신 그냥 말한다.\n지문이나 대사는 쓰지 않는다. 메모에 적힌 글자만 쓴다.\n종이가 없는 세계관이면 그 시대에 짧은 말을 남기는 방식으로 바꾼다.",

  box.addEventListener("touchend", e => { if (e.touches.length < 2) pinch = null; });
  box.addEventListener("wheel", e => { e.preventDefault(); const r = box.getBoundingClientRect(); setZoom(z * (e.deltaY < 0 ? 1.08 : 0.93), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
  w.querySelector("[data-x]").onclick = () => w.remove();
  w.querySelector("[data-ok]").onclick = () => {
    const cv = document.createElement("canvas"); cv.width = OUT; cv.height = OUT;
    const k = OUT / V, sc = base * z * k;
    cv.getContext("2d").drawImage(img, x * k, y * k, img.width * sc, img.height * sc);

}

function parseLoreBulk(raw) {
  const blocks = String(raw || "").replace(/\r/g, "").split(/\n\s*\n/);
  const out = [];
  blocks.forEach(bl => {
    let t = "", k = "", body = [], mode = null;
    bl.split("\n").forEach(L => {
      let m;
      if ((m = L.match(/^\s*제목\s*[:：]\s*(.*)$/))) { t = m[1].trim(); mode = "t"; return; }
      if ((m = L.match(/^\s*키워드\s*[:：]\s*(.*)$/))) { k = m[1].trim(); mode = "k"; return; }
      if ((m = L.match(/^\s*내용\s*[:：]\s*(.*)$/))) { if (m[1].trim()) body.push(m[1]); mode = "c"; return; }
      if (!t && !k && (m = L.match(/^\s*([^|\n]{1,30})\|\s*(.*)$/))) { t = m[1].trim(); k = m[2].trim(); mode = "c"; return; }
      if (mode === "c" || mode === null) body.push(L);
      else if (mode === "k" && L.trim()) k += ", " + L.trim();
      else if (mode === "t" && L.trim()) body.push(L);
    });
    const text = body.join("\n").trim();
    if (!text && !k) return;
    out.push({ title: t, keys: k, text, always: false });
  });
  return out;
}
$("#lbgo").onclick = () => {
  const items = parseLoreBulk($("#lb").value);
  if (!items.length) return alert("읽을 수 있는 항목이 없어요. 형식을 확인해주세요.");
  const bk = editBooks = normBooks(editBooks);

    if (b.items.length >= LORE_MAX) { b = { name: "로어북" + (bk.length + 1), items: [] }; bk.push(b); }
    b.items.push(it);
  });
  curBook = bk.length - 1;
  alert(items.length + "개 넣었어요.");
  renderLore(); show("lore");
};
function pickLore(c) {
  const items = allLore(c.books);
  if (!items.length) return [];
  const log = msgs().slice(-4).map(m => m.text).join(" ");
  const out = [], rest = [];
  items.forEach(it => {
    if (!it.text) return;
    if (it.always) { out.push(it); return; }
    const kk = (it.keys || "").replace(/\{\{\s*user\s*\}\}/gi, c.uname || "").replace(/\{\{\s*char\s*\}\}/gi, c.name || "");
    const keys = kk.split(/[,，]/).map(x => x.trim()).filter(Boolean);
    for (let i = 0; i < keys.length; i++) if (log.indexOf(keys[i]) >= 0) { rest.push(it); return; }
  });
  return out.concat(rest).slice(0, 5);
}

function introLines(txt) {
  const out = []; let curL = null;
  String(txt || "").split("\n").forEach(L => {
    const m = L.match(/^\s*@\s*([^:：\n]*)\s*[:：]\s*([\s\S]*)$/);
    if (m) {
      if (curL) out.push(curL);
      const tag = m[1].trim();
      curL = { who: !tag ? "" : (/^(user|나|유저)$/i.test(tag) ? "@user" : tag), t: m[2] };
      return;
    }
    if (!curL) curL = { who: "@char", t: "" };
    curL.t += (curL.t ? "\n" : "") + L;
  });
  if (curL) out.push(curL);

function introText(lines, names) {

    if (l.who === "@user") return "@유저: " + t;

  }).filter(Boolean).join("\n")).filter(Boolean).join("\n\n---\n\n");
}

function openChat(id) {

    introLines(pick).forEach(l => {
      if (l.who === "@user") { flushA(); msgs().push({ id: newId(), role: "user", text: sub(l.t, c) }); return; }
      if (!buf) buf = [];
      buf.push(l.who ? l.t : l.t.split("\n").map(x => ">> " + x).join("\n"));
    });

    : wantT

  const tense = c.tense === "past"

  return `너는 지금부터 캐릭터 롤플레이 채팅의 '${c.name}' 역할을 맡는다. 이후 대화에서 너는 오직 ${c.name}으로서 응답한다.

${loreBlock}${memBlock}[유저 캐릭터: ${u}]
${sub(c.upersona, c) || "(설정 없음)"}

${tense}
${fmtRules}${langRule}${narrRule}

function buildTurns(c, extraUser, cmd) {
  let hist = msgs().map(m => ({ role: m.role, content: sub(m.text, c) }));
  if (extraUser) hist.push({ role: "user", content: extraUser });
  const rules = buildRules(c, cmd);
  const LIMIT = 55000;
  const size = () => rules.length + hist.reduce((a, t) => a + t.content.length, 0);
  while (hist.length > 2 && size() > LIMIT) hist.shift();
  const turns = [{ role: "user", content: rules }];
  hist.forEach(t => {
    const last = turns[turns.length - 1];
    if (last.role === t.role) last.content += "\n\n" + t.content;
    else turns.push({ role: t.role, content: t.content });
  });
  if (turns[turns.length - 1].role !== "user") turns.push({ role: "user", content: "(계속)" });
  return turns;
}

const errCopy = code => ({
  not_granted: "AI 사용을 허용해야 답장이 와요. 페이지를 새로고침한 뒤 허용을 눌러주세요.",
  rate_limited: "요청이 너무 많아요. 잠시 뒤에 다시 보내주세요.",
  prompt_too_large: "대화가 너무 길어요. 오래된 메시지 몇 개를 삭제해주세요.",
  refused: "이 장면은 응답이 거절됐어요. 메시지를 수정해서 다시 시도해보세요.",
  session_expired: "로그인이 만료됐어요. 새로고침해주세요."
}[code] || "응답을 받지 못했어요. 다시 생성을 눌러보세요.");

// 답변 생성 중 표시 (화면을 나갔다 와도 이어서 보이게)
let live = null;
function liveEl(c) {
  const fmt = fmtOf(c), bubble = fmt === "bubble" && (!live.cmd || live.cmd === "/ooc");
  const d = document.createElement("div");
  d.className = "msg char live";
  const typ = `${live.cmd && live.cmd !== "/ooc" ? "" : esc(iga(c.name)) + " "}입력 중<span class="dots"></span>`;
  const inner = live.text ? `<div class="body">${renderText(live.text, fmt)}</div>`
    : bubble ? `<div class="body typbub"><span class="typing">${typ}</span></div>` : `<div class="typing">${typ}</div>`;
  if (bubble) { d.innerHTML = `<div class="mrow">${avHTML(c, "mav")}<div class="mcol"><div class="who"></div>${inner}</div></div>`; d.querySelector(".who").textContent = c.name; }
  else d.innerHTML = inner;
  return d;
}
function paintLive() {
  if (!live || cur !== live.cid || !$("#chat").classList.contains("on")) return;
  const c = store.chars.find(x => x.id === live.cid);
  if (!c) return;
  const L = $("#log");
  const nearBottom = L.scrollHeight - L.scrollTop - L.clientHeight < 80;
  const old = L.querySelector(".msg.live"), el = liveEl(c);
  if (old) old.replaceWith(el); else L.appendChild(el);
  if (nearBottom) L.scrollTop = L.scrollHeight;
}
async function generate(extraUser) {
  if (busy) return;
  const c = char();
  const lastU = [...msgs()].reverse().find(m => m.role === "user");
  const cmd = lastU && lastU.cmd && CMDS[lastU.cmd] ? lastU.cmd : null;
  const useApi = ai.prov !== "builtin";
  if (!useApi && !sample) { renderLog("내장 Claude를 쓸 수 없어요. 홈의 AI 설정에서 API를 연결해주세요."); return; }
  busy = true; setBusy(true);
  live = { cid: c.id, cmd, text: "" };
  renderLog();
  $("#log").scrollTop = $("#log").scrollHeight;
  ctl = new AbortController();
  let finalText = "", errMsg = null;
  try {
    const paint = text => {
      finalText = text;
      if (live && !live.cmd) { live.text = text; paintLive(); }
    };
    if (useApi) {
      finalText = await callApi(ai, apiMessages(c, extraUser, cmd), paint, ctl.signal);
    } else {
      const r = await sample(buildTurns(c, extraUser, cmd), {
        cache: false, signal: ctl.signal, modelTier: c.tier || "default",
        onText: ({ text }) => paint(text)
      });
      finalText = r.text;
    }
  } catch (e) {
    if (useApi) { if (e.name !== "AbortError") errMsg = e.message || "응답을 받지 못했어요."; }
    else { finalText = e.text || ""; if (e.code !== "cancelled") errMsg = errCopy(e.code); }
  }
  finalText = finalText.trim();
  if (finalText && ai.merge !== false && fmtOf(c) === "bubble" && !cmd) finalText = mergeDialogue(finalText);
  if (finalText && cmd && commerceKind(cmd)) { try { finalText = commerceResponse(finalText, c, cmd); } catch (e) { errMsg = e.message; finalText = ""; } }
  if (finalText && cmd) finalText = ocFinish(finalText, c, cmd);
  const tgt = store.chats[c.id] || (store.chats[c.id] = []);
  if (finalText) {
    if (extraUser === CONT && tgt.length && tgt[tgt.length - 1].role === "assistant") {
      tgt[tgt.length - 1].text += "\n\n" + finalText;
    } else tgt.push({ id: newId(), role: "assistant", text: finalText });
    save(c.id);
  }
  busy = false; ctl = null; live = null; setBusy(false);
  if (cur === c.id && $("#chat").classList.contains("on")) { renderLog(errMsg); updMemDot(); }
  $("#log").scrollTop = $("#log").scrollHeight;
}

const CONT = "(방금 장면을 자연스럽게 이어서 계속 써줘. 유저의 행동은 쓰지 말 것.)";
function setBusy(on) {
  $("#send").textContent = on ? "멈춤" : "보내기";

}

function send() {
  if (busy) { ctl?.abort(); return; }
  const v = $("#input").value.trim();
  if (!v) return;
  const mw = v.match(/^\/메모\s+(\S+)\s*([\s\S]*)$/);
  if (mw && ocIsUser(char(), mw[1])) {
    const c = char(), inp = $("#input");
    inp.value = "[메모]\n쓴사람: " + (c.uname || "나") + "\n받는사람: " + c.name + "\n남긴곳: \n\n" + (mw[2] || "").trim();
    autoGrow(); inp.focus();
    try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch (e) {}
    return;
  }
  const pc = parseCmd(v);
  const um = { id: newId(), role: "user", text: v };
  if (pc) um.cmd = pc.key;
  msgs().push(um); save();
  $("#input").value = ""; autoGrow();
  generate();
}
function regen() {
  if (busy) return;
  const l = msgs();
  if (l.length && l[l.length - 1].role === "assistant" && l.length > 1) { l.pop(); save(); }
  generate();
}
$("#send").onclick = send;
$("#qRegen").onclick = regen;
const LEN_NAMES = { auto: "자동", short: "짧게", mid: "보통", long: "길게" };
// ---------- 핸드폰 (phone.js, 깃허브 버전) ----------
if (window.claude) $("#qPhone").hidden = true;
const phoneKV = {};
window.BamKV = {
  getItem: k => Object.prototype.hasOwnProperty.call(phoneKV, k) ? phoneKV[k] : null,
  setItem: (k, v) => { phoneKV[k] = String(v); IDB.set("phone:" + k, String(v)).catch(() => {}); },
  removeItem: k => { delete phoneKV[k]; IDB.del("phone:" + k).catch(() => {}); }
};
function phonePlain(t) {
  return String(t || "").replace(/\[\[[^\]]*\]\]/g, "").replace(/^>>\s?/gm, "").trim();
}
window.BamPhone = {
  scope: () => cur || "default",
  charName: () => (char() && char().name) || "캐릭터",
  charAvatar: () => (char() && char().avatar) || "",
  turns: () => {
    const c = char(); if (!c) return [];
    return msgs().filter(m => !m.cmd && !/^\s*\[(편지|일기|삭제내역|플리|관계|소문|커뮤|인스타|주문|결제|비밀|시청|통화|리뷰|메모|속마음)\]/.test(m.text || ""))
      .map(m => ({ who: m.role === "user" ? "user" : "char", name: m.role === "user" ? (c.uname || "나") : c.name, text: phonePlain(m.text) }))
      .filter(t => t.text.length >= 2);
  },
  api: () => {
    if (!ai || ai.prov === "builtin" || !ai.key) return {};
    if (ai.prov === "openai") return { provider: "openai", apiUrl: "https://api.openai.com/v1", apiKey: ai.key, model: ai.model || "" };
    return { provider: "custom", apiUrl: ai.url || "", apiKey: ai.key, model: ai.model || "" };
  }
};
let phoneCode = null, phoneScope = null, phoneLoaded = false;
$("#qPhone").onclick = async () => {

// ---------- 기억 ----------
function memOf(c) { if (!c.memory) c.memory = { summary: "", note: "", sumOn: true, noteOn: true, upto: 0 }; return c.memory; }
function histChars(list) { return list.reduce((a, m) => a + (m.text || "").length, 0); }
function updMemDot() {
  const c = char(); if (!c) return;
  const mem = c.memory || {}, list = msgs();
  const unsum = list.slice(Math.min(mem.upto || 0, list.length));
  $("#memDot").hidden = !(histChars(list) > 40000 && histChars(unsum) > 15000);
}
function openMemory() {
  const c = char(); if (!c) return;
  const mem = memOf(c);
  $("#memSum").value = mem.summary || ""; $("#memNote").value = mem.note || "";
  $("#memSumOn").checked = mem.sumOn !== false; $("#memNoteOn").checked = mem.noteOn !== false;
  $("#memProp").hidden = true;
  const list = msgs(), done = Math.min(mem.upto || 0, list.length);
  $("#memInfo").textContent = done ? `마지막 정리 이후 새 메시지 ${list.length - done}개` : `아직 정리한 적 없음 · 메시지 ${list.length}개`;
  show("memory");
}
function saveMem() { const c = char(); if (!c) return; const mem = memOf(c); mem.summary = $("#memSum").value; mem.note = $("#memNote").value; mem.sumOn = $("#memSumOn").checked; mem.noteOn = $("#memNoteOn").checked; save(null); }
$("#qMem").onclick = openMemory;
$("#memBack").onclick = () => { saveMem(); openChat(cur); };
["#memSum", "#memNote"].forEach(id => $(id).addEventListener("change", saveMem));
["#memSumOn", "#memNoteOn"].forEach(id => $(id).onchange = saveMem);
$("#memCancel").onclick = () => { $("#memProp").hidden = true; };
$("#memApply").onclick = () => {
  const c = char(); if (!c) return;
  const mem = memOf(c);
  $("#memSum").value = $("#memNew").value; mem.upto = mem._pending || msgs().length; delete mem._pending;
  $("#memProp").hidden = true; saveMem(); updMemDot();

};
$("#memRun").onclick = async () => {
  const c = char(); if (!c || busy) return;
  saveMem();
  const mem = memOf(c), list = msgs();
  const from = Math.min(mem.upto || 0, list.length);
  let part = list.slice(from);
  if (!part.length) { $("#memInfo").textContent = "새로 정리할 대화가 없어요."; return; }
  const u = c.uname || "유저";
  let convo = part.map(m => (m.role === "user" ? u : c.name) + ": " + sub(m.text || "", c)).join("\n\n");
  if (convo.length > 60000) convo = convo.slice(-60000);
  const prompt = `너는 롤플레이 기록을 정리하는 담당이다. 아래의 [기존 요약]과 [새 대화]를 읽고, 이야기 전체의 요약을 새로 쓴다.
- 기존 요약에 덧붙이지 말고, 전체를 다시 압축해서 하나의 요약으로 새로 쓴다.
- 오래된 사건은 짧게 줄이고, 최근 일과 지금의 관계·상태(누가 무엇을 아는지, 비밀, 약속, 미해결 일)는 자세히 남긴다.
- 실제로 일어난 사실만 쓴다. 추측, 해설, 감상, 앞으로의 전개 예측은 쓰지 않는다.
- 소설 문장이 아니라 알아보기 쉬운 정리로 쓴다. 인물 이름은 그대로 쓴다.
- 2000자를 넘지 않는다. 요약 본문만 출력한다.

[인물] ${c.name} / ${u}

[기존 요약]
${(mem.summary || "").trim() || "(없음)"}

[새 대화]
${convo}`;
  const btn = $("#memRun"); btn.disabled = true; btn.textContent = "정리하는 중...";
  try {
    let out = "";
    if (ai.prov !== "builtin") out = await callApi(ai, [{ role: "user", content: prompt }], null, null);
    else if (sample) out = (await sample([{ role: "user", content: prompt }], { cache: false })).text;
    else throw new Error("AI에 연결되지 않았어요.");
    out = (out || "").trim();
    if (!out) throw new Error("요약을 받지 못했어요.");
    mem._pending = list.length;
    $("#memNew").value = out; $("#memProp").hidden = false;
  } catch (e) {
    $("#memInfo").textContent = (e && e.message) || "정리하지 못했어요. 다시 시도해주세요.";
  }
  btn.disabled = false; btn.textContent = "정리하기";
};
function updLenBtn() { const c = char(); $("#qLen").textContent = "응답 · " + (LEN_NAMES[c && c.len] || "보통"); }
$("#qLen").onclick = () => {

$("#qDelLast").onclick = () => {

// 모바일 키보드: 보이는 영역과 읽던 위치를 함께 맞춤 (원본 방식)
(function installViewportLayout() {
  const vv = window.visualViewport, app = document.querySelector(".app"), view = $("#log");
  let frame = 0, restoreFrame = 0, settling = false, settleTimer = 0, checks = [], lastHeight = -1, lastTop = -1, lastKeyboard = null;
  let anchor = { bottom: true, top: 0 };
  const chatScreen = () => $("#chat").classList.contains("on");
  function remember() { anchor = { bottom: chatScreen() && view.scrollHeight - view.clientHeight - view.scrollTop < 48, top: view.scrollTop }; }
  function restore() { restoreFrame = 0; view.scrollTop = anchor.bottom && chatScreen() ? Math.max(0, view.scrollHeight - view.clientHeight) : anchor.top; }
  function sync() {
    frame = 0;
    if (vv && Math.abs(vv.scale - 1) > .02) return;
    const height = Math.round(vv ? vv.height : window.innerHeight), offset = Math.round(vv ? vv.offsetTop : 0);
    const focused = document.activeElement, editing = focused && /^(INPUT|TEXTAREA)$/.test(focused.tagName);
    const full = Math.max(window.innerHeight || 0, document.documentElement.clientHeight || 0);
    const keyboard = !!editing && full - height > 90;
    if (!keyboard && (window.scrollY || window.scrollX)) window.scrollTo(0, 0);
    const top = keyboard ? Math.max(0, offset) : 0;
    if (height === lastHeight && top === lastTop && keyboard === lastKeyboard) { if (settling) restore(); return; }
    settling = true;
    lastHeight = height; lastTop = top; lastKeyboard = keyboard;
    app.style.height = height + "px";
    app.style.top = top + "px";
    document.body.style.setProperty("--sab", keyboard ? "0" : "1");
    if (keyboard) document.body.setAttribute("data-kb", "1"); else document.body.removeAttribute("data-kb");
    restore();
    if (restoreFrame) cancelAnimationFrame(restoreFrame);
    restoreFrame = requestAnimationFrame(restore);
    clearTimeout(settleTimer);
    settleTimer = setTimeout(() => { restore(); settling = false; remember(); }, 180);
  }
  function schedule() { if (!frame) frame = requestAnimationFrame(sync); }
  function transition() {
    if (!settling) remember();
    settling = true;
    checks.forEach(clearTimeout); checks = [];
    schedule();
    [80, 220, 450, 700].forEach(ms => checks.push(setTimeout(schedule, ms)));
    clearTimeout(settleTimer);
    settleTimer = setTimeout(() => { restore(); settling = false; remember(); }, 850);
  }
  view.addEventListener("scroll", () => { if (!settling) remember(); }, { passive: true });
  const userScroll = () => { settling = false; clearTimeout(settleTimer); checks.forEach(clearTimeout); checks = []; remember(); };
  view.addEventListener("touchstart", userScroll, { passive: true });
  view.addEventListener("wheel", userScroll, { passive: true });
  if (vv) { vv.addEventListener("resize", schedule, { passive: true }); vv.addEventListener("scroll", schedule, { passive: true }); vv.addEventListener("scrollend", schedule, { passive: true }); }
  window.addEventListener("resize", schedule, { passive: true });
  window.addEventListener("pageshow", transition);
  window.addEventListener("orientationchange", transition);
  document.addEventListener("focusin", transition);
  document.addEventListener("focusout", transition);
  schedule();
})();
$("#input").addEventListener("focus", () => {
  setTimeout(() => { $("#log").scrollTop = $("#log").scrollHeight; }, 300);
});

const autoGrow = () => { const t = $("#input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 160) + "px"; };

// ---- 업데이트 ----
const CHANGELOG = JSON.parse(document.getElementById("changelog").textContent);
const APP_VERSION = CHANGELOG[0].v;
let latest = null;
$("#vNow").textContent = APP_VERSION;
const vnum = v => v.split(".").map(Number);
const newer = (a, b) => { const x = vnum(a), y = vnum(b); for (let i = 0; i < Math.max(x.length, y.length); i++) { if ((x[i]||0) !== (y[i]||0)) return (x[i]||0) > (y[i]||0); } return false; };

function renderChangelog() {
  const list = latest && newer(latest[0].v, APP_VERSION) ? latest : CHANGELOG;
  $("#clList").innerHTML = list.map(e => {
    const tag = e.v === APP_VERSION ? '<span class="tag">지금 버전</span>' : (newer(e.v, APP_VERSION) ? '<span class="tag">새 버전</span>' : "");
    return `<div class="cl"><h3>v${esc(e.v)} ${tag}</h3><ul>${e.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>`;
  }).join("");
}
async function checkUpdate() {
  const st = $("#vStatus");
  st.className = "st"; st.textContent = "확인 중...";
  try {
    const res = await fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw 0;
    const html = await res.text();
    const m = html.match(/<script type="application\/json" id="changelog">([\s\S]*?)<\/script>/);
    if (!m) throw 0;
    latest = JSON.parse(m[1]);
    const lv = latest[0].v;
    if (newer(lv, APP_VERSION)) {
      st.className = "st new"; st.textContent = `새 버전 v${lv}이 있어요! 새로고침을 눌러주세요.`;

    } else {
      st.textContent = "최신 버전이에요.";

    }
  } catch (e) {
    st.textContent = "새 버전을 확인하지 못했어요. 새로고침하면 최신 버전을 불러와요.";
  }
  renderChangelog();
}
$("#sUpd").onclick = () => { renderChangelog(); show("updates"); checkUpdate(); };
$("#vCheck").onclick = checkUpdate;
$("#vReload").onclick = () => {

};
