:root{
  --bg:#f3eff6; --panel:#ffffff; --ink:#262033; --soft:#6f6780; --line:#ddd5e6;
  --accent:#8a4f7d; --accent-ink:#fff; --narr:#5c5370;--faint:#9d96a9; --user-bg:#ebe2f2; --char-bg:#ffffff;
  --danger:#b04545;
  --font-body:"GowoonDodum","Gowun Dodum","Noto Sans KR",system-ui,-apple-system,sans-serif;
  --font-serif:"GounBatang","Gowun Batang",serif;
  --font-size:15px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b1824; --panel:#252131; --ink:#ece7f3; --soft:#a79fb6; --line:#3a3448;
    --accent:#d99bc6; --accent-ink:#21172a; --narr:#c0b5d2;--faint:#8b8399; --user-bg:#342b44; --char-bg:#252131; --danger:#e08a8a;
  }
}
:root[data-theme="ocean"]{--bg:#eef6ff;--panel:#fff;--ink:#16324d;--soft:#5d7fa3;--line:#cfe0f2;--accent:#2f6fb5;--accent-ink:#fff;--narr:#42607d;--faint:#8aa6c2;--user-bg:#dbeafe;--char-bg:#fff;--danger:#b04545}
:root[data-theme="green"]{--bg:#ffffff;--panel:#f5faf5;--ink:#1e3324;--soft:#5f7d68;--line:#d4e6d7;--accent:#2f7d4f;--accent-ink:#fff;--narr:#44634f;--faint:#8fae99;--user-bg:#dff3e4;--char-bg:#f5faf5;--danger:#b04545}
:root[data-theme="berry"]{--bg:#fff8fa;--panel:#fff;--ink:#3d2030;--soft:#8d6478;--line:#f2d9e3;--accent:#c2497e;--accent-ink:#fff;--narr:#6b4557;--faint:#b995a5;--user-bg:#fce0ec;--char-bg:#fff;--danger:#b04545}
:root[data-theme="lcd"]{--bg:#adbfd3;--panel:#bccbdc;--ink:#16243a;--soft:#45596f;--line:#93a7bd;--accent:#27456a;--accent-ink:#e6eef7;--narr:#2f4560;--faint:#5f7794;--user-bg:#c8d5e3;--char-bg:#bccbdc;--danger:#8f3a3a}
:root[data-theme="flip"]{--bg:#d9e5f3;--panel:#eaf1fa;--ink:#17283d;--soft:#4f6a8c;--line:#b9cbe2;--accent:#2657a0;--accent-ink:#fff;--narr:#36506e;--faint:#7c92ae;--user-bg:#c9d9ee;--char-bg:#eaf1fa;--danger:#9c3b3b}
:root[data-theme="night"],:root[data-theme="dark"]{
  --bg:#1b1824; --panel:#252131; --ink:#ece7f3; --soft:#a79fb6; --line:#3a3448;
  --accent:#d99bc6; --accent-ink:#21172a; --narr:#c0b5d2;--faint:#8b8399; --user-bg:#342b44; --char-bg:#252131; --danger:#e08a8a;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;height:100dvh;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:var(--font-size);line-height:1.6;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{position:fixed;top:0;left:0;right:0;height:100%;height:100dvh;overflow:hidden;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.on{display:flex}

header.bar{display:flex;align-items:center;gap:6px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
header.bar h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.homebar{gap:6px;position:relative;padding:10px 14px}
.homebar>.icon{height:38px;min-width:38px;padding:0 10px;border-radius:12px;color:var(--soft);font-size:14px;font-weight:500}
.homebar>.icon:hover{background:var(--panel);color:var(--ink)}
.homebar>.icon svg{display:block}
.homebar .ttl{position:absolute;left:0;right:0;text-align:center;pointer-events:none}
.homebar .ttl h1{font-size:19px}
.homebar>.icon,.homebar>.plus{position:relative;z-index:1}
.homebar .spacer{flex:1}
.plus{width:38px;height:38px;flex:none;border:0;border-radius:12px;background:var(--user-bg);color:var(--accent);font-size:22px;line-height:1;display:grid;place-items:center}
.homebar .icon{display:grid;place-items:center}
header.bar h2{font-size:16px;margin:0;flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon{background:none;border:0;padding:6px 8px;border-radius:8px;color:var(--soft);font-size:15px}
.icon:hover{background:var(--line);color:var(--ink)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn:disabled{opacity:.5}

/* home */
.list{flex:1;overflow-y:auto;padding:8px 0}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;border:0;background:none;width:100%;text-align:left}
.row:hover{background:var(--panel)}
.optcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 22px}
.optcard label:first-child{margin-top:0}
.icon.back{font-size:26px;line-height:1;padding:0 4px 4px}
header.bar .icon.back+h2,header.bar .icon.back+h1{margin-left:-2px}
.msgmenu{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:50}
.msgmenu .sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;min-width:180px;overflow:hidden}
.msgmenu button{display:block;width:100%;border:0;background:none;padding:14px 18px;text-align:left;border-bottom:1px solid var(--line);color:var(--ink)}
.msgmenu button:last-child{border-bottom:0}
.avrow{display:flex;align-items:center;gap:14px;margin-top:6px}
.avbtns{display:flex;gap:8px;flex-wrap:wrap}
.av-lg{width:72px;height:72px;font-size:30px}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.hav{width:30px;height:30px;font-size:15px;flex:none}
.av{overflow:hidden;width:48px;height:48px;border-radius:50%;background:var(--user-bg);display:grid;place-items:center;font-size:22px;flex:none;font-family:var(--font-serif);font-weight:700;color:var(--accent)}
.row .meta{flex:1;min-width:0}
.row .nm{font-weight:700}
.row .pv{color:var(--soft);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:48px 24px;text-align:center;color:var(--soft)}
.empty p{font-family:var(--font-serif);font-size:18px;color:var(--ink);margin:0 0 6px}
.fab{margin:4px 16px 16px;align-self:stretch}
.ver-now{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:20px}
.ver-now .big{font-family:var(--font-serif);font-size:22px;font-weight:700}
.ver-now .st{color:var(--soft);font-size:14px;margin:4px 0 12px}
.ver-now .st.new{color:var(--accent);font-weight:700}
.ver-now .btns{display:flex;gap:8px}
.ver-now .btns .btn{flex:1}
.cl{margin:0 0 18px}
.cl h3{font-size:15px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.cl h3 .tag{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--user-bg);color:var(--accent)}
.cl ul{margin:0;padding-left:20px;color:var(--soft);font-size:14px}
.searchwrap{padding:0 16px 10px}
.searchwrap input{width:100%}
select{width:100%}
.backup{display:flex;justify-content:center;gap:8px;padding-top:8px}
.backup .icon{font-size:13px}

/* editor */
.form{flex:1;overflow-y:auto;padding:16px 16px 32px}
fieldset{border:0;margin:0 0 22px;padding:0}
legend{font-family:var(--font-serif);font-weight:700;font-size:17px;padding:0;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--soft);margin:12px 0 5px}
input[type=text],textarea,select{width:100%;font-size:16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
textarea{min-height:90px;line-height:1.55}
textarea.tall{min-height:180px}
.hint{font-size:12px;color:var(--soft);margin-top:4px}
.two{display:grid;grid-template-columns:80px 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--panel);padding:9px 4px;font-size:14px;color:var(--soft)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.actions{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.actions .btn{flex:1}

/* chat */
.log{flex:1;overflow-y:auto;padding:18px 16px 8px}
.msg{margin:0 0 18px}
.mrow{display:flex;gap:10px;align-items:flex-start}
.mcol{flex:1;min-width:0}
.mav{width:38px;height:38px;font-size:17px}
.msg.char .body{background:var(--char-bg);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:14px 16px}
.msg.user{display:flex;flex-direction:column;align-items:flex-end}
.msg.user .body{background:var(--user-bg);border-radius:16px 4px 16px 16px;padding:10px 14px;max-width:85%;width:fit-content}
.who{font-size:13px;color:var(--soft);margin:6px 0 6px 2px;font-weight:500}
.body p{margin:0 0 .7em}
.body p:last-child{margin-bottom:0}
.gloss{color:var(--faint);font-size:.92em}
.log:not(.pron-on) .pron,.log:not(.pron-on) .glc{display:none}
.log:not(.trans-on) .trans,.log:not(.trans-on) .glc{display:none}
.log:not(.pron-on):not(.trans-on) .gloss{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 10px}
.card .ctitle{font-size:12px;letter-spacing:.06em;color:var(--accent);font-weight:700;margin-bottom:8px}
.crow{margin:0 0 6px;line-height:1.65}
.crow:last-child{margin-bottom:0}
.clab{color:var(--soft);font-size:.88em;margin-right:8px}
.paper{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.07);margin:0 0 10px;color:var(--ink);font-size:1.25em;padding:19px 20px 22px}
.paper .ruled{line-height:30px;background-image:repeating-linear-gradient(180deg,transparent 0,transparent 29px,var(--line) 29px,var(--line) 30px);background-position:0 0;background-repeat:repeat;white-space:pre-wrap}
.paper.letter .lto{line-height:30px;margin:0 0 30px}
.paper.letter .lsign{display:block;text-align:right;line-height:30px;margin:30px 0 0}
.paper.diary{padding:16px 20px 22px}
.paper.diary .dhead{display:flex;align-items:baseline;gap:10px;font-size:.92em;color:var(--soft);padding-bottom:9px;margin-bottom:11px;border-bottom:1.5px solid var(--line)}
.paper.diary .dhead .wd{font-size:.8em}
.card.hand{font-family:"Nanum Pen Script",var(--font-serif);font-size:1.3em;line-height:32px;padding:14px 16px 18px;background-image:repeating-linear-gradient(transparent,transparent 31px,var(--line) 31px,var(--line) 32px);background-position:0 40px;background-repeat:repeat}
.card.hand .crow{margin-bottom:0}
.card.hand .clab{font-size:.7em}
.ooc{border:1px dashed var(--line);border-radius:12px;padding:10px 13px;color:var(--soft);font-size:.96em;white-space:pre-wrap;margin:0 0 10px}
.nline{color:var(--soft);font-style:italic;font-family:var(--font-serif);margin:4px 2px 12px;line-height:1.75;font-size:.96em}
.spk{font-weight:700;color:var(--accent)}
.bar{color:var(--soft);margin:0 8px}
.fmt-novel .msg.char .body,.fmt-script .msg.char .body{background:none;border:0;padding:0 2px}
.fmt-novel .msg.char .body{line-height:1.85}
.fmt-novel .body p,.fmt-script .body p{margin:0 0 .9em}
.fmt-novel .narr,.fmt-script .narr{color:var(--soft)}
.narr{font-family:var(--font-serif);color:var(--narr);line-height:1.8}
.say{color:var(--ink)}
.tools{display:none}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0}
.msg.user .acts{justify-content:flex-end}
.acts button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px;padding:8px 16px;font-size:14px}
.acts button.red{color:var(--danger)}
.msg{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.multi{margin:0 0 12px}
.mhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--soft);margin-bottom:4px}
.urow .mcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-end}
.msg.user .tools{justify-content:flex-end}
.tools .icon{font-size:12px;padding:3px 7px}
.thinking{color:var(--soft);font-size:14px}
.thinking::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@media (prefers-reduced-motion:reduce){.thinking::after{animation:none;content:"..."}}
.err{color:var(--danger);font-size:13px;margin:-8px 0 16px}
.edit-area{width:100%;min-height:120px;font-size:16px}
.composer{border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.composer .quick{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto}
.composer .quick button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--soft);white-space:nowrap}
.composer .in{display:flex;gap:8px;align-items:flex-end}
.composer textarea{font-size:max(var(--font-size),16px);min-height:44px;max-height:160px;resize:none;border-radius:14px}
.composer .btn{padding:10px 14px;border-radius:14px;flex:none}
.banner{margin:12px 16px 0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--soft);background:var(--panel)}
</style>
</head>
<body>
<div class="app">

  <!-- 홈 -->
  <section class="screen on" id="home">
    <header class="bar homebar">

        <div class="btns"><button class="btn ghost" id="vCheck">다시 확인</button><button class="btn" id="vReload">새로고침</button></div>
      </div>
      <div id="clList"></div>

  </section>

  <!-- AI 설정 -->

    <header class="bar"><button class="icon back" data-back aria-label="뒤로">‹</button><h2>설정</h2></header>
    <div class="form">
      <fieldset hidden>
        <legend>AI 제공자</legend>

        <select id="sTheme"></select>
        <label for="sFontSel">글꼴</label>
        <select id="sFontSel"></select>
        <label for="sFs" id="sFsLabel">글자 크기</label>

<script>
(() => {
const $ = s => document.querySelector(s);
const KEY = "bamp_v1";
let store = { chars: [], chats: {}, theme: null };
try { const raw = localStorage.getItem(KEY); if (raw) store = Object.assign(store, JSON.parse(raw)); } catch(e) {}
let cur = null, busy = false, ctl = null;

// ---- 계정 저장소 (업데이트해도 유지) ----
let db = null, uid = null, dbReady = false;
const pages = {};
const dirtyChats = new Set();
const dirtyAvatars = new Set();
let metaDirty = false, flushTimer = null;
const col = () => db.collection("data/users/" + uid);
const PAGE = 180000;

function save(chatId) {
  try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e) {}
  metaDirty = true;
  if (chatId === undefined) chatId = cur;
  if (chatId) dirtyChats.add(chatId);
  if (!dbReady) return;
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, 700);
}

function splitPages(list) {
  const out = []; let curp = [], size = 0;
  list.forEach(m => {
    const s = JSON.stringify(m).length;
    if (curp.length && size + s > PAGE) { out.push(curp); curp = []; size = 0; }
    curp.push(m); size += s;
  });
  if (curp.length || !out.length) out.push(curp);
  return out;
}

async function flush() {
  if (!dbReady) return;
  const chats = [...dirtyChats]; dirtyChats.clear();
  const doMeta = metaDirty; metaDirty = false;
  try {
    for (const id of chats) {
      const exists = store.chars.some(c => c.id === id);
      const parts = exists ? splitPages(store.chats[id] || []) : [];
      for (let i = 0; i < parts.length; i++) await col().doc(`chat_${id}_${i}`).set({ msgs: parts[i] });
      const old = pages[id] || 0;
      for (let i = parts.length; i < old; i++) await col().doc(`chat_${id}_${i}`).delete();
      if (exists) pages[id] = parts.length; else delete pages[id];
    }
    for (const id of [...dirtyAvatars]) {
      const c = store.chars.find(x => x.id === id);
      if (c && c.avatar) await col().doc(`avatar_${id}`).set({ img: c.avatar });
      else await col().doc(`avatar_${id}`).delete().catch(() => {});
      dirtyAvatars.delete(id);
    }
    if (doMeta || chats.length) await col().doc("meta").set({ chars: store.chars.map(c => { const o = Object.assign({}, c); delete o.avatar; return o; }), theme: store.theme || null, pages });

function apiBase(cfg) { return cfg.prov === "openai" ? "https://api.openai.com/v1" : cfg.url; }
async function callApi(cfg, messages, onText, signal, maxOverride) {
  if (!cfg.key && cfg.prov === "openai") throw new Error("API 키를 입력해주세요.");
  if (cfg.prov === "custom" && !cfg.url) throw new Error("API 주소를 입력해주세요.");
  if (!cfg.model) throw new Error("모델 이름을 입력해주세요.");
  const body = { model: cfg.model, messages, stream: true, temperature: cfg.temp };
  const mt = cfg.max || 0;
  if (cfg.prov === "openai" && /^(o\d|gpt-5)/.test(cfg.model)) { delete body.temperature; if (mt) body.max_completion_tokens = mt; }
  else if (mt) body.max_tokens = mt;
  let res;
  try {
    res = await fetch(apiBase(cfg) + "/chat/completions", {
      method: "POST", signal,
      headers: Object.assign({ "Content-Type": "application/json" }, cfg.key ? { Authorization: "Bearer " + cfg.key } : {}),
      body: JSON.stringify(body)
    });
  } catch (e) {
    if (e.name === "AbortError") throw e;
    throw new Error(inClaude ? "claude.ai 안에서는 외부 API에 연결할 수 없어요. 파일을 따로 올려서 열어주세요." : "서버에 연결하지 못했어요. 주소와 인터넷 연결을 확인해주세요.");
  }
  if (!res.ok) {
    let msg = "";
    try { const j = await res.json(); msg = j.error?.message || j.message || ""; } catch(e) {}
    const m = { 401: "API 키가 올바르지 않아요.", 403: "이 키로는 접근 권한이 없어요.", 404: "모델 이름이나 주소를 찾을 수 없어요.", 429: "요청이 너무 많거나 크레딧이 부족해요." }[res.status];
    throw new Error((m || "오류 " + res.status) + (msg ? " (" + msg.slice(0, 120) + ")" : ""));
  }
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", text = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split("\n"); buf = lines.pop();
    for (const line of lines) {
      const l = line.trim();
      if (!l.startsWith("data:")) continue;
      const data = l.slice(5).trim();
      if (data === "[DONE]") continue;
      try {
        const j = JSON.parse(data);
        const delta = j.choices?.[0]?.delta?.content || "";
        if (delta) { text += delta; onText && onText(text); }
      } catch(e) {}
    }
  }
  return text;
}

function parseCmd(text) {

const CARD_TITLES = { "편지": "편지", "일기": "일기", "플리": "플레이리스트", "관계": "관계", "상태": "상태", "소문": "소문", "커뮤": "커뮤니티", "인스타": "인스타그램", "주문": "주문 내역", "결제": "결제 내역" };
function paperCard(kind, body, hand) {
  const style = hand ? ` style="font-family:${hand}"` : "";
  const txt = String(body || "").replace(/\r/g, "").trim();
  if (kind === "편지") {
    const to = txt.match(/\[수신\]([\s\S]*?)\[\/수신\]/);
    const main = txt.match(/\[본문\]([\s\S]*?)\[\/본문\]/);
    const sg = txt.match(/\[서명\]([\s\S]*?)\[\/서명\]/);
    let tTo = to ? to[1].trim() : "", tBody = main ? main[1].trim() : "", tSign = sg ? sg[1].trim() : "";
    if (!main) {
      const ls = txt.split("\n").map(l => l.trim()).filter(Boolean);
      if (ls.length > 1 && /(에게|께|へ|様|先生)\s*[,.:]?$/.test(ls[0])) tTo = ls.shift();
      if (ls.length > 1 && /(올림|드림|씀|より|From|Sincerely)/i.test(ls[ls.length - 1]) && ls[ls.length - 1].length <= 60) tSign = ls.pop();
      tBody = ls.join(" ");
    }
    return `<div class="paper letter"${style}>${tTo ? `<div class="lto">${esc(tTo)}</div>` : ""}<div class="ruled">${esc(tBody.replace(/\n+/g, " "))}</div>${tSign ? `<div class="lsign">${esc(tSign)}</div>` : ""}</div>`;
  }
  const dl = txt.split("\n");
  let dtxt = "", di = -1;
  for (let q = 0; q < dl.length && q < 4; q++) {
    const L = dl[q].trim();
    if (!L) continue;
    if (/^날짜\s*[:：]/.test(L)) { dtxt = L.replace(/^날짜\s*[:：]\s*/, "").trim(); di = q; break; }
    if (/^\d{4}\s*[.\-년]/.test(L) || /^\d{1,2}\s*월\s*\d{1,2}\s*일/.test(L)) { dtxt = L; di = q; break; }
  }
  if (di >= 0) dl.splice(di, 1);
  let wd = "";
  const mw = dtxt.match(/([월화수목금토일])\s*요일/);
  if (mw) { wd = mw[0]; dtxt = dtxt.replace(/[,·\s(]*([월화수목금토일])\s*요일[)]*/, "").trim(); }
  const rest = dl.join(" ").replace(/^본문\s*[:：]\s*/, "").replace(/\s+/g, " ").trim();
  return `<div class="paper diary"${style}><div class="dhead"><span>${esc(dtxt)}</span>${wd ? `<span class="wd">${esc(wd)}</span>` : ""}</div><div class="ruled">${esc(rest)}</div></div>`;
}
function renderCards(text, hand) {
  const re = /\[(편지|일기|플리|관계|상태|소문|커뮤|인스타|주문|결제)\]([\s\S]*?)\[\/\1\]/g;
  let out = "", last = 0, m;
  while ((m = re.exec(text))) {
    out += renderPlainChunk(text.slice(last, m.index));
    const kind = m[1], isHand = kind === "편지" || kind === "일기";
    if (kind === "편지" || kind === "일기") { out += paperCard(kind, m[2], hand); last = re.lastIndex; continue; }
    const rows = m[2].split(/\n/).map(l => l.trim()).filter(Boolean).map(l => {
      const lb = l.match(/^([^:|]{1,8}):\s*([\s\S]*)$/);
      if (lb) return `<div class="crow"><span class="clab">${esc(lb[1])}</span><span>${esc(lb[2])}</span></div>`;
      return `<div class="crow"><span>${esc(l)}</span></div>`;
    }).join("");
    out += `<div class="card${isHand ? " hand" : ""}"${isHand && hand ? ` style="font-family:${hand}"` : ""}><div class="ctitle">${esc(CARD_TITLES[kind] || kind)}</div>${rows}</div>`;
    last = re.lastIndex;
  }
  if (!out) return null;
  out += renderPlainChunk(text.slice(last));
  return out;
}
function renderPlainChunk(t) { return t && t.trim() ? renderBlocks(t, "bubble") : ""; }
function renderBlocks(text, fmt) {
  const lines = text.replace(/\r/g, "").split(/\n/).map(l => l.trim()).filter(Boolean);
  let html = "", buf = [];
  const flush = () => { if (buf.length) { html += `<div class="body">${renderText(buf.join("\n"), fmt)}</div>`; buf = []; } };
  lines.forEach(l => {
    const m = l.match(/^(?:>>|》)\s*(.*)$/);
    if (m) { flush(); html += `<div class="nline">${esc(m[1].replace(/\*/g, ""))}</div>`; }
    else buf.push(l);
  });
  flush();
  return html || `<div class="body"></div>`;
}
function renderText(text, fmt) {
  fmt = fmt || "bubble";
  const narrDefault = fmt !== "bubble";
  const lines = text.replace(/\r/g, "").split(/\n/).map(l => l.trim()).filter(Boolean);
  return lines.map(l => {
    const name = l.match(/^([^\s:|*"“(]{1,14})\s*[:|]\s*(.*)$/);
    let prefix = "";
    if (fmt === "script" && name) { prefix = `<span class="spk">${esc(name[1])}</span><span class="bar">|</span>`; l = name[2]; }
    const parts = l.split(/(\[\[[^\]]*\]\]|\*[^*]+\*|\([^)]*\)|"[^"]*"|“[^”]*”)/g).filter(x => x && x.length);
    const html = parts.map(x => {
      const gl = x.match(/^\[\[([^\]]*)\]\]$/);
      if (gl) {
        const seg = gl[1].split("|");
        const pron = seg.length > 1 ? seg[0].trim() : "";
        const tr = (seg.length > 1 ? seg.slice(1).join("|") : seg[0]).trim();
        return `<span class="gloss">(${pron ? `<span class="pron">${esc(pron)}</span>` : ""}${pron && tr ? `<span class="glc">, </span>` : ""}${tr ? `<span class="trans">${esc(tr)}</span>` : ""})</span>`;
      }
      if (/^\*[^*]+\*$/.test(x)) return `<span class="narr">${esc(x.slice(1, -1))}</span>`;
      if (/^\(.*\)$/.test(x)) return `<span class="narr">${esc(x)}</span>`;
      if (/^["“].*["”]$/.test(x)) return `<span class="say">${esc(x)}</span>`;
      const clean = x.replace(/\*/g, "");
      if (!clean.trim()) return esc(clean);
      return `<span class="${narrDefault ? "narr" : "say"}">${esc(clean)}</span>`;
    }).join("");
    return `<p>${prefix}${html}</p>`;
  }).join("");
}

// 대사만 있는 문단을 앞 지문 문단에 붙이기
function mergeDialogue(text) {
  const paras = text.replace(/\r/g, "").split(/\n+/).map(p => p.trim()).filter(Boolean);
  const isNarr = p => /\*[^*]+\*/.test(p);
  if (!paras.some(isNarr) || !paras.some(p => !isNarr(p))) return text;
  const out = [];
  let pending = "";
  paras.forEach(p => {
    if (!isNarr(p)) {
      if (out.length && out[out.length - 1].length + p.length < 600) out[out.length - 1] += " " + p;
      else if (out.length) out.push(p);
      else pending += (pending ? " " : "") + p;
    } else {
      out.push(pending ? pending + " " + p : p);
      pending = "";
    }
  });
  if (pending) out.push(pending);
  return out.join("\n\n");
}

function pickImage(f, done) {
  if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const S = 256, cv = document.createElement("canvas");
      cv.width = S; cv.height = S;
      const side = Math.min(img.width, img.height);
      cv.getContext("2d").drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, S, S);
      done(cv.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = () => alert("이미지를 읽지 못했어요.");
    img.src = fr.result;
  };
  fr.readAsDataURL(f);
}

    if (m.role === "user") content = `<div class="body">${renderText(m.text, fmt)}</div>`;
    else if (m.ooc) { content = `<div class="ooc">${esc(m.text)}</div>`; bare = true; }
    else {
      const cards = renderCards(m.text, HANDS[c.hand] || HANDS["단정"]);
      if (cards) { content = cards; bare = true; }
      else { content = renderBlocks(m.text, fmt); bare = fmt !== "bubble"; }
    }
    const inner = `${bare ? "" : `<div class="who"></div>`}${content}<div class="tools"></div>`;
    if (m.role === "user") d.innerHTML = ai.uav === false
      ? `<div class="mrow urow"><div class="mcol">${inner}</div></div>`
      : `<div class="mrow urow"><div class="mcol">${inner}</div>${avHTML({ avatar: c.uavatar, name: c.uname || "나" }, "mav")}</div>`;
    else d.innerHTML = bare ? inner : `<div class="mrow">${avHTML(c, "mav")}<div class="mcol">${inner}</div></div>`;
    if (m.role !== "user" && !bare) d.querySelector(".who").textContent = c.name;
    const whoEl = d.querySelector(".who");
    if (whoEl && m.role === "user") whoEl.textContent = c.uname || "나";
    const acts = [];
    if (i === list.length - 1 && m.role === "assistant" && i > 0) acts.push(["다시 생성", regen]);
    acts.push(["복사", () => { try { navigator.clipboard.writeText(m.text); } catch (e) {} }]);
    acts.push(["수정", () => editMsg(d, m)]);
    acts.push(["삭제", () => { if (busy) return; list.splice(i, 1); save(); renderLog(); }, "red"]);
    acts.push(["여기부터 지우기", () => { if (busy) return; if (!confirm("이 메시지부터 아래 대화를 모두 지울까요?")) return; list.splice(i); save(); renderLog(); }, "red"]);
    let timer = null;
    const toggle = () => toggleActs(d, acts);
    d.addEventListener("contextmenu", e => { e.preventDefault(); toggle(); });
    d.addEventListener("touchstart", e => { if (e.target.closest(".acts")) return; timer = setTimeout(() => { timer = null; toggle(); }, 450); }, { passive: true });
    ["touchend", "touchmove", "touchcancel"].forEach(ev => d.addEventListener(ev, () => { if (timer) { clearTimeout(timer); timer = null; } }, { passive: true }));
    L.appendChild(d);
  });
  if (errText) { const e = document.createElement("div"); e.className = "err"; e.textContent = errText; L.appendChild(e); }
}

function buildRules(c, cmd) {
  const u = c.uname || "유저";
  const lenMap = {
    short: "1~2문단 정도로 짧게. 장면에 따라 조금 더 길거나 짧아도 된다.",
    mid: "2~3문단 정도. 장면에 따라 조금 더 길거나 짧아도 된다.",
    long: "4~6문단 정도로 길게. 장면에 따라 조금 더 길거나 짧아도 된다.",
    auto: "정해진 분량 없음. 장면 흐름에 맞게 알아서 정한다. 한 줄로 끝내도 되고 길게 써도 된다."
  };
  const fmt = c.format === "novel" || c.format === "script" ? c.format : "bubble";
  const fmtRules = fmt === "novel"
    ? `- 소설 형식으로 쓴다. 지문은 별표 없이 그냥 쓰고, 대사만 큰따옴표("")로 감싼다.
- 지문 묶음과 대사를 문단으로 나눈다. 문단 사이는 빈 줄로 띄운다. 한 문단이 지나치게 길어지지 않게 한다.
- 대사는 한 줄에 하나씩 쓰고, 필요하면 대사 뒤에 짧은 서술을 붙여도 된다.`
    : fmt === "script"
    ? `- 대본 형식으로 쓴다. 대사는 \`${c.name} | "대사"\` 처럼 이름과 세로선(|)을 앞에 붙이고 큰따옴표로 감싼다.
- 행동이나 표정 같은 지문은 *별표*로 감싸 한 줄로 짧게 쓴다.
- 대사와 지문은 각각 한 줄씩 쓰고, 줄 사이는 빈 줄로 띄운다.`
    : `- 행동·표정·분위기·속마음 등 지문은 *별표*로 감싸고, ${c.name}의 대사는 별표 없이 쓴다.
- 대사에 따옴표("")를 붙이지 않는다.
- 지문과 대사는 한 문단 안에서 이어 쓴다. 지문 다음에 줄을 바꿔 대사를 따로 떼어놓지 않는다. (*지문* 대사 *지문* 대사 처럼 한 줄로 이어진다)`;
  const narrRule = c.narr === "some" || c.narr === "many" ? `
- 나레이션을 쓸 수 있다. 나레이션은 ${c.name}의 말이나 행동이 아니라, 장면 밖에서 상황을 서술하는 목소리다. 시간·장소가 바뀌거나, 전화·인기척·날씨 같은 새 상황이 생기거나, 분위기를 짚어줄 때 쓴다.
- 나레이션 줄은 >> 로 시작해 한 줄로 쓰고, 별표를 쓰지 않는다. 예: >> 30초 후. 복도에서 발소리가 들렸다.
- 나레이션에서 ${c.uname || "유저"}의 말이나 속마음을 대신 쓰지 않는다. 상황만 던지고 반응은 맡긴다.
- 빈도: ${c.narr === "many" ? "응답마다 한 번 정도" : "서너 번에 한 번 정도, 필요할 때만"}.` : "";
  const LANGS = { ja: "일본어", en: "영어", zh: "중국어(간체)" };
  const wantP = !!ai.pron, wantT = ai.trans !== false;
  const glossRule = !wantP && !wantT
    ? "- 대사 뒤에 번역이나 발음을 붙이지 않는다."
    : wantP && wantT
    ? `- 대사마다 바로 뒤에 [[발음|번역]]을 붙인다. 발음은 한글로 적은 읽는 소리, 번역은 ${c.name}의 말투를 살린 자연스러운 한국어 의역이다(직역하지 않는다).
- 예: あんたのこと、本当に嫌い。[[안타노 코토, 혼토니 키라이|너 진짜 싫어.]]`
    : wantT
    ? `- 대사마다 바로 뒤에 [[번역]]을 붙인다. 번역은 ${c.name}의 말투를 살린 자연스러운 한국어 의역이다(직역하지 않는다). 발음은 쓰지 않는다.
- 예: あんたのこと、本当に嫌い。[[너 진짜 싫어.]]`
    : `- 대사마다 바로 뒤에 [[발음|]]을 붙인다. 발음은 한글로 적은 읽는 소리다. 번역은 쓰지 않는다.
- 예: あんたのこと、本当に嫌い。[[안타노 코토, 혼토니 키라이|]]`;
  const langRule = LANGS[c.lang] ? `
- ${c.name}의 대사는 ${LANGS[c.lang]}로 쓴다. 지문과 나머지는 한국어로 쓴다.
${glossRule}
- [[ ]] 안에는 발음과 번역만 넣고, 괄호나 따옴표를 추가로 쓰지 않는다.` : "";
  const styleTexts = (c.styles && c.styles.length ? c.styles : (c.style ? [c.style] : [])).filter(t => t && t.trim());
  const styleBlock = styleTexts.length
    ? "\n[문체 참고]\n아래 글은 원하는 문체의 예시다. 문장의 호흡, 지문과 대사가 섞이는 방식, 톤, 묘사의 밀도만 참고한다. 문장, 표현, 전개, 구조는 베끼지 않는다.\n" + styleTexts.map(t => "---\n" + sub(t, c) + "\n---").join("\n")
    : "";
  const tense = c.tense === "past"
    ? "- 지문은 3인칭 과거형(~했다, ~였다)으로 쓴다."
    : "- 지문은 3인칭 현재형(~한다, ~본다)으로 쓴다.";
  return `너는 지금부터 캐릭터 롤플레이 채팅의 '${c.name}' 역할을 맡는다. 이후 대화에서 너는 오직 ${c.name}으로서 응답한다.

[캐릭터 설정]
${sub(c.prompt, c) || "(설정 없음)"}

[유저 캐릭터: ${u}]
${sub(c.upersona, c) || "(설정 없음)"}

[작성 규칙]
- 한국어로 쓴다.
${tense}
${fmtRules}${langRule}${narrRule}
- 대사나 질문으로 끝내야 하는 건 아니다. 지문으로 끝나도 되고 대사로 끝나도 된다. 장면 흐름에 맞게 정한다.
- 이전 응답의 형식을 그대로 따라 하지 않는다. 문단 수, 지문과 대사의 순서·비율·길이는 매번 새로 정한다. 지문으로 시작해도 되고 대사로 시작해도 된다. 어떤 응답은 지문이 많고 어떤 응답은 대사가 많아도 된다. 앞의 답과 모양이 비슷해지는 것을 경계한다.
- ${u}의 대사, 행동, 감정은 대신 쓰지 않는다.
- ${u}가 결과나 시간 경과, 장면 전환을 뜻하는 지문을 쓰면(예: *결국 그날 밤 같이 잔다*, *다음 날 아침*), 그것은 이미 그렇게 되었다는 설정이다. 그 내용을 설명하거나 앞 장면을 이어 받지 말고, 곧바로 그 시점의 새 장면부터 쓴다. 앞 장면의 대화를 요약하거나 반응하지 않는다.
- 분량: ${lenMap[c.len] || lenMap.mid}.
${(c.note || "").trim() ? "\n[추가 지시]\n" + sub(c.note, c) : ""}
${styleBlock}

${cmd ? "\n[이번 턴 지시 — 위 형식 규칙보다 우선한다]\n" + CMDS[cmd] : ""}
이제 롤플레이를 시작한다.`;
}

function buildTurns(c, extraUser, cmd) {
  let hist = msgs().map(m => ({ role: m.role, content: m.text }));
  if (extraUser) hist.push({ role: "user", content: extraUser });
  const rules = buildRules(c, cmd);
  const LIMIT = 55000;
  const size = () => rules.length + hist.reduce((a, t) => a + t.content.length, 0);
  while (hist.length > 2 && size() > LIMIT) hist.shift();
  const turns = [{ role: "user", content: rules }];
  hist.forEach(t => {
    const last = turns[turns.length - 1];
    if (last.role === t.role) last.content += "\n\n" + t.content;
    else turns.push({ role: t.role, content: t.content });
  });
  if (turns[turns.length - 1].role !== "user") turns.push({ role: "user", content: "(계속)" });
  return turns;
}

async function generate(extraUser) {
  if (busy) return;
  const c = char();
  const lastU = [...msgs()].reverse().find(m => m.role === "user");
  const cmd = lastU && lastU.cmd && CMDS[lastU.cmd] ? lastU.cmd : null;
  const useApi = ai.prov !== "builtin";
  if (!useApi && !sample) { renderLog("내장 Claude를 쓸 수 없어요. 홈의 AI 설정에서 API를 연결해주세요."); return; }
  busy = true; setBusy(true);
  renderLog();
  const d = document.createElement("div");
  d.className = "msg char";
  d.innerHTML = fmtOf(c) === "bubble" && !cmd
    ? `<div class="mrow">${avHTML(c, "mav")}<div class="mcol"><div class="who"></div><div class="body"><span class="thinking">${esc(iga(c.name))} 생각 중</span></div></div></div>`
    : `<div class="body"><span class="thinking">${esc(iga(c.name))} 생각 중</span></div>`;
  const wq = d.querySelector(".who");
  if (wq) wq.textContent = c.name;
  $("#log").appendChild(d); $("#log").scrollTop = $("#log").scrollHeight;
  const body = d.querySelector(".body");
  ctl = new AbortController();
  let finalText = "", errMsg = null;
  try {
    const paint = text => {
      finalText = text;
      const nearBottom = $("#log").scrollHeight - $("#log").scrollTop - $("#log").clientHeight < 80;
      body.innerHTML = renderText(text, fmtOf(c));
      if (nearBottom) $("#log").scrollTop = $("#log").scrollHeight;
    };
    if (useApi) {
      finalText = await callApi(ai, apiMessages(c, extraUser, cmd), paint, ctl.signal);
    } else {
      const r = await sample(buildTurns(c, extraUser, cmd), {
        cache: false, signal: ctl.signal, modelTier: c.tier || "default",
        onText: ({ text }) => paint(text)
      });
      finalText = r.text;
    }
  } catch (e) {
    if (useApi) { if (e.name !== "AbortError") errMsg = e.message || "응답을 받지 못했어요."; }
    else { finalText = e.text || ""; if (e.code !== "cancelled") errMsg = errCopy(e.code); }
  }
  finalText = finalText.trim();
  if (finalText && ai.merge !== false && fmtOf(c) === "bubble" && !cmd) finalText = mergeDialogue(finalText);
  if (finalText) {
    if (extraUser === CONT && msgs().length && msgs()[msgs().length - 1].role === "assistant") {
      msgs()[msgs().length - 1].text += "\n\n" + finalText;
    } else msgs().push({ id: newId(), role: "assistant", text: finalText, ooc: cmd === "/ooc" || undefined });
    save();
  }
  busy = false; ctl = null; setBusy(false);
  renderLog(errMsg);
  $("#log").scrollTop = $("#log").scrollHeight;
}

async function checkUpdate() {
  const st = $("#vStatus");
  st.className = "st"; st.textContent = "확인 중...";
  try {
    const res = await fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw 0;
    const html = await res.text();
    const m = html.match(/<script type="application\/json" id="changelog">([\s\S]*?)<\/script>/);
    if (!m) throw 0;
    latest = JSON.parse(m[1]);
    const lv = latest[0].v;
    if (newer(lv, APP_VERSION)) {
      st.className = "st new"; st.textContent = `새 버전 v${lv}이 있어요! 새로고침을 눌러주세요.`;

    } else {
      st.textContent = "최신 버전이에요.";

    }
  } catch (e) {
    st.textContent = "새 버전을 확인하지 못했어요. 새로고침하면 최신 버전을 불러와요.";
  }
  renderChangelog();
}
$("#sUpd").onclick = () => { renderChangelog(); show("updates"); checkUpdate(); };
$("#vCheck").onclick = checkUpdate;
$("#vReload").onclick = () => {
  if (busy) return;
  try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e) {}
  if (window.claude) { location.reload(); return; }
  location.replace(location.pathname + "?v=" + Date.now());
};


renderHome();
})();
</script>
</body>
</html>
