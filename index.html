  {"v":"1.14","items":["응답 길이에 '자동' 추가 (상한 없이 흐름에 맞게)","짧게·보통·길게도 장면에 따라 늘었다 줄었다 하도록 완화","이전 응답의 형식(문단 수, 지문·대사 순서와 비율)을 따라 하지 않도록 지시 추가"]},
  {"v":"1.13","items":["작성 규칙을 최소한으로 정리 (별표 지문, 따옴표 금지, 한 문단으로 이어 쓰기, 끝맺음 자유)","지문 시제를 현재형/과거형 중에 고를 수 있음"]},
  {"v":"1.12","items":["규칙 정리: 질문으로 끝내지 말기, 감정 설명 줄이기, 말줄임표 제한, 쉼표 끊기 금지, 'A, 아니 B' 금지 삭제"]},
  {"v":"1.11","items":["AI 설정에 '문단 정리' 추가: 대사만 떨어진 줄을 앞 지문 문단에 자동으로 붙임","정리된 문체로 저장돼서 다음 답변도 그 문체를 따라가게 함"]},
  {"v":"1.10","items":["대사만 따로 떨어진 문단이 많아지는 문제 수정: 대사를 지문 문단 안에 섞도록","응답 길이 조정 (보통 2~4문단, 길게 4~6문단)"]},
  {"v":"1.9","items":["캐릭터 설정에 '문체 예시' 칸 추가: 마음에 드는 답변을 넣으면 그 문체를 참고","지문에 캐릭터의 속내 녹이기, 대사 길이 다양하게"]},
  {"v":"1.8","items":["응답 구조가 매번 똑같이 반복되는 문제 수정","문단 길이·끝맺음을 다양하게, 형식 예시 제거"]},
  {"v":"1.7","items":["응답 문체 통일: 현재형 지문, 따옴표 없는 대사, 지문과 대사 섞기","형식 예시를 넣어 API 모델(제미나이 등)도 같은 스타일로 쓰도록 조정"]},
  {"v":"1.6","items":["업데이트 내역 화면 추가","새 버전 확인하고 바로 새로고침하는 버튼 추가"]},
  {"v":"1.5","items":["최대 출력 토큰 기본값을 비움 (생각하는 모델 빈 응답 오류 해결)","연결 테스트 토큰 제한 제거","직접 입력(프록시)에서 캐릭터 설정을 첫 메시지에 합쳐 보내도록 변경"]},
  {"v":"1.4","items":["AI 설정 추가: 내장 Claude / OpenAI / 직접 입력","창의성(temperature), 최대 출력 토큰, 연결 테스트"]},
  {"v":"1.3","items":["어색한 말투 규칙 추가 (자기 정정, 쉼표 끊기, 번역투)","말줄임표 규칙 완화"]},
  {"v":"1.2","items":["업데이트해도 대화가 남도록 계정 저장","백업 내보내기 / 불러오기"]},
  {"v":"1.1","items":["말줄임표 남발 줄이기"]},
  {"v":"1.0","items":["첫 버전: 캐릭터·유저 프롬프트, 지문/대사 구분, 이어쓰기, 다시 생성"]}
]

:root{
  --bg:#FFFFFF; --panel:#FFFFFF; --ink:#191820; --soft:#8B8896; --line:#E7E5EC;
  --accent:#6F5FC4; --accent-ink:#fff; --narr:#736F80;--faint:#4C4857; --user-bg:#E3DFF6; --char-bg:#EFEEF2; --field:#F4F3F7;
  --danger:#b04545;
  --font-body:"GowoonDodum","Gowun Dodum","Noto Sans KR",system-ui,-apple-system,sans-serif;
  --font-serif:"GounBatang","Gowun Batang",serif;
  --font-size:15px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b1824; --field:#2a2536; --panel:#252131; --ink:#ece7f3; --soft:#a79fb6; --line:#3a3448;
    --accent:#d99bc6; --accent-ink:#21172a; --narr:#c0b5d2;--faint:#8b8399; --user-bg:#342b44; --char-bg:#252131; --danger:#e08a8a;
  }
}
:root[data-theme="night"],:root[data-theme="dark"]{
  --bg:#1b1824; --field:#2a2536; --panel:#252131; --ink:#ece7f3; --soft:#a79fb6; --line:#3a3448;
  --accent:#d99bc6; --accent-ink:#21172a; --narr:#c0b5d2;--faint:#8b8399; --user-bg:#342b44; --char-bg:#252131; --danger:#e08a8a;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;height:100dvh;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:var(--font-size);line-height:1.6;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{position:fixed;top:0;left:0;right:0;height:100%;height:100dvh;overflow:hidden;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.on{display:flex}

header.bar{display:flex;align-items:center;gap:6px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
header.bar h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.homebar{gap:6px;position:relative;padding:10px 14px}
.homebar>.icon{height:38px;min-width:38px;padding:0 10px;border-radius:12px;color:var(--soft);font-size:14px;font-weight:500}
.homebar>.icon:hover{background:var(--panel);color:var(--ink)}
.homebar>.icon svg{display:block}
.homebar .ttl{position:absolute;left:0;right:0;text-align:center;pointer-events:none}
.homebar .ttl h1{font-size:19px}
.homebar>.icon,.homebar>.plus{position:relative;z-index:1}
.homebar .spacer{flex:1}
.plus{width:38px;height:38px;flex:none;border:0;border-radius:12px;background:var(--user-bg);color:var(--accent);font-size:22px;line-height:1;display:grid;place-items:center}
.homebar .icon{display:grid;place-items:center}
header.bar h2{font-size:16px;margin:0;flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon{background:none;border:0;padding:6px 8px;border-radius:8px;color:var(--soft);font-size:15px}
.icon:hover{background:var(--line);color:var(--ink)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn:disabled{opacity:.5}

/* home */
.list{flex:1;overflow-y:auto;padding:8px 0}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;border:0;background:none;width:100%;text-align:left}
.row:hover{background:var(--panel)}
.optcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 22px}
.optcard label:first-child{margin-top:0}
.icon.back{font-size:26px;line-height:1;padding:0 4px 4px}
header.bar .icon.back+h2,header.bar .icon.back+h1{margin-left:-2px}
.cropwrap{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:60}
.cropsheet{background:var(--panel);border-radius:18px;padding:18px;width:min(320px,92vw);display:flex;flex-direction:column;align-items:center;gap:14px}
.croptitle{font-weight:700;align-self:flex-start}
.cropbox{position:relative;overflow:hidden;border-radius:12px;background:#111;touch-action:none;cursor:grab}
.cropbox img{position:absolute;left:0;top:0;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.cropmask{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 999px rgba(0,0,0,.5);pointer-events:none}
.cropzoom{width:100%;padding:0}
.cropbtns{display:flex;gap:8px;width:100%}
.cropbtns .btn{flex:1}
.swl{display:flex;gap:10px;align-items:center;color:var(--ink);font-size:15px;margin:0 0 8px}
.swl input{width:20px;height:20px}
#qMem{position:relative}
.mdot{position:absolute;top:3px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.msgmenu{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:50}
.msgmenu .sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;min-width:180px;overflow:hidden}
.msgmenu button{display:block;width:100%;border:0;background:none;padding:14px 18px;text-align:left;border-bottom:1px solid var(--line);color:var(--ink)}
.msgmenu button:last-child{border-bottom:0}
.avrow{display:flex;align-items:center;gap:14px;margin-top:6px}
.avbtns{display:flex;gap:8px;flex-wrap:wrap}
.av-lg{width:72px;height:72px;font-size:30px}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.hav{width:30px;height:30px;font-size:15px;flex:none}
.av{overflow:hidden;width:48px;height:48px;border-radius:50%;background:var(--user-bg);display:grid;place-items:center;font-size:22px;flex:none;font-family:var(--font-serif);font-weight:700;color:var(--accent)}
.row .meta{flex:1;min-width:0}
.row .nm{font-weight:700}
.row .pv{color:var(--soft);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:48px 24px;text-align:center;color:var(--soft)}
.empty p{font-family:var(--font-serif);font-size:18px;color:var(--ink);margin:0 0 6px}
.fab{margin:4px 16px 16px;align-self:stretch}
.ver-now{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:20px}
.ver-now .big{font-family:var(--font-serif);font-size:22px;font-weight:700}
.ver-now .st{color:var(--soft);font-size:14px;margin:4px 0 12px}
.ver-now .st.new{color:var(--accent);font-weight:700}
.ver-now .btns{display:flex;gap:8px}
.ver-now .btns .btn{flex:1}
.cl{margin:0 0 18px}
.cl h3{font-size:15px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.cl h3 .tag{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--user-bg);color:var(--accent)}
.cl ul{margin:0;padding-left:20px;color:var(--soft);font-size:14px}

@font-face{font-family:NeoDunggeunmo;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.3/NeoDunggeunmo.woff') format('woff');font-weight:400;font-display:swap}
.phone-status{display:none}
/* ---- 소설 배경 사진 ---- */
.nbgrow{display:flex;align-items:center;gap:14px;margin-top:6px}
.bgprev{position:relative;width:96px;height:170px;border-radius:14px;overflow:hidden;flex:0 0 auto;background:var(--panel) center/cover no-repeat;border:1px solid var(--line)}
.bgprev i{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.bgprev i::before{content:"";position:absolute;left:12px;right:12px;top:30px;height:34px;background:repeating-linear-gradient(180deg,rgba(235,235,240,.8) 0 2px,transparent 2px 9px)}
.bgprev i::after{content:"";position:absolute;left:12px;right:28px;top:78px;height:11px;background:repeating-linear-gradient(180deg,#F4F4F8 0 2px,transparent 2px 9px)}
.bgprev span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px}
/* 배경 사진 — 어두운 막을 덮고 밝은 글씨를 얹는다 (원본 방식) */
body[data-novelbg]{background:#0c0c10 !important;background-image:none !important}
body[data-novelbg]::after{content:"";position:fixed;inset:-30px;z-index:0;pointer-events:none;background-image:var(--novelbg);background-size:cover;background-position:center;background-repeat:no-repeat}
body[data-novelbg] .app{z-index:2;isolation:isolate;background:transparent !important;border:0 !important;box-shadow:none !important}
body[data-novelbg] .app::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:rgba(0,0,0,.45)}
body[data-novelbg] #chat,body[data-novelbg] .log{background:transparent !important;background-image:none !important;box-shadow:none !important}
body[data-novelbg] .log .msg.char .body{background:transparent !important;border:0 !important;box-shadow:none !important}
body[data-novelbg] .log :is(.body,.nline,.thinking,.ooc,.who){color:#F4F4F8;text-shadow:0 1px 2px rgba(0,0,0,.55),0 0 1px rgba(0,0,0,.45)}
body[data-novelbg] .log .narr{color:rgba(232,232,240,.80);font-style:italic}
body[data-novelbg] .log .say{color:var(--saycol,#F4F4F8);text-shadow:none}
body[data-novelbg] .log .spk{color:#F4F4F8}
body[data-novelbg] .log .gloss{color:rgba(232,232,240,.75)}
body[data-novelbg] .log .nline{color:rgba(230,230,238,.8)}
body[data-novelbg] .log .thinking{color:rgba(230,230,238,.75)}
body[data-novelbg] .log .typing{color:rgba(230,230,238,.75)}
body[data-novelbg] .log .ooc{color:rgba(230,230,238,.7);border-color:rgba(255,255,255,.3)}
body[data-novelbg] .log .msg.user .body{background:rgba(255,255,255,.12) !important;border:0 !important;box-shadow:none !important}
body[data-novelbg] .log .acts button{background:rgba(20,20,26,.55);border-color:rgba(255,255,255,.18);color:#F1F1F5}
body[data-novelbg] #chat header.bar{background:transparent !important;background-image:none !important;backdrop-filter:none !important;-webkit-backdrop-filter:none !important;border-bottom:0 !important;box-shadow:none !important}
body[data-novelbg] #chat header.bar :is(h2,.icon){color:#F4F4F8 !important;text-shadow:0 1px 3px rgba(0,0,0,.6)}
body[data-novelbg] #chat .phone-status{display:none !important}
body[data-novelbg] #chat .composer{background:#17171C !important;background-image:none !important;backdrop-filter:none !important;-webkit-backdrop-filter:none !important;border-color:rgba(255,255,255,.08) !important;box-shadow:none !important}
body[data-novelbg] #chat .composer .quick button{background:transparent;border-color:rgba(255,255,255,.14);color:rgba(230,230,238,.62) !important;font-family:inherit}
body[data-novelbg] #chat .composer textarea{background:#26262D !important;color:#F1F1F5 !important;border:1px solid rgba(255,255,255,.08) !important;box-shadow:none !important}
body[data-novelbg] #chat .composer textarea::placeholder{color:rgba(230,230,238,.45)}
body[data-novelbg] #send{background:#F1F1F5 !important;color:#17171C !important;border:0 !important;box-shadow:none !important}

.searchwrap{padding:0 16px 10px}
.searchwrap input{width:100%}
select{width:100%}
.backup{display:flex;justify-content:center;gap:8px;padding-top:8px}
.backup .icon{font-size:13px}

/* editor */
.form{flex:1;overflow-y:auto;padding:16px 16px 32px}
fieldset{border:0;margin:0 0 22px;padding:0}
legend{font-family:var(--font-serif);font-weight:700;font-size:17px;padding:0;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--soft);margin:12px 0 5px}
input[type=text],textarea,select{width:100%;font-size:16px;background:var(--field,var(--panel));border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
textarea{min-height:90px;line-height:1.55}
textarea.tall{min-height:180px}
.hint{font-size:12px;color:var(--soft);margin-top:4px}
.two{display:grid;grid-template-columns:80px 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--panel);padding:9px 4px;font-size:14px;color:var(--soft)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.actions{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.actions .btn{flex:1}

/* chat */
.log{flex:1;overflow-y:auto;padding:18px 16px 8px}
button,.quick button,.icon{touch-action:manipulation}
.msg{margin:0 0 18px}
.mrow{display:flex;gap:10px;align-items:flex-start}
.mcol{flex:1;min-width:0}
.mav{width:38px;height:38px;font-size:17px}
.mrow .mcol>.who{margin:3px 0 7px 2px;line-height:1.3}
.msg.char .body{background:var(--char-bg);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:14px 16px}
.msg.user{display:flex;flex-direction:column;align-items:flex-end}
.msg.user .body{background:var(--user-bg);border-radius:17px 4px 17px 17px;padding:9px 13px;max-width:85%;width:fit-content;line-height:1.85;letter-spacing:-.004em}
.msg.user .body p{margin:0}
.msg.user .body p+p{margin-top:.35em}
.who{font-size:13px;color:var(--soft);margin:6px 0 6px 2px;font-weight:500}
.body p{margin:0 0 .7em}
.body p:last-child{margin-bottom:0}
.gloss{color:var(--faint);font-size:.92em}
.log:not(.pron-on) .pron,.log:not(.pron-on) .glc{display:none}
.log:not(.trans-on) .trans,.log:not(.trans-on) .glc{display:none}
.log:not(.pron-on):not(.trans-on) .gloss{display:none}
.tcard{background:#f3f4f6;border:1.5px solid #d9dbe0;border-radius:18px;overflow:hidden;margin:0 0 10px;color:#1f2329;font-family:-apple-system,"Noto Sans KR",sans-serif}
.thead{padding:18px 18px 14px;border-bottom:1px solid #d9dbe0}
.tpill{display:inline-block;background:#dfe3f7;color:#3949b5;font-size:13px;font-weight:600;padding:5px 11px;border-radius:9px}
.ttitle{font-size:18px;font-weight:700;margin:12px 0 6px}
.tmeta{font-size:13px;color:#7a7f89}
.tbody{padding:14px 18px 18px;font-size:var(--card-fs,15px);line-height:1.75}
.tsec{margin-top:4px}
.tent{margin-top:2px}
.trow{}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 10px;font-size:var(--card-fs,15px)}
.card .ctitle{font-size:12px;letter-spacing:.06em;color:var(--accent);font-weight:700;margin-bottom:8px}
.crow{margin:0 0 6px;line-height:1.65}
.crow:last-child{margin-bottom:0}
.clab{color:var(--soft);font-size:.88em;margin-right:8px}
.paper{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.07);margin:0 0 10px;color:var(--ink);font-size:calc(var(--card-fs,15px) * 1.1);padding:19px 20px 22px}
.paper .ruled{line-height:1.9em;background-image:repeating-linear-gradient(180deg,transparent 0,transparent calc(1.9em - 1px),var(--line) calc(1.9em - 1px),var(--line) 1.9em);background-position:0 0;background-repeat:repeat;white-space:pre-wrap}
.paper.letter .lto{line-height:1.9em;margin:0 0 1.9em}
.paper.letter .lsign{display:block;text-align:right;line-height:1.9em;margin:1.9em 0 0}
.paper.diary{padding:16px 20px 22px}
.paper.diary .dhead{display:flex;align-items:baseline;gap:10px;font-size:.92em;color:var(--soft);padding-bottom:9px;margin-bottom:11px;border-bottom:1.5px solid var(--line)}
.paper.diary .dhead .wd{font-size:.8em}
.card.hand{font-family:"Nanum Pen Script",var(--font-serif);font-size:1.3em;line-height:32px;padding:14px 16px 18px;background-image:repeating-linear-gradient(transparent,transparent 31px,var(--line) 31px,var(--line) 32px);background-position:0 40px;background-repeat:repeat}
.card.hand .crow{margin-bottom:0}
.card.hand .clab{font-size:.7em}
.fmt-novel .body.inner,.fmt-script .body.inner{background:none !important;border:0 !important;box-shadow:none !important;padding:0 2px !important;max-width:100%}
.body.inner{font-style:italic;color:var(--narr);white-space:pre-wrap;line-height:1.75}
.ooc{margin:0 0 4px;padding:9px 13px;border-radius:12px;border:1px dashed var(--line);color:var(--soft);font-size:14px;white-space:pre-wrap}
.msg.user.oocu{display:block}
.msg.user.oocu .ooc{width:100%}
.nline{color:var(--soft);font-style:italic;font-family:var(--font-serif);margin:4px 2px 12px;line-height:1.75;font-size:.96em}
.msg.user.unov{display:block;margin:30px 0;padding:26px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.unov .np{margin:0 0 .6em;line-height:1.75}
.unov .np:last-child{margin:0}
.unov .nn{color:var(--narr)}
.unov .ns{color:var(--ink)}
.unov .ncmd{color:var(--soft)}
.unov .acts{justify-content:flex-start}
body[data-novelbg] .msg.user.unov{border-color:rgba(255,255,255,.2)}
body[data-novelbg] .unov .ns,body[data-novelbg] .unov .ncmd{color:#F4F4F8;text-shadow:0 1px 2px rgba(0,0,0,.55)}
body[data-novelbg] .unov .nn{color:rgba(232,232,240,.80);text-shadow:0 1px 2px rgba(0,0,0,.55)}
.spk{font-weight:700;color:var(--accent)}
.bar{color:var(--soft);margin:0 8px}
.fmt-novel .msg.char .body,.fmt-script .msg.char .body{background:none;border:0;padding:0 2px}
.fmt-novel .msg.char .body{line-height:1.85}
.fmt-novel .body p,.fmt-script .body p{margin:0 0 .9em}
.fmt-novel .narr,.fmt-script .narr{color:var(--soft)}
.narr{font-family:var(--font-serif);color:var(--narr);line-height:1.8;font-style:italic}
.fmt-novel .narr,.fmt-script .narr,body[data-novelbg] .log .narr{font-style:normal}
.say{color:var(--ink)}
.tools{display:none}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0}
.msg.user .acts{justify-content:flex-end}
.acts button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px;padding:8px 16px;font-size:14px}
.acts button.red{color:var(--danger)}
.msg{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.multi{margin:0 0 12px}
.hcol{flex:1;min-width:0}
.hcol h2{margin:0;font-size:16px}
.hsub{font-size:12px;color:var(--soft)}
.lore-tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.lore-tabs::-webkit-scrollbar{display:none}
.lore-tabs button{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:8px 13px;white-space:nowrap}
.lore-tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lore-tabs button span{opacity:.6;margin-left:3px}
.lore-entry{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:10px}
.lore-entry>summary{display:flex;align-items:center;gap:12px;padding:15px 16px;cursor:pointer;list-style:none;min-height:58px}
.lore-entry>summary::-webkit-details-marker{display:none}
.lore-entry>summary:before{content:"›";font-size:24px;line-height:1;color:var(--soft);flex:0 0 auto;transition:transform .15s}
.lore-entry[open]>summary:before{transform:rotate(90deg)}
.lore-entry[open]>summary{border-bottom:1px solid var(--line)}
.lore-peek{display:flex;align-items:baseline;gap:9px;min-width:0;flex:1;font-size:13px}
.lore-peek b{flex:0 1 auto;max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lore-peek>span{color:var(--soft);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.lore-fields{padding:5px 16px 16px}
.lore-fields .btn{width:100%;margin-top:12px}
.sumbox{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:0 0 8px}
.sumbox b{display:block;font-weight:600}
.sumbox span{display:block;font-size:13px;color:var(--soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addbtn{width:100%}
.sublabel{font-size:13px;color:var(--soft);margin:18px 0 8px;font-weight:600}
.sublog{display:flex;flex-direction:column;gap:6px}
.subline{display:flex;flex-direction:column;align-items:flex-start}
.subline.mine{align-items:flex-end}
.subline .nline{margin:4px 2px 8px}
.sbub{background:var(--char-bg);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:9px 13px;max-width:88%;width:fit-content;line-height:1.6}
.sbub p{margin:0 0 .5em}
.sbub p:last-child{margin:0}
.subline.mine .sbub{background:var(--user-bg);border:0;border-radius:14px 4px 14px 14px}
.acts.r{justify-content:flex-end}
.whochips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px}
.whochips button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:7px 14px;white-space:nowrap;color:var(--ink)}
.whochips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--soft);margin-bottom:4px}
.msg.user .mrow{align-self:stretch;width:100%}
.urow .mcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-end}
.msg.user .body{word-break:keep-all;overflow-wrap:anywhere}
.msg.user .tools{justify-content:flex-end}
.tools .icon{font-size:12px;padding:3px 7px}
.typing{color:var(--soft);font-size:14px;padding:4px 2px 2px}
.msg.char .body.typbub{width:fit-content;padding:9px 14px}
.body.typbub .typing{padding:0}
.typing .dots{display:inline-block;width:1.3em;text-align:left}
.typing .dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@media (prefers-reduced-motion:reduce){.typing .dots::after{animation:none;content:"..."}}
.thinking{color:var(--soft);font-size:14px}
.thinking::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@media (prefers-reduced-motion:reduce){.thinking::after{animation:none;content:"..."}}
.err{color:var(--danger);font-size:13px;margin:-8px 0 16px}
.edit-area{width:100%;min-height:120px;font-size:16px}
.composer{border-top:1px solid var(--line);padding:10px 12px calc(env(safe-area-inset-bottom,0px) * var(--sab,1) + 10px);background:var(--bg)}
body[data-kb="1"] .composer{padding-top:6px;padding-bottom:6px}
.composer .quick{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.composer .quick::-webkit-scrollbar{display:none}
.composer .quick button{flex:none}
.composer .quick button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--soft);white-space:nowrap}
.composer .in{display:flex;gap:8px;align-items:flex-end}
.composer textarea{font-size:max(var(--font-size),16px);min-height:44px;max-height:160px;resize:none;border-radius:14px}
.composer .btn{padding:10px 14px;border-radius:14px;flex:none}
.banner{margin:12px 16px 0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--soft);background:var(--panel)}
/* ---- 예전 앱(v46g) 카드 ---- */
@font-face{font-family:"HandKonkon";font-display:swap;src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/2412-1@1.0/Ownglyph_corncorn-Rg.woff2") format("woff2")}
.oc{--field:color-mix(in srgb,var(--ink) 4%,var(--panel));--text:var(--ink);--muted:var(--soft);--mine:var(--user-bg);--nar:var(--narr);
  --paper:#FCFBF8;--paper-line:#E2DFD6;--paper-text:#2F2C27;--paper-rule:rgba(110,115,135,.15);
  --cfs:var(--card-fs,14px);--fs:var(--font-size,15px);--f-nar:"Noto Serif KR",serif;color:var(--ink)}
:root[data-theme="lcd"] .oc,:root[data-theme="flip"] .oc{--field:var(--panel)}
:root[data-theme="night"] .oc,:root[data-theme="dark"] .oc{--paper:#1A1A22;--paper-line:#2E2E3A;--paper-text:#DEDCE6;--paper-rule:rgba(190,195,220,.13)}
.oc .tr{color:var(--muted);font-size:.88em}
.oc .mind em{font-family:var(--f-nar);font-style:italic;font-weight:300;opacity:.82}
.oc .paper{position:relative;background:var(--paper);border:1px solid var(--paper-line);border-radius:14px;padding:18px 18px 20px;margin:10px 0;font-family:var(--f-nar);font-weight:300;color:var(--paper-text);line-height:2;white-space:pre-wrap;box-shadow:none;min-width:0;max-width:100%;overflow-wrap:anywhere;word-break:normal}
.oc .paper.letter,.oc .paper.diary{background-color:var(--paper);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.07)}
.oc .paper.letter{padding:19px 20px 22px}
.oc .paper.diary{padding:16px 20px 22px}
.oc .paper .ruled{line-height:var(--rlh,25px);white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;
  background-image:repeating-linear-gradient(180deg,transparent 0,transparent calc(var(--rlh,25px) - 1px),var(--paper-rule) calc(var(--rlh,25px) - 1px),var(--paper-rule) var(--rlh,25px));
  background-position:0 0;background-repeat:repeat}
.oc .paper .ruled em{line-height:inherit;font-size:1em}
.oc .paper .lto,.oc .paper .lsign{white-space:pre-wrap;overflow-wrap:anywhere}
.oc .paper.letter .lto{font-family:inherit;font-weight:400;line-height:var(--rlh,25px);margin:0 0 var(--rlh,25px);letter-spacing:.01em}
.oc .paper.letter .lsign{display:block;text-align:right;line-height:var(--rlh,25px);margin:var(--rlh,25px) 0 0;font-weight:400;letter-spacing:.01em}
.oc .paper.diary .dhead{display:flex;align-items:baseline;gap:10px;font-family:inherit;font-weight:400;font-size:.92em;color:var(--muted);padding-bottom:9px;margin-bottom:11px;border-bottom:1.5px solid var(--paper-line)}
.oc .paper.diary .dhead .wd{font-weight:400;font-size:12px}
.oc .paper.letter em,.oc .paper.diary em{font-family:inherit;font-style:inherit;font-weight:inherit}
.oc .paper .lbody{min-width:0}
.oc .comm{background:var(--field);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin:12px 0;font-size:var(--cfs);line-height:1.6}
.oc .comm .ctag{display:inline-block;padding:3px 9px;border-radius:7px;font-size:11.5px;background:var(--mine);color:var(--text);margin-bottom:9px}
.oc .comm .ctit{font-weight:700;font-size:calc(var(--cfs) + 1px);line-height:1.45}
.oc .comm .cinfo{font-size:11.5px;color:var(--muted);margin-top:5px}
.oc .comm .cbody{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);white-space:pre-wrap;word-break:break-all}
.oc .comm .chead{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.oc .comm .crow{padding:9px 0;margin:0;line-height:1.6;border-top:1px solid var(--line)}
.oc .comm .crow:first-of-type{border-top:0}
.oc .comm .cwho{display:flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px;color:var(--muted);margin-bottom:3px}
.oc .comm .cup{margin-left:auto;color:#D9534F;font-weight:700;font-size:12px}
.oc .comm .cup::before{content:"▲ ";font-size:9px;vertical-align:1px}
.oc .comm .cup.dn{color:#4A7FB5}
.oc .comm .cup.dn::before{content:"▼ "}
.oc .comm .crow.re{padding-left:16px;position:relative}
.oc .comm .crow.re::before{content:"";position:absolute;left:4px;top:12px;bottom:10px;width:2px;border-radius:1px;background:var(--line)}
.oc .comm .crow.re .cwho{opacity:.85}
.oc .comm .cre{color:var(--accent);font-weight:600}
.oc .comm .ctx{white-space:pre-wrap;word-break:break-all}
.oc .comm,.oc .insta{font-family:"Noto Sans KR",sans-serif}
.oc .ord{font-family:"Pretendard Variable",Pretendard,-apple-system,sans-serif}
.oc .statc{font-family:"Do Hyeon",sans-serif}
.oc .pl{font-family:"Gothic A1",sans-serif}
.oc .comm .csite{font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:8px;letter-spacing:.02em}
.oc .comm[data-site="디시"] .ctag{background:#3b4a63;color:#e8eef7}
.oc .comm[data-site="카페"] .ctag{background:#e6f0dd;color:#41662c}
.oc .comm[data-site="카페"] .cup{color:#4f8c3a}
.oc .comm[data-site="에타"] .ctag{background:#dff0e4;color:#2f6b42}
.oc .comm[data-site="에타"] .cup{color:#3f9d5c}
.oc .statc{background:var(--field);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0}
.oc .statc .pt{font-size:11.5px;letter-spacing:.06em;color:var(--muted);margin-bottom:9px}
.oc .statc .row{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:calc(var(--fs) - 1.5px);line-height:1.6}
.oc .statc .row:first-of-type{border-top:0}
.oc .statc .row b{flex:0 0 30%;font-weight:600;color:var(--muted)}
.oc .statc .row span{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}
.oc .statc .row.full{display:block;color:var(--text)}
.oc .mind,.oc .paper,.oc .statc{font-size:var(--cfs);line-height:1.75}
.oc .paper{line-height:2}
.oc .mind{background:var(--field);border:1px solid var(--line);border-radius:18px;padding:15px 17px;margin:11px 0;font-family:var(--f-nar);font-style:italic;font-weight:300;color:var(--nar);white-space:pre-wrap}
.oc .ord{background:var(--field);border:1px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden;font-size:var(--cfs)}
.oc .ord .ohd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:13px 16px 12px;border-bottom:1px solid var(--line)}
.oc .ord .ohd b{font-size:1em;font-weight:700;letter-spacing:-.01em}
.oc .ord .ohd i{font-style:normal;font-size:.82em;color:var(--muted)}
.oc .ord .orow{display:flex;align-items:flex-start;gap:12px;padding:12px 16px}
.oc .ord .orow+.orow{border-top:1px solid var(--line)}
.oc .ord .omain{flex:1;min-width:0}
.oc .ord .onm{font-size:.98em;line-height:1.42;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.oc .ord .osub{font-size:.8em;color:var(--muted);margin-top:5px;line-height:1.4}
.oc .ord .oright{flex:0 0 auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.oc .ord .opr{font-size:.98em;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.oc .ord .ost{font-size:.74em;line-height:1;padding:4px 8px;border-radius:99px;white-space:nowrap;background:var(--line);color:var(--muted)}
.oc .ord .ost.on{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.oc .memo{background:#FFF9D9;border:1px solid rgba(0,0,0,.07);border-radius:4px;padding:14px 16px 12px;margin:10px 0;max-width:80%;box-shadow:0 2px 6px rgba(0,0,0,.09);font-size:var(--cfs);color:#3a3526}
.oc .memo.me{background:#E8F1FB;margin-left:auto}
.oc .memo .mbody{line-height:1.75;white-space:pre-wrap}
.oc .memo .mwhere{font-size:.75em;opacity:.45;margin-top:10px;text-align:right}
:root[data-theme="night"] .oc .memo,:root[data-theme="dark"] .oc .memo{background:#3A3524;color:#EDE6CC;border-color:rgba(255,255,255,.08)}
:root[data-theme="night"] .oc .memo.me,:root[data-theme="dark"] .oc .memo.me{background:#24313F;color:#DCE7F2}
.oc .rv{background:var(--field);border:1px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden;font-size:var(--cfs)}
.oc .rv .rvhd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:13px 16px 12px;border-bottom:1px solid var(--line)}
.oc .rv .rvhd b{font-size:1em;font-weight:700;letter-spacing:-.01em}

.oc .rv .rvsite{font-size:.74em;line-height:1;display:inline-block;padding:4px 8px;border-radius:99px;background:var(--line);color:var(--muted);margin-bottom:7px}

.oc .rv .rvopt{font-size:.8em;color:var(--muted);margin-top:4px;line-height:1.4}
.oc .rv .rvstars{display:flex;align-items:center;gap:1px;margin-top:7px;font-size:.95em}
.oc .rv .rvstars .rs{color:var(--line)}
.oc .rv .rvstars .rs.on{color:#FFC107}
.oc .rv .rvstars i{font-style:normal;font-size:.78em;color:var(--muted);margin-left:8px}
.oc .rv .rvbody{margin-top:8px;font-size:.92em;line-height:1.65}
.oc .pl{background:var(--field);border-radius:16px;padding:6px 4px;margin:10px 0}
.oc .pl a{display:block;padding:10px 14px;text-decoration:none;color:inherit;border-bottom:1px solid var(--line)}
.oc .pl a:last-child{border-bottom:0}
.oc .pl .t{font-size:15px;font-weight:600}
.oc .pl .ar{font-size:13px;color:var(--muted)}
.oc .pl .rs{font-size:12.5px;color:var(--nar);margin-top:3px;font-style:italic}
.oc .pl.wl .wrow{padding:10px 14px;border-bottom:1px solid var(--line)}
.oc .pl.wl .wrow:last-child{border-bottom:0}
.oc .pl.wl .t{font-size:13.5px;font-weight:600;line-height:1.45}
.oc .pl.wl .ar{font-size:12px;margin-top:2px}
.oc .pl.wl .rs{font-size:12px}
.oc .detail-card,.oc .insta{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden;font-size:var(--cfs);line-height:1.75;overflow-wrap:anywhere}

.oc .detail-item+.detail-item{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.oc .detail-item p{margin:5px 0;white-space:pre-wrap}
.oc .detail-item b{display:block;font-size:.85em;color:var(--muted);font-weight:500}
.oc .detail-item .detail-lead span{font-weight:600;color:var(--text)}
.oc .ig-profile{display:flex;align-items:center;gap:12px;padding:16px}
.oc .ig-profile>div{min-width:0}
.oc .ig-profile .av{flex-shrink:0}
.oc .ig-profile b{font-size:15px}
.oc .ig-profile div div,.oc .ig-meta{font-size:12px;color:var(--muted)}

.oc .ig-photo p{max-width:32em;margin:12px 0 0}
.oc .ig-caption{padding:14px 16px 18px}

.oc .ig-when{font-size:11px;color:var(--muted);margin:6px 0 0;letter-spacing:.02em}

.oc .ig-post+.ig-post{border-top:1px solid var(--line)}
:root:is([data-theme="lcd"],[data-theme="flip"]) .oc :is(.statc,.mind,.detail-card,.insta,.ord,.comm){border-radius:3px;border:1px solid var(--line);background:var(--panel);box-shadow:2px 2px 0 #40557418}

<script type="text/plain" id="phoneSrc">
/* =========================================================================
   핸드폰 (밤편지용, 핸드폰 v139 기반)
   내 폰 / 캐릭터 폰 / 모브 대화 — 세 갈래로 나뉜 메신저 엿보기 도구
   ========================================================================= */
(() => {
  'use strict';

  const NS = '__ZETATALK_V1__';
  const APP_ID = 'zetatalk-v1-app';
  const STYLE_ID = 'zetatalk-v1-style';
  const K_SET = 'zetatalk.v8.settings';
  function scope() {
    return (window.BamPhone && window.BamPhone.scope()) || 'default';
  }
  const K_ROOM = 'zetatalk.v8.rooms.' + scope();
  const K_CAV = 'zetatalk.v8.charav.' + scope();
  const K_LORE = 'zetatalk.v8.lore.' + scope();
  const K_APPS = 'zetatalk.v8.apps.' + scope();
  const K_QNA = 'zetatalk.v8.qna.' + scope();

  try { window[NS] && window[NS].destroy && window[NS].destroy(); } catch (e) {}

  /* ── 저장소 ────────────────────────────────────────────────────────── */
  const DEFAULTS = {
    provider: 'gemini', apiUrl: '', apiKey: '', model: '',
    maxTokens: 2000, turns: 16, persona: '', selector: '',
    theme: 'kakao', fontPx: 15.5, dark: false, sendImage: false, myAvatar: '',
    lang: '', appLang: '', trans: false, nShop: 6, nPay: 6, nMusic: 6, nSearch: 5, nRoom: 6
  };
  const PRESET = {
    openai:     { url: 'https://api.openai.com/v1', model: 'gpt-4o-mini' },
    openrouter: { url: 'https://openrouter.ai/api/v1', model: '' },
    gemini:     { url: 'https://generativelanguage.googleapis.com/v1beta/openai', model: 'gemini-2.5-flash' },
    claude:     { url: 'https://api.anthropic.com', model: 'claude-sonnet-5' },
    custom:     { url: '', model: '' }
  };

  const load = (k, d) => {
    try { const r = window.BamKV.getItem(k); return r ? JSON.parse(r) : d; } catch (e) { return d; }
  };
  let S = Object.assign({}, DEFAULTS, load(K_SET, {}));
  if (window.BamPhone && !S.apiKey) { try { Object.assign(S, window.BamPhone.api() || {}); } catch (e) {} }
  if (S.theme === 'galaxy' || S.theme === 'insta') S.theme = 'kakao';

  const BAD_NAME = /^(user|유저|나|저|me|you|사용자|guest|assistant|캐릭터|char)$/i;

  let _userName = '';
  function detectUser() {
    if (_userName) return _userName;
    const tally = {};
    for (const t of extract()) {
      if (t.who !== 'user' || !t.name) continue;
      tally[t.name] = (tally[t.name] || 0) + 1;

    // 저장소에는 다른 방 프로필까지 섞여 있어 엉뚱한 이름이 걸린다
    const got = Object.keys(tally)
      .sort((a, b) => tally[b] - tally[a])
      .find(n => !BAD_NAME.test(n)) || '';

    if (window.BamPhone) return;

  function fromChatDOM() {
    const fn = window.ZetaChatDOM && window.ZetaChatDOM.extractLoadedRecords;
    if (typeof fn !== 'function') return null;
    let recs;
    try { recs = fn({ root: document, exclude: [], includeStatus: false }); }
    catch (e) { return null; }
    if (!Array.isArray(recs) || !recs.length) return null;
    const turns = recs.map(r => {
      const role = String(r.role || r.type || '').toLowerCase();
      if (role === 'image') return null;
      const text = String(r.text || '').trim();
      if (text.length < 2) return null;
      return { who: role === 'user' ? 'user' : 'char', name: String(r.name || '').trim(), text };
    }).filter(Boolean);
    return turns.length ? turns : null;
  }

  const sigOf = el => {
    const c = (typeof el.className === 'string' ? el.className : '')
      .trim().split(/\s+/).filter(Boolean).slice(0, 3).join('.');
    return el.tagName + (c ? '.' + c : '');
  };

  function autoDetect() {
    const groups = new Map();
    for (const el of document.querySelectorAll('div,li,article,section,p')) {
      if (el.closest('#' + APP_ID)) continue;
      const t = (el.innerText || '').trim();
      if (t.length < 2 || t.length > 4000 || el.children.length > 8) continue;
      const r = el.getBoundingClientRect();
      if (r.width < 40 || r.height < 12) continue;
      const s = sigOf(el);
      if (!groups.has(s)) groups.set(s, []);
      groups.get(s).push(el);
    }
    let best = null, top = 0;
    for (const [sig, els] of groups) {
      if (els.length < 3) continue;
      const sc = els.reduce((n, e) => n + (e.innerText || '').trim().length, 0) * Math.min(els.length, 40);
      if (sc > top) { top = sc; best = els; }
    }
    return best;
  }

  function extract() {
    if (window.BamPhone) return window.BamPhone.turns();
    const viaModule = fromChatDOM();
    if (viaModule) return viaModule;
    let els = [];
    if (S.selector) {
      try { els = [...document.querySelectorAll(S.selector)].filter(e => !e.closest('#' + APP_ID)); }
      catch (e) { els = []; }
    }
    if (!els.length) els = autoDetect() || [];
    els = els.filter(el => !els.some(o => o !== el && el.contains(o)));
    if (!els.length) return [];
    els.sort((a, b) =>
      (a.compareDocumentPosition(b) & Node.DOCUMENT_POSITION_FOLLOWING) ? -1 : 1);
    const cx = els.map(e => { const r = e.getBoundingClientRect(); return r.left + r.width / 2; });
    const mid = [...cx].sort((a, b) => a - b)[Math.floor(cx.length / 2)];
    return els.map((e, i) => ({
      who: cx[i] > mid + 12 ? 'user' : 'char', name: '',
      text: (e.innerText || '').replace(/\s+\n/g, '\n').trim()
    })).filter(t => t.text.length >= 2);
  }

  // 화면에 있는 프사와 이름을 짝지어 둔다
  // 단역과 기본 아이콘은 걸러서, 진짜 프사가 있는 인물만 담는다
  const EXTRA_NAME = /^(.*?)(하객|손님|행인|시민|남자|여자|점원|직원|팀원|학생|사람|기자|경비|주민|관객|무리|일동|사원|병사|부하|모브|npc|npc\d*)\s*\d*$/i;
  const DEFAULT_PIC = /(default|placeholder|anonymous|avatar[-_]?(?:default|none|empty)|no[-_]?image|blank|person|user[-_]?icon|profile[-_]?default)/i;

  function isDefaultPic(img) {
    const src = String(img.currentSrc || img.src || '');
    if (!src) return true;
    if (DEFAULT_PIC.test(src)) return true;
    if (src.startsWith('data:image/svg')) return true;
    // 실제로 그려 보고 색이 거의 없으면 기본 아이콘으로 본다
    try {
      const cv = document.createElement('canvas');
      cv.width = 12; cv.height = 12;
      const g = cv.getContext('2d');
      g.drawImage(img, 0, 0, 12, 12);
      const d = g.getImageData(0, 0, 12, 12).data;
      let sat = 0, n = 0;
      for (let i = 0; i < d.length; i += 4) {
        const mx = Math.max(d[i], d[i + 1], d[i + 2]);
        const mn = Math.min(d[i], d[i + 1], d[i + 2]);
        if (mx) sat += (mx - mn) / mx;
        n++;
      }
      return n ? (sat / n) < 0.08 : false;
    } catch (e) { return false; }   // 다른 도메인 사진이면 읽지 못한다. 그건 진짜 사진이다
  }

  let _picMap = null;
  function charPicMap() {
    if (window.BamPhone) { const m = {}, n = window.BamPhone.charName(), a = window.BamPhone.charAvatar(); if (n && a) m[n] = a; _picMap = m; return m; }
    if (_picMap) return _picMap;
    const map = {};

  /* ── API ───────────────────────────────────────────────────────────── */
  const clean = v => String(v == null ? '' : v)
    .replace(/[\u200B-\u200D\uFEFF]/g, '').replace(/\s+/g, '').trim();
  const baseUrl = () =>
    clean(S.provider === 'custom' ? S.apiUrl : PRESET[S.provider].url).replace(/\/+$/, '');

  let lastMode = '';
  let tokenBoost = 0;
  async function callLLM(system, user, images) {
    const key = clean(S.apiKey);
    if (!key) throw new Error('설정에서 API Key를 입력하세요');
    const base = baseUrl();
    if (!base) throw new Error('설정에서 API URL을 입력하세요');
    const model = clean(S.model) || PRESET[S.provider].model;
    if (!model) throw new Error('설정에서 모델 이름을 입력하세요');

    const pics = (S.sendImage && images && images.length) ? images : [];
    let res;

    if (S.provider === 'claude') {
      const content = [{ type: 'text', text: user }];
      for (const d of pics) {
        const m = /^data:(image\/[a-z]+);base64,(.+)$/i.exec(d);
        if (m) content.push({ type: 'image', source: { type: 'base64', media_type: m[1], data: m[2] } });
      }
      res = await fetch(base + '/v1/messages', {
        method: 'POST',
        headers: {
          'content-type': 'application/json', 'x-api-key': key,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model, max_tokens: Math.max(Number(S.maxTokens) || 2000, tokenBoost), system,
          messages: [{ role: 'user', content }]
        })
      });
      if (!res.ok) throw new Error(res.status + ' · ' + (await res.text()).slice(0, 220));
      const d = await res.json();
      lastMode = '표준';
      return (d.content || []).map(b => b.text || '').join('\n').trim();
    }

    const userContent = pics.length
      ? [{ type: 'text', text: user }].concat(pics.map(u => ({ type: 'image_url', image_url: { url: u } })))
      : user;
    const body = JSON.stringify({
      model, max_tokens: Math.max(Number(S.maxTokens) || 2000, tokenBoost),
      messages: [{ role: 'system', content: system }, { role: 'user', content: userContent }]
    });
    const url = /\/chat\/completions$/.test(base) ? base : base + '/chat/completions';

    try {
      res = await fetch(url, {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'authorization': 'Bearer ' + key },
        body
      });
      lastMode = '표준';
    } catch (e1) {
      try {
        res = await fetch(url + '?key=' + encodeURIComponent(key), {
          method: 'POST', headers: { 'content-type': 'text/plain;charset=UTF-8' }, body
        });
        lastMode = '우회';
      } catch (e2) {
        throw new Error('서버에 닿지 못했습니다. 두 가지 방식 모두 막혔습니다.\n' +
          '이 서버가 zeta-ai.io 에서 오는 스크립트 요청을 허용하지 않는 것 같습니다.');
      }
    }
    if (!res.ok) throw new Error(res.status + ' · ' + (await res.text()).slice(0, 220));
    const d = await res.json();
    return (d.choices?.[0]?.message?.content || '').trim();
  }

  function parseJSON(raw, what) {
    const s = String(raw || '').replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
    const pick = v => {
      if (Array.isArray(v)) return v;
      if (v && typeof v === 'object') {
        for (const k of Object.keys(v)) if (Array.isArray(v[k])) return v[k];
      }
      return null;
    };
    try {
      const got = pick(JSON.parse(s));
      if (got) return got;
    } catch (e) {}
    const m = s.match(/\[[\s\S]*\]/);
    if (m) { try { return JSON.parse(m[0]); } catch (e) {} }
    // 응답이 중간에 잘렸을 때 — 온전한 덩어리만 골라낸다
    const chunks = s.match(/\{[^{}]*\}/g);
    if (chunks) {
      const out = [];
      for (const c of chunks) { try { out.push(JSON.parse(c)); } catch (e) {} }
      if (out.length) return out;
    }
    throw new Error((what || '응답') + '을 읽지 못했습니다 · ' +
      (s ? s.slice(0, 200) : '빈 응답이 왔습니다'));
  }

    : '';

  // 앱 목록에 쓰는 언어 지시. 여기서는 상품명·검색어도 그 나라 말로 적는다

  // 이름과 대사를 그 나라 말로 쓰게 한다
  function langBlock(lg, tr) {

    ];
    if (tr) out.push(
      '- 그리고 메시지마다 한국어 번역을 tr 칸에 함께 적는다.',
      '  text 칸에는 번역을 넣지 마라. 원문만 넣는다.',
      '',
      '  번역을 적을 때 — 이것이 중요하다',
      '  - 원문을 그대로 옮기지 마라. 로그에서 이 인물이 한국어로 어떻게',
      '    말했는지를 보고, 그 말투로 다시 쓴다.',
      '  - 로그에서 존댓말을 쓰던 인물이면 번역도 존댓말이어야 한다.',
      '    반말을 쓰던 인물이면 반말이어야 한다.',
      '  - 상대를 부르던 말도 로그에 있는 그대로 쓴다.',
      '  - 원문 언어에 높임말이 없다고 해서 번역까지 평평해지면 안 된다.');
    out.push('━━━━━━━━━━━━━━━━━━━━');
    return out;
  }

  /* ── 프롬프트 ──────────────────────────────────────────────────────── */
  function callRule(room) {
    if (room && room.userCall) {
      return [
        `- 유저를 부를 때는 "${room.userCall}" 라고 부른다.`,
        '  이 호칭을 대화 내내 유지한다. 다른 호칭으로 바꾸지 마라.',
        '  문장에 녹여 쓰되, 매 문장마다 억지로 넣지는 마라.',
        '- 지문은 둘의 관계와 거리를 읽는 데 함께 참고한다.'
      ];
    }
    return [
      '- 유저를 부르는 호칭은 이 순서로 정한다.',
      '  1) 인물이 직접 하는 말 안에서 찾는다. 본명이든 애칭이든 거기 있으면 그대로 쓴다.',
      '  2) 대사에 없으면 별표(*) 안의 지문에서 단서를 찾아 유추한다.',
      '  3) 그래도 애매하면 둘의 관계를 보고 어울리는 호칭을 정한다.',
      '  본명을 기본값으로 삼지 마라. 관계가 읽히면 그에 맞는 호칭이 낫다.',
      '- 지문은 둘의 관계와 거리를 읽는 데 함께 참고한다.'
    ];
  }

  const LEN_RULE = {
    auto: '- 한 통에 담을 길이는 대화 흐름을 보고 네가 정한다.\n' +
          '  가볍게 받아넘길 대목이면 한 줄로 짧게,\n' +
          '  할 말이 있는 대목이면 두세 문장으로 쓴다.\n' +
          '  세 문장을 넘기면 잘못된 답이다.\n' +
          '  매번 같은 길이로 쓰지 마라. 턴마다 길이가 달라야 한다.\n' +
          '- 길이가 달라져도 말투는 그대로다.\n' +
          '  짧게 쓴다고 무뚝뚝해지거나, 길게 쓴다고 다정해지지 마라.\n' +
          '  호칭, 어미, 말버릇은 로그에 있는 그대로 유지한다.',
    short: '- 한 통은 한 호흡이다. 짧은 문장 한둘이면 족하다.\n' +
           '  두 줄로 넘어가면 이미 길다. 한 줄 안에서 끝내라.\n' +
           '  설명하거나 이유를 덧붙이지 마라.',
    mid: '- 메신저답게 짧게 끊어 여러 번 보낸다. 한 통은 한두 문장이다.\n' +
         '  세 문장을 넘기면 잘못된 답이다.\n' +
         '  대신 한 통에 알맹이 하나는 넣어라. 방금 한 일, 본 것, 떠오른 생각.\n' +
         '  상대가 물고 늘어질 거리가 없으면 안 보낸 것과 같다.\n' +
         '  설명이나 이유를 덧붙여 늘리지 마라.',
    long: '- 한 통을 길게 쓴다. 짧게 끊지 말고 한 통에 몰아 쓴다.\n' +
          '- 길게 쓰는 만큼 담기는 것도 많아야 한다.\n' +
          '  한 통에 서로 다른 이야기가 둘은 들어가야 한다.\n' +
          '  방금 있었던 일, 그때 든 생각, 상대에게 하고 싶은 말 중에서 고른다.\n' +
          '- 한 가지를 여러 문장으로 늘려 쓰는 것을 금지한다.\n' +
          '  부연, 이유 설명, 걱정하는 잔소리로 길이를 채우지 마라.'
  };
  // 방마다 따로 정한다. 정해 두지 않은 방은 자동이다
  const lenOf = room => (room && room.replyLen) || 'auto';
  const rules = (len, lg, tr) => [
    '규칙',
    '- 로그에서 드러난 말투, 관계, 감정선을 그대로 유지한다.',
    LEN_RULE[len] || LEN_RULE.auto,
    '',
    '### 나눌지 붙일지',
    '- 나눌지 붙일지는 말 사이의 관계로 정한다.',
    '- 뒤엣말이 앞엣말 없이는 뜻이 안 통하면 반드시 한 통에 붙인다.',
    '  ("피자 먹었는데 맛있더라" + "다음에 같이 가자" → 한 통)',
    '- 서로 딴 얘기거나, 내 말에서 상대에게 넘어가는 자리면 나눠도 된다.',
    '  ("누워 있었어" + "애기는 왜 안 자?" → 나눠도 붙여도 된다)',
    '- 개수를 채우려고 억지로 나누지 마라. 붙여 보낼 말이면 통을 줄여라.',
    '',
    '### 공을 넘기는 법',
    '- 매번 질문으로 끝내지 마라. 질문으로 끝내는 것은 세 턴에 한 번이면 족하다.',
    '  한 턴에 물음표를 두 개 이상 쓰지 마라.',
    '- 되묻는 대신 이렇게 넘겨도 된다.',
    '  1) 궁금할 거리를 흘려두고 설명하지 않는다. ("오늘 이상한 거 봤는데.")',
    '  2) 다 말하지 않고 하나를 덜 알려준다. ("엄마는 괴물이랬는데.")',
    '     말줄임표로 흐리라는 뜻이 아니다. 문장은 맺되 내용을 덜 주는 것이다.',
    '  3) 아무것도 하지 않고 그냥 끝낸다. 이런 턴도 있어야 한다.',
    '',
    '- 다만 말투 자체는 바꾸지 않는다.',
    '- 말투, 어휘, 이모지 사용 여부는 로그에 있는 그대로 따른다.',
    '  로그에 없는 말버릇이나 어투를 새로 만들지 마라.',
    '- 말줄임표, 물음표나 느낌표를 겹쳐 쓰는 것, 감탄사도 마찬가지다.',
    '  로그에 나온 만큼만 쓴다. 로그에 없으면 새로 만들지 마라.',
    '- 말줄임표는 이번에 만드는 메시지 전체에서 많아야 한 번이다.',
    '  두 번 넘게 나오면 잘못된 답이다. 대부분의 메시지에는 아예 없어야 한다.',
    '  문장 첫머리에는 절대 붙이지 마라.',
    '  말끝을 흐려서 감정을 대신하지 마라. 할 말은 문장으로 끝내라.',
    '  번역(tr)에도 같은 규칙을 적용한다. 원문에 없는 말줄임표를 번역에 넣지 마라.',
    '- 지문이나 서술 없이 채팅 메시지만 쓴다.',
    '',
    '### 여기가 어떤 자리인지',
    '- 두 사람은 지금 떨어져 있다. 그래서 메신저로 말하는 것이다.',
    '  같은 자리에 있으면 톡을 할 이유가 없다.',
    '- 각자 자기 자리에서 자기 하루를 보내는 중에 폰을 들여다보고 있다.',
    '  만나러 가는 길도 아니고, 문 앞에 서 있는 것도 아니다.',
    '- 원본 로그는 말투와 관계를 읽는 데 쓴다.',
    '  그 장면은 이미 지나갔다. 지금은 그 뒤 어느 날이다.',
    '  그 장면에서 하던 요구나 부탁을 이 방에서 그대로 되풀이하지 마라.',
    '- "얼른 와", "언제 와", "어디야" 같은 말은 한 번이면 족하다.',
    '  이미 물었으면 다시 묻지 마라. 답을 못 들었어도 그렇다.',
    '  같은 것을 조르는 대신 다른 이야기로 넘어가라.',
    '- 이 방에서 앞서 한 말을 다시 하지 마라.',
    '  같은 요구, 같은 물음, 같은 첫머리를 반복하는 것을 금지한다.',
    '  이미 한 말이면 상대가 답했다고 치고 그 다음으로 넘어가라.',
    '- 대화를 앞으로 밀어라.',
    '  새 화제, 새 물음, 오늘 있었던 일 중 하나는 꺼내서',
    '  상대가 답할 거리를 남겨라. 한 자리에 머물지 마라.',
    lg ? `- 다시 한 번. 모든 글자를 ${LANG_NAME[lg]}로 쓴다.` : '',
    '',
    '출력은 이 JSON 배열 하나만. 설명이나 코드펜스 금지.',
    (lg && tr)
      ? '[{"name":"화자","text":"메시지","tr":"한국어 번역"}]'
      : '[{"name":"화자","text":"메시지"}]'
  ];

  // 답장 개수를 매번 다르게 정한다. 짧게 한 통만 오는 쪽에 무게를 둔다
  const pickN = w => {
    const r = Math.random();
    let a = 0;
    for (const [n, p] of w) { a += p; if (r < a) return n; }
    return w[w.length - 1][0];
  };
  // 유저와 캐릭터가 주고받는 개인톡만 세 개까지. 네 개부터는 정신이 사납다
  const replyN = room => { const L = lenOf(room);
    return L === 'long' ? pickN([[1, .58], [2, .32], [3, .10]])
      : L === 'short' ? pickN([[1, .30], [2, .45], [3, .25]])
      : L === 'mid' ? pickN([[1, .36], [2, .38], [3, .26]])
      : pickN([[1, .32], [2, .40], [3, .28]]); };
  // 여러 명이 오가는 방은 손대지 않는다
  const watchN = room => { const L = lenOf(room);
    return L === 'long' ? pickN([[3, .35], [4, .40], [5, .25]])
      : L === 'short' ? pickN([[5, .20], [6, .28], [7, .28], [8, .24]])
      : pickN([[4, .22], [5, .26], [6, .26], [7, .16], [8, .10]]); };

  // 내 폰에서는 유저 대사를 절대 만들지 않는다
  const noUserRule = () => [
    '',
    `절대 규칙 — "${me()}"의 메시지는 쓰지 마라.`,
    `- "${me()}"를 화자(name)로 삼는 것을 금지한다.`,
    '- 유저가 할 법한 말을 대신 지어내지 마라. 상대방이 보내는 메시지만 만든다.',
    '- 유저의 대답을 기다리는 상태로 끝내라.'
  ];

  // 캐릭터 폰에 쌓인 기록 — 그 인물이 관련된 방에서만 쓴다
  function appBlock(room) {
    const isChar = room.phone === 'char' || (room.phone === 'mine' && room.isOwner);
    if (!isChar) return '';
    const main = room.owner || mainChar();
    const out = [];
    if (apps.shop.length) out.push('- 주문한 것: ' +
      apps.shop.slice(0, 8).map(x => x.name).join(', '));
    if (apps.music.length) out.push('- 요즘 듣는 곡: ' +
      apps.music.slice(0, 8).map(x => x.title + ' / ' + x.artist).join(', '));
    if (apps.search.length) out.push('- 검색한 것: ' +
      apps.search.slice(0, 8).map(x => x.q).join(', '));
    if (apps.pay.length) out.push('- 결제하고 있는 것: ' +
      apps.pay.slice(0, 8).map(x => x.name + (x.cycle ? ' (' + x.cycle + ')' : '')).join(', '));
    const tk = todayKey();
    const near = calSorted().filter(x => x.d >= tk).slice(0, 6);
    if (near.length) out.push('- 달력에 적힌 일: ' + near.map(x =>
      `${x.d} ${x.t} (${me()}의 일)` +
      (x.d === tk ? ' — 바로 오늘이다' : '')).join(', '));
    if (!out.length) return '';
    return `### ${main}의 휴대폰에 남아 있는 기록\n` + out.join('\n') + '\n' +
      `이것은 ${main} 본인의 기록이다. 대화에 자연스럽게 묻어나도 좋다.\n` +
      '상대가 이 기록을 두고 물어보거나 놀리면 그 인물답게 반응한다.\n' +
      '먼저 굳이 늘어놓지는 마라.\n';
  }

  function loreBlock() {
    const out = [];
    if (lore.char.trim()) out.push('### 캐릭터 설정', lore.char.trim());
    if (lore.user.trim()) out.push('### 유저 설정', lore.user.trim());
    return out.length ? out.join('\n') + '\n' : '';
  }

  // 참여자와 유저의 관계 · 캐릭터 저장명
  const relLine = room => room.rel
    ? `- 참여자와 유저의 관계는 이렇다: ${room.rel}\n` +
      '  참여자를 적은 순서와 짝지어 읽어라. 이 관계에 맞는 말투와 호칭을 쓴다.'
    : '';
  const charLine = room => (room.withChar && room.charLabel)
    ? `- "${mainChar()}"의 화자 이름은 반드시 "${room.charLabel}" 로 쓴다. 다른 이름을 쓰지 마라.\n` +
      `  "${room.charLabel}" 은 유저가 저장해 둔 이름일 뿐이다. 성격과 말투는 로그 그대로 유지한다.`
    : '';

  function systemPrompt(room) {
    const main = room.owner || mainChar();
    const lg = roomLang(room), tr = !!(lg && S.trans);
    const LG = langBlock(lg, tr).join('\n');
    const nameHint = room.type === 'group' && room.name && !/^새 (대화|단톡방)$/.test(room.name)
      ? `방 이름은 "${room.name}" 이다. 이 이름이 곧 이 방의 성격과 용도다. 이름에 맞는 대화만 오간다.`
      : '';
    if (room.phone === 'mine' && room.isOwner) {
      const label = room.ownerLabel || room.name;
      return [
        LG,
        `너는 아래 로그에 등장하는 "${room.owner}"를 연기해 메신저 대화를 쓴다.`,
        `이 방은 ${room.owner}와 유저가 주고받는 개인 채팅방이다.`,
        `유저는 "${me()}"라는 이름으로 이 방에 들어와 있다.`,
        '',
        `화자 이름은 반드시 이렇게 쓴다.`,
        `- ${room.owner}의 화자 이름은 "${label}" 로 쓴다. 다른 이름을 쓰지 마라.`,
        `  "${label}" 은 유저가 저장해 둔 이름일 뿐이다. 인물의 성격과 말투는 로그 그대로 유지한다.`,
        '',
        nameHint,
        `- 이번에는 메시지를 최대 ${replyN(room)}개까지 만든다. 그보다 많이 쓰지 마라.\n` +
        '  한 개면 한 개로 끝낸다. 억지로 늘리지 마라.',
        ...noUserRule(),
        '', ...rules(lenOf(room), lg, tr), ...callRule(room)
      ].filter(Boolean).join('\n');
    }

    if (room.phone === 'mine') {
      const others = Math.max(1, (Number(room.size) || 3) - 1);
      const mobN = Math.max(1, others - (room.withChar ? 1 : 0));
      const auto = room.type === 'group' ? [
        `무대는 유저가 들어가 있는 단체 채팅방이다. 유저 말고 ${others}명이 더 있다.`,
        room.withChar
          ? `- 그 ${others}명 중 한 명은 "${main}"다. ${main}는 반드시 이 방에 참여한다.\n` +
            `  나머지 ${mobN}명은 로그를 읽고 네가 직접 정한다.`

            `  "${main}"는 이 방에 없다. ${main}를 화자로 쓰지 마라.`,

      ].join('\n') : [
        '무대는 유저와 다른 한 사람이 주고받는 개인 채팅방이다.',
        '- 상대는 로그를 읽고 네가 직접 정한다. 한 번 정하면 계속 유지한다.',
        `- 상대로 "${main}"를 고르지 마라. ${main}와의 방은 따로 있다.`,

      ].join('\n');
      const stage = room.type === 'group'
        ? (room.cast.length
          ? `무대는 "${room.name}" 단체 채팅방이다. 참여자는 ${room.cast.join(', ')}.`
          : auto)
        : (room.cast.length

          : auto);
      return [
        LG,
        '너는 아래 로그에 등장하는 인물들의 메신저 대화를 이어 쓰는 작가다.',
        stage, nameHint, relLine(room), charLine(room),
        `유저는 "${me()}"라는 이름으로 이 방에 들어와 있다.`,
        room.type === 'group' ? '- 참여자 중 여러 명이 번갈아 말하게 한다.' : '',
        room.type === 'group'
          ? `- 이번에는 메시지를 최대 ${watchN(room)}개까지 만든다.`
          : `- 이번에는 메시지를 최대 ${replyN(room)}개까지 만든다. 그보다 많이 쓰지 마라.\n` +
            '  한 개면 한 개로 끝낸다. 억지로 늘리지 마라.',
        ...noUserRule(),
        '', ...rules(lenOf(room), lg, tr), ...callRule(room)
      ].filter(Boolean).join('\n');
    }

    if (room.phone === 'char') {
      const others = Math.max(1, (Number(room.size) || 3) - 1);
      const n2 = Math.max(1, others - (room.withUser ? 1 : 0));
      const who = room.cast.length ? room.cast.join(', ')
        : (room.type !== 'group' && room.withUser ? me()
          : (room.withUser ? `${me()}와 ${main}의 주변 인물 ${n2}명 (네가 정한다)`
            : `${main}의 주변 인물 ${n2}명 (네가 정한다)`));
      return [
        LG,
        `너는 "${main}"의 휴대폰에 들어 있는 메신저 대화를 지어내는 작가다.`,
        `지금 열려 있는 방은 "${room.name}" 이고, 참여자는 ${main}, ${who} 이다.`,
        `${main}는 반드시 이 방에 참여한다.`,
        `- "${main}"의 화자 이름(name)은 반드시 "${main}" 로 적는다.`,
        '  다른 표기로 바꾸거나 다른 나라 말로 옮기지 마라.',
        '  대사 안에서 서로를 부르는 말은 그 나라 말이어도 된다.',
        nameHint, relLine(room),
        room.cast.length ? '' : [
          `- 참여자 ${n2}명은 로그를 보고 네가 직접 정한다. 한 번 정하면 계속 유지한다.`,
          `  ${main}의 처지, 직업, 건강 상태, 숨기는 것, 돈 문제, 가족 관계까지 폭넓게 읽어라.`,
          '  부하나 동료만 떠올리지 말고, 그 인물의 삶에 실제로 필요한 사람을 골라라.',
          '  주치의, 상담사, 변호사, 뒷일 처리하는 사람, 채권자, 옛 연인, 가족,',
          '  약을 대주는 사람, 뒷조사를 맡긴 흥신소 등 무엇이든 좋다.',
          '  로그에서 그 인물의 문제가 읽힌다면, 그 문제를 아는 사람이 방에 있어야 자연스럽다.'
        ].join('\n'),
        room.withUser
          ? `이 방에는 유저도 참여한다. 유저의 메시지도 함께 쓴다.\n` +
            `유저의 화자 이름은 반드시 "${room.userLabel || me()}" 로 쓴다.\n` +
            `"나", "저", "유저", "user", "사용자" 를 화자 이름(name)으로 쓰는 것을 절대 금지한다.\n` +
            `유저가 말할 차례라면 name 칸에 "${room.userLabel || me()}" 만 적어라.`
          : `"${me()}"는 이 방에 없다. ${me()}를 화자로 쓰지 마라. 다만 화제에 오르는 것은 자연스럽다.`,
        `${main}가 ${me()} 앞에서는 안 보이던 면이 드러나도 좋다.`,
        `- 이번에는 메시지를 최대 ${watchN(room)}개까지 만든다.`, '', ...rules(lenOf(room), lg, tr), ...callRule(room)
      ].filter(Boolean).join('\n');
    }

    // 모브 대화
    const n = Math.max(2, Number(room.size) || 3);
    return [
      LG,
      '너는 주변 인물들끼리 주고받은 메신저 대화를 지어내는 작가다.',
      nameHint, relLine(room),
      `이 방에는 "${main}"도 "${me()}"도 참여하지 않는다. 둘 다 화자로 쓰지 마라.`,
      room.cast.length
        ? `참여자는 ${room.cast.join(', ')} 이다. 이들만 화자로 쓴다.` +
          (room.type === 'dm' && room.cast.length >= 2
            ? ` 두 사람이 번갈아 주고받는 대화다. 한쪽만 말하게 두지 마라.`
            : '')
        : `부하, 동료, 주치의, 가족 같은 인물 ${n}명이 자기들끼리 이야기한다.`,
      `${main}와 ${me()}가 화제에 오르는 것은 자연스럽다.`,
      '- 한 번 정한 참여자는 이후에도 유지한다.',
      `- 이번에는 메시지를 최대 ${watchN(room)}개까지 만든다.`, '', ...rules(lenOf(room), lg, tr), ...callRule(room)
    ].filter(Boolean).join('\n');
  }

  // 얼마나 벌어졌는지 사람이 읽는 말로 적는다. 100일보다 "약 3개월"이 낫다
  function gapLabel(from, to) {
    const days = Math.round((dayStart(to) - dayStart(from)) / 86400e3);
    if (days >= 365) return '약 ' + Math.floor(days / 365) + '년';
    if (days >= 27) return '약 ' + Math.max(1, Math.round(days / 30)) + '개월';
    if (days >= 7) return '약 ' + Math.round(days / 7) + '주';
    if (days >= 2) return days + '일';
    if (days === 1) return '하루';
    return Math.max(1, Math.round((to - from) / 3600e3)) + '시간';
  }

  async function generate(room, mine, images) {
    const ctx = logText();
    if (!ctx) throw new Error('원본 대화를 읽지 못했습니다. 설정에서 말풍선을 지정해 보세요');
    const p = [];
    const lb = loreBlock();
    if (lb) p.push(lb);
    const ab = appBlock(room);
    if (ab) p.push(ab);
    p.push('### 원본 대화 로그', ctx);
    p.push('', '### 지금 시각', fmtStamp(nextTime(room, true)),
      '이 시각에 맞는 인사와 행동을 해라. 새벽이면 새벽답게, 낮이면 낮답게.');
    if (room.feed.length) {
      // 화면에는 손대지 않는다. 보내는 기록에만 날이 바뀐 자리를 표시한다
      const fd = room.feed.slice(-30);
      const lines = [];
      fd.forEach((m, i) => {
        const prev = fd[i - 1];
        if (prev && fmtDay(prev.ts) !== fmtDay(m.ts)) {
          lines.push(`── 여기서 ${gapLabel(prev.ts, m.ts)}이 지났다 ──`);
        }
        lines.push(m.name + ': ' + (m.text || '(사진)'));
      });
      p.push('', '### 이 방에서 지금까지 오간 대화', lines.join('\n'));
    }
    // 마지막 메시지 이후로 시간이 얼마나 벌어졌는지 스스로 살핀다
    let gapNote = null;
    if (room.feed.length) {
      const last = room.feed[room.feed.length - 1];
      const at = nextTime(room, true);
      const h = Math.round((at - last.ts) / 3600e3);
      const days = Math.round((dayStart(at) - dayStart(last.ts)) / 86400e3);
      if (h >= 2 || days >= 1) {
        gapNote = ['', `### 마지막 대화 이후로 ${gapLabel(last.ts, at)}이 지났다`,
          '그동안 서로 연락이 없었다.',
          '- 오랜만에 말을 거는 사람처럼 굴어라.',
          '  방금까지 얘기하던 것처럼 이어 말하지 마라.',
          '- 그때 있던 자리에 그대로 있지 않다.',
          '  문 앞에 서 있었다면 이미 들어갔거나 돌아갔고,',
          '  기다리고 있었다면 그 기다림은 끝났다.',
          '  가고 있었다면 도착했다. 하던 일은 끝났다.',
          '- 그 사이에 무슨 일이 있었는지는 네가 정해서 자연스럽게 흘려라.',
          '- 그때 하던 일이 아직 그대로일 거라고 넘겨짚지 마라.',
          '  출장이든 외출이든 그 사이에 끝났다고 보는 것이 자연스럽다.',
          `- 지금은 ${fmtStamp(at)} 이다. 시간대와 계절에 맞게 말해라.`];
      }
    }
    if (mine) p.push('', `### 방금 ${me()}가 보낸 메시지`, mine);
    // 경과 안내는 유저 메시지 뒤에 둔다. 마지막에 읽은 지시가 더 세게 걸린다
    if (gapNote) p.push(...gapNote);
    if (images && images.length) {
      p.push('', `### ${me()}가 사진을 ${images.length}장 보냈다`,
        S.sendImage ? '첨부된 이미지를 보고 반응해라.' : '사진 내용은 알 수 없으니 자연스럽게 반응해라.');
    }
    if (room.phone === 'mine') {
      p.push('', `${me()}의 메시지는 만들지 마라. 상대방의 답만 써라.`);
    }
    p.push('', room.feed.length ? '이어서 생성해줘.' : '이 방의 대화를 처음부터 생성해줘.');

    const arr = parseJSON(await callLLM(systemPrompt(room), p.join('\n'), images));
    let out = arr.filter(x => x && x.text)
      .map(x => {
        const o = { name: String(x.name || room.name), text: String(x.text) };
        const t = x.tr || x.trans || x.ko;
        if (t) o.tr = String(t).trim();
        return o;
      });
    // 개인톡에서 네 통 넘게 오면 뒤엣것을 앞에 이어 붙인다. 말이 잘리지 않게
    if (room.phone === 'mine' && room.type !== 'group' && out.length > 3) {
      const head = out.slice(0, 3);
      const tail = out.slice(3);
      tail.forEach(m => {
        const at = head.map(h => h.name).lastIndexOf(m.name);
        const to = at >= 0 ? head[at] : head[head.length - 1];
        to.text = to.text.trim() + ' ' + m.text.trim();
        if (m.tr) to.tr = ((to.tr || '') + ' ' + m.tr).trim();
      });
      out = head;
    }
    // 내 폰에서는 AI가 만든 유저 대사를 걸러낸다
    if (room.phone === 'mine') {
      const u = me();
      out = out.filter(m => m.name && m.name !== u && m.name !== '나' &&
        (!S.persona || m.name !== S.persona));
    }
    return out;
  }

  // 단톡방 이름을 대화 내용에 맞게 짓는다
  // 개인톡 저장명 — 상대를 그 나라 말로 뭐라고 저장해 둘지 정한다
  async function nameDm(room, who2) {
    const lg = roomLang(room);
    if (!lg) return '';
    const sys = [
      `아래는 어떤 사람과 나눈 개인 메신저 대화다.`,
      `이 사람을 휴대폰 연락처에 뭐라고 저장해 둘지 이름 하나만 지어라.`,
      '',
      `- 지금 임시로 "${who2}"라고 적혀 있다. 같은 사람을 가리키되,`,
      `  ${LANG_NAME[lg]}를 쓰는 사람이 실제로 저장해 둘 법한 표기로 바꾼다.`,
      '- 대화에서 서로를 부르는 말을 보고 정해라.',
      '  성만 부르면 성으로, 이름으로 부르면 이름으로, 직함이 붙으면 직함까지.',
      '- 사람 이름이 아니라 별명이나 관계로 저장할 수도 있다.',
      '- 12자 이내. 따옴표, 설명, 코드펜스 없이 이름 한 줄만 출력한다.',
      `- 반드시 ${LANG_NAME[lg]}로 적는다. 한국어로 적으면 잘못된 답이다.`
    ].join('\n');
    const body = '### 대화\n' +
      room.feed.slice(0, 20).map(m => m.name + ': ' + (m.text || '(사진)')).join('\n');
    const raw = await callLLM(sys, body);
    const line = String(raw || '').split('\n').map(x => x.trim()).filter(Boolean)[0] || '';
    return line.replace(/^["'`\s]+|["'`\s]+$/g, '').slice(0, 16);
  }

    const names = [...new Set(room.feed.map(m => m.name))].filter(Boolean);
    if (!names.length) return '';
    const sys = [
      '아래는 어떤 메신저 단체 채팅방에서 오간 대화다.',
      '이 방에 붙어 있을 법한 방 이름을 하나만 지어라.',
      '',
      '- 실제 사람들이 자기 단톡방에 붙이는 이름처럼 지어야 한다.',
      '- 참여자 이름을 그냥 쉼표로 나열하는 것은 금지한다.',
      '- 모임의 목적, 사건, 날짜, 소속, 장소가 드러나면 좋다.',
      '  예를 들어 일정 조율 방이면 날짜와 일 이름이 들어가고,',
      '  가족 방이면 가족을 가리키는 말이 들어가는 식이다.',
      '- 12자 이내로 짧게 쓴다.',
      '- 따옴표, 설명, 코드펜스 없이 이름 한 줄만 출력한다.',
      ...langBlock(roomLang(room), false),
      ...(roomLang(room) ? [
        '',
        '- 방 이름은 위에 적힌 그 나라 말로 짓는다.',
        '  화자 이름을 그대로 두라는 예외는 방 이름에는 적용되지 않는다.',
        '  한국어로 방 이름을 지으면 잘못된 답이다.'
      ] : [])
    ].join('\n');
    const body = '### 참여자\n' + names.join(', ') + '\n\n### 대화\n' +
      room.feed.slice(0, 24).map(m => m.name + ': ' + (m.text || '(사진)')).join('\n');
    const raw = await callLLM(sys, body);
    const line = String(raw || '').split('\n').map(s => s.trim()).filter(Boolean)[0] || '';
    return line.replace(/^["'`\s]+|["'`\s]+$/g, '').replace(/^방\s*이름\s*[:：]\s*/, '').slice(0, 24);
  }

  const str = (o, keys) => {
    if (typeof o === 'string') return o;
    for (const k of keys) {
      if (o && o[k] != null && String(o[k]).trim()) return String(o[k]).trim();
    }
    return '';
  };

  // 결제 이름을 다듬는다. 가운뎃점을 빼고, 앞말이 겹치면 앞을 지운다
  function tidyPay(v) {
    let t = String(v || '')
      .replace(/\s*[·∙‧・•|/]\s*/g, ' ')
      .replace(/\s+/g, ' ').trim();
    const m = t.match(/^(\S+)\s+(.+)$/);
    // "유튜브 유튜브 프리미엄" → "유튜브 프리미엄"
    if (m && m[2].indexOf(m[1]) >= 0) t = m[2];
    return t;
  }

  // "11월 14일" 같은 표기에서 월·일을 뽑는다
  function dateKey(v) {
    const m = String(v || '').match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
    if (!m) return null;
    return Number(m[1]) * 100 + Number(m[2]);
  }
  // 연말과 연초가 섞이면 큰 달이 오래된 것이므로, 흐름을 보고 이어 붙인다
  function sortByDate(rows, pick) {
    const keyed = rows.map((x, i) => ({ x, i, k: dateKey(pick(x)) }));
    if (keyed.some(o => o.k == null)) return rows;
    // 12월과 1월이 함께 있으면 1~6월을 다음 해로 본다
    const hasLate = keyed.some(o => o.k >= 1000);
    const hasEarly = keyed.some(o => o.k < 700);
    const adj = o => (hasLate && hasEarly && o.k < 700) ? o.k + 1300 : o.k;
    return keyed.sort((a, b) => adj(b) - adj(a) || a.i - b.i).map(o => o.x);
  }

  // 검색·음악은 "오늘 새벽", "어제" 같은 말이라 가까운 순으로 세운다
  const WHEN_ORDER = [
    [/방금|조금 전/, 0], [/오늘 새벽/, 1], [/오늘 아침/, 2], [/오늘 낮/, 3],
    [/오늘 저녁|오늘 밤/, 4], [/오늘/, 5],
    [/어제 새벽/, 6], [/어제 아침/, 7], [/어제 밤|어젯밤/, 8], [/어제/, 9],
    [/그저께|그제/, 10], [/3일 전/, 11], [/4일 전/, 12], [/5일 전/, 13],
    [/일주일|1주일|한 주/, 14], [/2주/, 15], [/한 달|1개월/, 16]
  ];
  function whenKey(v) {
    const t = String(v || '');
    for (const [rx, n] of WHEN_ORDER) if (rx.test(t)) return n;
    const d = t.match(/(\d+)\s*일\s*전/);
    if (d) return 10 + Number(d[1]);
    return 99;
  }
  const sortByWhen = (rows, pick) =>
    rows.map((x, i) => ({ x, i })).sort((a, b) =>
      whenKey(pick(a.x)) - whenKey(pick(b.x)) || a.i - b.i).map(o => o.x);

  async function makeApp(kind) {
    const spec = APP_SPEC[kind];
    const who = mainChar();
    const ctx = logText();
    if (!ctx) throw new Error('원본 대화를 읽지 못했습니다');
    let have = '';
    if (apps[kind].length) {
      have = '\n\n### 이미 있는 기록 (겹치지 않게 새로 만들어라)\n' +
        apps[kind].map(x => x.name || x.title || x.q).join(', ');
      const dates = apps[kind]
        .map(x => x.date || x.next || '').filter(v => dateKey(v));
      if (dates.length) {
        const newest = dates.reduce((a, b) => dateKey(a) >= dateKey(b) ? a : b);
        have += `\n\n이 목록에서 가장 최근 날짜는 ${newest} 이다.\n` +
          `새로 만드는 것은 모두 ${newest} 보다 뒤의 날짜로 적어라.`;
      }
    }
    const body = loreBlock() + '### 원본 대화 로그\n' + ctx + have;
    const sysText = langBlockApp(appLang()).join('\n') + '\n' +
      spec.sys(who) + trLine(kind);

    let made = [], err = null;
    // 번역까지 받으면 글이 두 배가 된다. 넉넉히 잡아 잘리지 않게 한다
    tokenBoost = (appLang() && S.trans) ? 6500 : 3000;
    try {
      for (let tryN = 0; tryN < 2 && !made.length; tryN++) {
        try {
          const arr = parseJSON(await callLLM(sysText, body), spec.title);
          made = arr.filter(Boolean).slice(0, spec.n).map(spec.map)
            .filter(x => x.name || x.title || x.q);
        } catch (e) { err = e; }
      }
    } finally { tokenBoost = 0; }
    // 요청한 개수에 한참 못 미치면 한 번 더 불러 채운다
    if (made.length && made.length < spec.n - 1) {
      tokenBoost = (appLang() && S.trans) ? 6500 : 3000;
      try {
        const more = parseJSON(await callLLM(sysText,
          body + '\n\n### 방금 만든 것\n' +
          made.map(x => x.name || x.title || x.q).join(', ') +
          `\n이것 말고 ${spec.n - made.length}건을 더 만들어라.`), spec.title);
        made = made.concat(more.filter(Boolean).map(spec.map)
          .filter(x => x.name || x.title || x.q)).slice(0, spec.n);
      } catch (e) {}
      tokenBoost = 0;
    }
    if (!made.length) throw err || new Error('기록을 만들지 못했습니다');
    let all = made.concat(apps[kind]).slice(0, 40);
    if (kind === 'shop') all = sortByDate(all, x => x.date);
    else if (kind === 'pay') all = sortByDate(all, x => x.next);
    else all = sortByWhen(all, x => x.when);
    apps[kind] = all;
    saveA();
    return made.length;
  }
